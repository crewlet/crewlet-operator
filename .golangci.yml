# Lint configuration for both Go modules; `make lint` runs it in each.
version: "2"
run:
  allow-parallel-runners: true
  # Exclusion paths below are relative to this file, so the run in api/
  # matches them the same way as the run at the root.
  relative-path-mode: cfg
  # The e2e suite is behind a build tag; lint it with everything else.
  build-tags:
    - e2e
linters:
  default: none
  enable:
    - copyloopvar
    - depguard
    - dupl
    - errcheck
    - errorlint
    - exhaustive
    - ginkgolinter
    - gocritic
    - goconst
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - kubeapilinter
    - lll
    - logcheck
    - misspell
    - modernize
    - nakedret
    - nilerr
    - nolintlint
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - wastedassign
  settings:
    custom:
      logcheck:
        type: module
        description: Checks Go logging calls for Kubernetes logging conventions.
      kubeapilinter:
        type: module
        description: Checks API types against the Kubernetes API conventions.
        settings:
          linters:
            enable:
              - statusoptional
              - statussubresource
            disable:
              # Documented by the linter as meant for natively validated
              # types; a CRD's optionality is enforced by its OpenAPI schema,
              # which optionalfields and requiredfields check.
              - nonpointerstructs
          lintersConfig:
            conditions:
              # CRDs are served as JSON and patched with merge or server-side
              # apply, never strategic merge, and have no protobuf encoding.
              usePatchStrategy: Ignore
              useProtobuf: Ignore
            optionalfields:
              pointers:
                # A pointer only where the zero value is valid and must stay
                # distinguishable from unset.
                preference: WhenRequired
    depguard:
      rules:
        forbid-sort-pkg:
          deny:
            - pkg: sort
              desc: Should be replaced with slices package
        # The API module is imported by consumers that must not inherit the
        # operator's dependency tree; see CONTRIBUTING.md.
        api-module:
          files:
            - "**/api/**/*.go"
          deny:
            - pkg: sigs.k8s.io/controller-runtime
              desc: the API module depends on k8s.io/api and k8s.io/apimachinery only
            - pkg: github.com/crewlet/crewlet-operator/internal
              desc: the API module cannot import the operator
    exhaustive:
      # A switch over an enum with a default branch has made its choice.
      default-signifies-exhaustive: true
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
    nolintlint:
      # A //nolint must name the linter and say why it is wrong at that spot.
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: comment-spacings
        - name: import-shadowing
        - name: exported
        - name: package-comments
        - name: errorf
        - name: error-strings
        - name: increment-decrement
        - name: indent-error-flow
        - name: superfluous-else
        - name: unused-parameter
        - name: unreachable-code
    modernize:
      disable:
        - omitzero
  exclusions:
    generated: lax
    rules:
      - linters:
          - lll
        path: api/
      - linters:
          - dupl
          - lll
        path: internal/
      # The API conventions apply to API types, not to the operator.
      - linters:
          - kubeapilinter
        path-except: api/
      # The e2e suite drives kubectl and make with arguments it builds itself.
      - linters:
          - gosec
        path: test/
        text: "G204"
      # test/enginecommit reads the registry of the image reference it is
      # handed, and the token realm that registry names: requesting a host
      # its input names is the program's whole job, and its tests' fake
      # registry redirects to a fake storage host the same way.
      - linters:
          - gosec
        path: test/enginecommit/
        text: "G704|G710"
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/crewlet/crewlet-operator
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
