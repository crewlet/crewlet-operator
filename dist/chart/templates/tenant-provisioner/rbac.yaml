{{- /*
Written by hand, unlike the rest of templates/: kustomize has no opt-in
switch for the chart generator to turn into one. The operator itself never
uses these roles.

The provisioner holds no Secret access of its own. It creates each tenant's
namespace and binds the tenant-access role in it, which is what lets it
write that tenant's Secrets and crewlet.ai objects; policy.yaml keeps every
namespace write, and every binding, to namespaces that carry the tenant
label. RBAC alone cannot: a ClusterRole that may write Secrets anywhere is
cluster-admin (a service-account-token Secret for kube-system's
ServiceAccounts), and one that may delete or relabel namespaces may delete
kube-system or lift a namespace's Pod Security level.
*/ -}}
{{- if .Values.tenantProvisioner.enabled }}
{{- $access := include "crewlet-operator.resourceName" (dict "suffix" "tenant-access" "context" $) }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "crewlet-operator.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  name: {{ include "crewlet-operator.resourceName" (dict "suffix" "tenant-provisioner" "context" $) }}
rules:
# Each tenant's namespace, created and deleted with the tenant: the operator
# never creates one. Only namespaces with the tenant label (policy.yaml).
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
# The tenant-access role, bound in each tenant's namespace and nowhere else
# (policy.yaml).
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - rolebindings
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - clusterroles
  resourceNames:
  - {{ $access }}
  verbs:
  - bind
# What the operator reports on every tenant's objects (endpoints, each
# Seat's identity and webhook addresses), across tenants.
- apiGroups:
  - crewlet.ai
  resources:
  - companies
  - integrations
  - llmproviders
  - mcpservers
  - seats
  - units
  - companies/status
  - integrations/status
  - llmproviders/status
  - mcpservers/status
  - seats/status
  - units/status
  verbs:
  - get
  - list
  - watch
# The platform's classes, to choose one by name. Writing them stays with the
# platform's administrators.
- apiGroups:
  - crewlet.ai
  resources:
  - engineclasses
  verbs:
  - get
  - list
  - watch
---
# What the provisioner may do inside a tenant's namespace, once it has bound
# this role there: the credentials the tenant's objects reference, the API
# access Secret each Company publishes, and the crewlet.ai objects.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "crewlet-operator.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  name: {{ $access }}
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - crewlet.ai
  resources:
  - companies
  - integrations
  - llmproviders
  - mcpservers
  - seats
  - units
  verbs:
  - create
  - delete
  - deletecollection
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - crewlet.ai
  resources:
  - companies/status
  - integrations/status
  - llmproviders/status
  - mcpservers/status
  - seats/status
  - units/status
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "crewlet-operator.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  name: {{ include "crewlet-operator.resourceName" (dict "suffix" "tenant-provisioner" "context" $) }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "crewlet-operator.resourceName" (dict "suffix" "tenant-provisioner" "context" $) }}
subjects:
  {{- toYaml .Values.tenantProvisioner.subjects | nindent 2 }}
{{- end }}
