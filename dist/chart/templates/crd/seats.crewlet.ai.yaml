{{- if .Values.crd.enabled }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    {{- if .Values.crd.keep }}
    "helm.sh/resource-policy": keep
    {{- end }}
    controller-gen.kubebuilder.io/version: v0.22.0
  name: seats.crewlet.ai
spec:
  group: crewlet.ai
  names:
    categories:
    - crewlet
    kind: Seat
    listKind: SeatList
    plural: seats
    shortNames:
    - st
    singular: seat
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.companyRef.name
      name: Company
      type: string
    - jsonPath: .spec.kind
      name: Kind
      type: string
    - jsonPath: .spec.unitRef.name
      name: Unit
      type: string
    - jsonPath: .status.conditions[?(@.type=="Applied")].status
      name: Applied
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Paused")].status
      name: Paused
      type: string
    - jsonPath: .status.placement.pool
      name: Pool
      priority: 1
      type: string
    - jsonPath: .status.placement.node
      name: Node
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Seat is one seat of a company's org chart: an AI agent the engine runs, or a
          person agents work with.

          spec.paused pauses an agent seat while keeping it in the chart; Company's
          spec.suspend stops the whole engine instead.

          Unless spec.handle is set, the Seat's metadata.name is its handle and must
          follow the handle's rules: lowercase letters, digits and '-', starting with
          a letter or digit, at most 63 characters. The handle cannot change.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec is the seat's desired state.
            properties:
              availability:
                description: |-
                  availability tells colleagues of a Human seat when to expect an
                  answer, such as "CET business hours". Crewlet's `availability`.
                maxLength: 256
                minLength: 1
                type: string
              backstory:
                description: |-
                  backstory is who the seat is; it reaches the seat's prompt. Crewlet's
                  `backstory`.
                maxLength: 8192
                minLength: 1
                type: string
              behavioralGuidelines:
                description: |-
                  behavioralGuidelines are how the seat should work. Crewlet's
                  `behavioral_guidelines`.
                items:
                  maxLength: 1024
                  minLength: 1
                  type: string
                maxItems: 32
                type: array
                x-kubernetes-list-type: atomic
              companyRef:
                description: companyRef names the Company this seat belongs to. Immutable.
                properties:
                  name:
                    description: name is the metadata.name of a Company in this object's
                      namespace.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: companyRef is immutable
                  rule: self == oldSelf
              contact:
                description: |-
                  contact is how agents reach the person in a Human seat on a chat
                  surface, and how what the person does there reaches the engine as
                  theirs. It applies to Human seats only, and is optional: a person who
                  works only through the engine's dashboard has no account to name, and
                  signs in on the seat through the engine's own identity directory. The
                  engine warns of a Human seat without one, since nothing addressed to it
                  on a chat surface reaches anybody, and the operator records the warning
                  as an EngineWarnings event on the Company.
                minProperties: 1
                properties:
                  atlassianAccount:
                    description: |-
                      atlassianAccount is the person's identity on the company's Jira and
                      Confluence, one value for both: their account id on Atlassian Cloud,
                      such as 557058:f58131cb-b67d-43c7-b30d-6b58d40bd077 and never their
                      email address, and their username on a Data Center instance, such as
                      jane.doe. Webhooks name the person by it, so it attributes what they do
                      there to their seat, and agents assign and mention them by it.
                      Crewlet's `atlassian_account_id`, which holds the username on Data
                      Center despite its name. Any value up to 255 characters without
                      whitespace is taken, since a Data Center username may hold almost any
                      character. Where the company reaches Jira or Confluence on Atlassian
                      Cloud, a value outside the form of an account id (letters, digits,
                      '_', '|', ':' and '-', at most 128 characters) is applied and reported
                      on the Seat as ResolvedRefs=False with the reason NotAnAccountID.
                    maxLength: 255
                    minLength: 1
                    pattern: ^\S+$
                    type: string
                    x-kubernetes-validations:
                    - message: 'atlassianAccount may not hold ${: the engine reads
                        a ${NAME} there as a reference, resolved from its own secret
                        store and environment, which hold credentials that are not
                        this object''s to name'
                      rule: '!self.contains(''${'')'
                  githubLogin:
                    description: githubLogin is the person's GitHub login. Crewlet's
                      `github_login`.
                    maxLength: 39
                    minLength: 1
                    pattern: ^[A-Za-z0-9-]+$
                    type: string
                  gitlabUsername:
                    description: |-
                      gitlabUsername is the person's GitLab username, written without the
                      @: assignments, review requests, mentions, and the sender an inbound
                      webhook is attributed by. Crewlet's `gitlab_username`. GitLab's own
                      rule for a username's form holds it: letters, digits, '_', '-' and
                      '.', at most 255 characters, not starting with '-' and not ending
                      with '.'.
                    maxLength: 255
                    minLength: 1
                    pattern: ^([A-Za-z0-9_.][A-Za-z0-9_.-]*[A-Za-z0-9_-]|[A-Za-z0-9_])$
                    type: string
                  mattermostUsername:
                    description: |-
                      mattermostUsername is the person's username on the company's
                      Mattermost, such as jane.doe, written without the @: the name an
                      agent mentions them by and opens a direct message with, and the
                      sender an inbound post is attributed by. Crewlet's
                      `mattermost_user_id`, which holds the username despite its name, and
                      never the 26-character user id. Mattermost's own rule for a username
                      holds it: lowercase letters, digits, '.', '-' and '_', at most 64
                      characters, and none of the names Mattermost reserves (all, channel,
                      matterbot, system) nor here: a mention of all, channel or here
                      notifies the whole channel rather than the person.
                    maxLength: 64
                    minLength: 1
                    pattern: ^[a-z0-9._-]+$
                    type: string
                    x-kubernetes-validations:
                    - message: 'mattermostUsername may not be all, channel, here,
                        matterbot or system: Mattermost reserves all, channel, matterbot
                        and system, and a mention of all, channel or here notifies
                        the whole channel rather than the person'
                      rule: '!(self in [''all'', ''channel'', ''here'', ''matterbot'',
                        ''system''])'
                  slackUserID:
                    description: |-
                      slackUserID is the person's Slack member id, such as U0123ABCD.
                      Crewlet's `slack_user_id`.
                    maxLength: 64
                    minLength: 1
                    pattern: ^[A-Z0-9]+$
                    type: string
                type: object
              displayName:
                description: |-
                  displayName is the seat's name as people read it, such as "Ana
                  (Platform Engineer)". Unset is the handle. Crewlet's `name`. It is for
                  reading only: one seat names another, a unit its lead and a seat what
                  it manages, by the handle, so two Seats may share a displayName.
                maxLength: 256
                minLength: 1
                type: string
              email:
                description: |-
                  email is the seat's email address. Crewlet's `email`. Each seat has its
                  own: the engine finds a seat by its address, compared lower-cased and
                  with any plus tag dropped, so a Seat whose address another Seat's
                  matches that way is reported as a Conflict.
                maxLength: 254
                minLength: 3
                pattern: ^[^@\s]+@[^@\s]+$
                type: string
              goal:
                description: |-
                  goal is what the seat is for; it reaches the seat's prompt. Crewlet's
                  `goal`.
                maxLength: 2048
                minLength: 1
                type: string
              handle:
                description: |-
                  handle is the seat's canonical slug. Unset is the Seat's
                  metadata.name. Crewlet derives the seat's identity, and with it the
                  seat's memory, from the company name and the handle, so the handle
                  cannot be changed; a Seat deleted and created again with the same
                  handle gets its memory back. Crewlet's `handle`.
                maxLength: 63
                minLength: 1
                pattern: ^[a-z0-9][a-z0-9-]*$
                type: string
              integrations:
                description: |-
                  integrations is the seat's own identity on the company's
                  integrations.
                minProperties: 1
                properties:
                  github:
                    description: github is the seat's identity on GitHub.
                    minProperties: 1
                    properties:
                      app:
                        description: app is the GitHub App the seat acts as.
                        properties:
                          credentialsSecretRef:
                            description: |-
                              credentialsSecretRef is a Secret holding the app's credentials under
                              the keys privateKey (the app's PEM key) and webhookSecret (which
                              verifies the app's own webhook deliveries). Crewlet's `private_key`
                              and `webhook_secret`, both credential positions.
                            properties:
                              name:
                                description: name is the metadata.name of the Secret.
                                maxLength: 253
                                minLength: 1
                                type: string
                            required:
                            - name
                            type: object
                          id:
                            description: id is the app's numeric id. Crewlet's `app_id`.
                            format: int64
                            minimum: 1
                            type: integer
                          installationID:
                            description: |-
                              installationID is the app's installation on the organization. Unset
                              while the app is created but not yet installed. Crewlet's
                              `installation_id`.
                            format: int64
                            minimum: 1
                            type: integer
                          slug:
                            description: |-
                              slug is the app's slug; the bot's login, and so how the seat is
                              mentioned, derives from it. Crewlet's `app_slug`.
                            maxLength: 128
                            minLength: 1
                            pattern: ^[a-z0-9][a-z0-9-]*$
                            type: string
                        required:
                        - credentialsSecretRef
                        - id
                        - slug
                        type: object
                      repos:
                        description: |-
                          repos are the repositories the seat works in, as owner/name. Unset is
                          every repository the app's installation covers. Crewlet's `repos`.
                        items:
                          maxLength: 201
                          pattern: ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$
                          type: string
                        maxItems: 64
                        type: array
                        x-kubernetes-list-type: set
                      tier:
                        description: |-
                          tier is how much the seat may do in a repository. Unset is ReadOnly.
                          Crewlet's `tier`.
                        enum:
                        - ReadOnly
                        - Review
                        - FullAccess
                        type: string
                      workflows:
                        description: |-
                          workflows grants the seat GitHub's workflows write permission, without
                          which GitHub refuses any push whose commits change a file under
                          .github/workflows. FullAccess seats only, and off unless set: the same
                          grant lets the seat's branches run a workflow it rewrote with the
                          secrets the repository hands its runs, so pair it with branch
                          protection and environment-scoped secrets. Crewlet's `workflows`.
                        type: boolean
                    type: object
                    x-kubernetes-validations:
                    - fieldPath: .workflows
                      message: 'workflows applies to a FullAccess seat only: a seat
                        that cannot push code has nothing to push a workflow with'
                      rule: '!has(self.workflows) || !self.workflows || (has(self.tier)
                        && self.tier == ''FullAccess'')'
                  mattermost:
                    description: mattermost is the seat's own Mattermost bot.
                    properties:
                      botToken:
                        description: |-
                          botToken is the bot account's personal access token: from a Secret,
                          or provisioned by the engine under a Mattermost Integration with
                          provisioning Engine, which creates the bot and mints the token.
                          Crewlet's `bot_token`, a credential position.
                        minProperties: 1
                        properties:
                          provisioned:
                            description: |-
                              provisioned is a value the engine creates and keeps, under an
                              Integration with provisioning Engine.
                            properties:
                              name:
                                description: |-
                                  name names the value among the seat's provisioned credentials. Every
                                  place a seat names the same provisioned name refers to one value, so
                                  a token given to a tool server's environment and to the seat's
                                  sandbox is one token; different names are different values, such as
                                  an account's token and its email address.
                                maxLength: 32
                                minLength: 1
                                pattern: ^[a-z0-9][a-z0-9-]*$
                                type: string
                            required:
                            - name
                            type: object
                          secretKeyRef:
                            description: secretKeyRef selects the Secret key that
                              holds the value.
                            properties:
                              key:
                                description: key is the key within the Secret's data.
                                maxLength: 253
                                minLength: 1
                                pattern: ^[-._a-zA-Z0-9]+$
                                type: string
                              name:
                                description: name is the metadata.name of the Secret.
                                maxLength: 253
                                minLength: 1
                                type: string
                            required:
                            - key
                            - name
                            type: object
                        type: object
                        x-kubernetes-validations:
                        - message: exactly one of secretKeyRef and provisioned must
                            be set
                          rule: has(self.secretKeyRef) != has(self.provisioned)
                      channel:
                        description: |-
                          channel is a channel, by its name (the URL slug), the engine adds the
                          bot to when it provisions it, on top of the Integration's
                          engineProvisioning.channels. Crewlet's `channel`.
                        maxLength: 64
                        minLength: 1
                        pattern: ^[a-z0-9][a-z0-9_-]*$
                        type: string
                      username:
                        description: |-
                          username is the bot's username, for a bot that exists under a name
                          other than the seat's handle (with the Integration's
                          engineProvisioning.usernamePrefix before it). Crewlet's `username`.
                        maxLength: 64
                        minLength: 1
                        pattern: ^[a-z0-9][a-z0-9._-]*$
                        type: string
                    required:
                    - botToken
                    type: object
                  slack:
                    description: slack is the seat's own Slack app.
                    properties:
                      credentialsSecretRef:
                        description: |-
                          credentialsSecretRef is a Secret holding the app's credentials under
                          the keys botToken (the bot token) and signingSecret (which verifies
                          the app's webhooks). Crewlet's `bot_token` and `signing_secret`, both
                          credential positions. Rewriting the Secret rotates them without a
                          restart.
                        properties:
                          name:
                            description: name is the metadata.name of the Secret.
                            maxLength: 253
                            minLength: 1
                            type: string
                        required:
                        - name
                        type: object
                    required:
                    - credentialsSecretRef
                    type: object
                type: object
              kind:
                default: Agent
                description: kind is whether the seat is an AI agent or a person.
                  Crewlet's `kind`.
                enum:
                - Agent
                - Human
                type: string
              learningEnabled:
                description: |-
                  learningEnabled overrides the company's learning setting for this
                  seat: false stops reflection after the seat's turns. Unset inherits.
                  Crewlet's `learning_enabled`.
                type: boolean
              llm:
                description: llm is the model providers the seat runs on.
                minProperties: 1
                properties:
                  auxiliary:
                    description: |-
                      auxiliary is the chain of the cheap model used for reflection and
                      summaries. Crewlet's `auxiliary`.
                    items:
                      description: |-
                        LLMProviderReference names a model provider: an LLMProvider in the
                        referring object's namespace, or a provider the EngineClass offers.
                      properties:
                        kind:
                          default: LLMProvider
                          description: kind is the kind of provider named.
                          enum:
                          - LLMProvider
                          - PlatformLLMProvider
                          type: string
                        name:
                          description: |-
                            name is the LLMProvider's metadata.name, or the platform provider's
                            name.
                          maxLength: 253
                          minLength: 1
                          type: string
                      required:
                      - name
                      type: object
                    maxItems: 8
                    minItems: 1
                    type: array
                    x-kubernetes-list-type: atomic
                    x-kubernetes-validations:
                    - message: a provider may appear only once in a chain
                      rule: self.all(a, self.exists_one(b, b.kind == a.kind && b.name
                        == a.name))
                  default:
                    description: |-
                      default is the chain of every phase not set below, and of the seat's
                      executor, which does its work. Crewlet runs the executor as the
                      agentic run of the chain's first member that drives ClaudeCode or
                      OpenCode and is not sitting out its spent plan on the node, in that
                      member's cell (its runIn, else the Company's spec.sandbox.defaultRunIn),
                      and a launch falls back along the chain to the next such member. A
                      member of any other CLI never runs the executor and still serves every
                      phase below that is unset. Crewlet refuses a chain with no ClaudeCode
                      or OpenCode member, which the operator refuses as NoExecutorCLI, and
                      applies one that mixes them with an advisory that its executor never
                      falls back to the others. Crewlet's `default`.
                    items:
                      description: |-
                        LLMProviderReference names a model provider: an LLMProvider in the
                        referring object's namespace, or a provider the EngineClass offers.
                      properties:
                        kind:
                          default: LLMProvider
                          description: kind is the kind of provider named.
                          enum:
                          - LLMProvider
                          - PlatformLLMProvider
                          type: string
                        name:
                          description: |-
                            name is the LLMProvider's metadata.name, or the platform provider's
                            name.
                          maxLength: 253
                          minLength: 1
                          type: string
                      required:
                      - name
                      type: object
                    maxItems: 8
                    minItems: 1
                    type: array
                    x-kubernetes-list-type: atomic
                    x-kubernetes-validations:
                    - message: a provider may appear only once in a chain
                      rule: self.all(a, self.exists_one(b, b.kind == a.kind && b.name
                        == a.name))
                  judge:
                    description: |-
                      judge is the chain of the model that decides whether a turn that ran
                      out of rounds may have more. Crewlet's `judge`.
                    items:
                      description: |-
                        LLMProviderReference names a model provider: an LLMProvider in the
                        referring object's namespace, or a provider the EngineClass offers.
                      properties:
                        kind:
                          default: LLMProvider
                          description: kind is the kind of provider named.
                          enum:
                          - LLMProvider
                          - PlatformLLMProvider
                          type: string
                        name:
                          description: |-
                            name is the LLMProvider's metadata.name, or the platform provider's
                            name.
                          maxLength: 253
                          minLength: 1
                          type: string
                      required:
                      - name
                      type: object
                    maxItems: 8
                    minItems: 1
                    type: array
                    x-kubernetes-list-type: atomic
                    x-kubernetes-validations:
                    - message: a provider may appear only once in a chain
                      rule: self.all(a, self.exists_one(b, b.kind == a.kind && b.name
                        == a.name))
                  review:
                    description: |-
                      review is the chain of the reviewer that judges the executor's work.
                      Crewlet's `review`.
                    items:
                      description: |-
                        LLMProviderReference names a model provider: an LLMProvider in the
                        referring object's namespace, or a provider the EngineClass offers.
                      properties:
                        kind:
                          default: LLMProvider
                          description: kind is the kind of provider named.
                          enum:
                          - LLMProvider
                          - PlatformLLMProvider
                          type: string
                        name:
                          description: |-
                            name is the LLMProvider's metadata.name, or the platform provider's
                            name.
                          maxLength: 253
                          minLength: 1
                          type: string
                      required:
                      - name
                      type: object
                    maxItems: 8
                    minItems: 1
                    type: array
                    x-kubernetes-list-type: atomic
                    x-kubernetes-validations:
                    - message: a provider may appear only once in a chain
                      rule: self.all(a, self.exists_one(b, b.kind == a.kind && b.name
                        == a.name))
                  subagent:
                    description: |-
                      subagent is the chain of the short-lived workers the seat delegates
                      to. Crewlet's `subagent`.
                    items:
                      description: |-
                        LLMProviderReference names a model provider: an LLMProvider in the
                        referring object's namespace, or a provider the EngineClass offers.
                      properties:
                        kind:
                          default: LLMProvider
                          description: kind is the kind of provider named.
                          enum:
                          - LLMProvider
                          - PlatformLLMProvider
                          type: string
                        name:
                          description: |-
                            name is the LLMProvider's metadata.name, or the platform provider's
                            name.
                          maxLength: 253
                          minLength: 1
                          type: string
                      required:
                      - name
                      type: object
                    maxItems: 8
                    minItems: 1
                    type: array
                    x-kubernetes-list-type: atomic
                    x-kubernetes-validations:
                    - message: a provider may appear only once in a chain
                      rule: self.all(a, self.exists_one(b, b.kind == a.kind && b.name
                        == a.name))
                type: object
              manages:
                description: |-
                  manages names the seats and units this seat manages; a unit stands
                  for every seat in it and below it. Crewlet's `manages`, which names a
                  Seat by its handle and a Unit by its metadata.name, the Unit's key; a
                  key that is also a seat's handle reads as the seat, so a Unit named so
                  is refused here as a Conflict.
                items:
                  description: |-
                    ManagedReference names a Seat or a Unit, in the referring Seat's namespace,
                    that a seat manages.
                  properties:
                    kind:
                      default: Seat
                      description: kind is the kind of object named.
                      enum:
                      - Seat
                      - Unit
                      type: string
                    name:
                      description: name is the object's metadata.name.
                      maxLength: 253
                      minLength: 1
                      type: string
                  required:
                  - name
                  type: object
                maxItems: 64
                type: array
                x-kubernetes-list-map-keys:
                - kind
                - name
                x-kubernetes-list-type: map
              mcp:
                description: |-
                  mcp are the seat's own tool-server credentials, which make it act as
                  itself on each server, and its own settings, such as the channel cache
                  of slack-mcp-server, which no other seat may share. They are merged
                  over its unit's, per variable. One entry per server, keyed by its
                  name. Crewlet's `mcp_env`, a credential position.
                items:
                  description: |-
                    MCPCredentials are the values one tool server is started with for a seat:
                    environment variables for a Stdio server, request headers for an HTTP one.
                    They map onto one server's entry of Crewlet's mcp_env, a credential
                    position.

                    The server is named by a top-level name, as an imagePullSecrets entry names
                    its Secret, rather than by a nested reference, because name is the key of
                    the list that holds these: with a scalar key, server-side apply merges the
                    list entry by entry, so that one field manager (a control plane's GitHub
                    flow, say) can own the credentials of one server without owning, or
                    overwriting, every other server's.
                  properties:
                    env:
                      description: |-
                        env are the values. For a Stdio server each is an environment
                        variable of its process; for an HTTP server each is a request header
                        (the name is the header's name). Names must differ in more than case:
                        HTTP header names are case-insensitive, so Authorization and
                        authorization are one header.
                      items:
                        description: |-
                          MCPCredentialValue is one value a tool server is started with for a seat:
                          one of its credentials, from a Secret or provisioned by the engine, or a
                          setting that is no credential, written as a literal value. Whether it is an
                          environment variable or a request header depends on the server's
                          transport, which is why its name follows the grammar of an HTTP header
                          name, of which an environment variable's name is a subset.

                          A literal value is for a setting such as a path: slack-mcp-server, for one,
                          keeps the channels its bot can see in a file named after the workspace
                          alone, so each seat names its own (SLACK_MCP_CHANNELS_CACHE), or seats on
                          one engine pod are shown each other's private channels. Crewlet treats every
                          value of mcp_env as a credential and masks it on every read, and cannot
                          tell a setting from a credential; the name can, so a name that says it
                          holds a credential, as Crewlet reads one (see MCPEnvVar), takes valueFrom.
                        properties:
                          name:
                            description: |-
                              name is the environment variable's name (Stdio) or the header's name
                              (HTTP).
                            maxLength: 128
                            minLength: 1
                            pattern: ^[A-Za-z0-9!#$%&'*+.^_|~-]+$
                            type: string
                          value:
                            description: |-
                              value is a literal value, for a setting that is no credential. It
                              lands in the company document as written, where anyone who can read
                              this object reads it too. An empty string is a valid value, which is
                              why the field is a pointer.
                            maxLength: 4096
                            type: string
                            x-kubernetes-validations:
                            - message: 'value may not hold a ${NAME} reference: the
                                operator refuses every one it did not write, since
                                in many fields the engine resolves one from its own
                                secret store and environment, which hold credentials
                                that are not this object''s to name'
                              rule: '!self.matches(''[$][{][A-Za-z_][A-Za-z0-9_]*[}]'')'
