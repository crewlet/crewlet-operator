{{- if .Values.crd.enabled }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    {{- if .Values.crd.keep }}
    "helm.sh/resource-policy": keep
    {{- end }}
    controller-gen.kubebuilder.io/version: v0.22.0
  name: llmproviders.crewlet.ai
spec:
  group: crewlet.ai
  names:
    categories:
    - crewlet
    kind: LLMProvider
    listKind: LLMProviderList
    plural: llmproviders
    shortNames:
    - llmp
    singular: llmprovider
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.companyRef.name
      name: Company
      type: string
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .spec.model
      name: Model
      type: string
    - jsonPath: .status.conditions[?(@.type=="Applied")].status
      name: Applied
      type: string
    - jsonPath: .status.conditions[?(@.type=="AgentModeRunnable")].status
      name: AgentMode
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          LLMProvider is a model provider a company's seats can run on: one entry of
          Crewlet's providers.llm, keyed by its name. The name default is refused:
          Crewlet runs a seat that names no chain on the provider keyed default when
          there is one, whatever the Company's spec.llm.order says.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec is the provider's desired state.
            properties:
              apiKeySecretRefs:
                description: |-
                  apiKeySecretRefs are the provider's API keys, each a key of a Secret in
                  this namespace. With more than one, Crewlet rotates through them,
                  setting aside a key that hits a rate limit or is refused, in the order
                  listed when several are equally free. Crewlet's `api_keys`, a
                  credential position: the values are pushed into the engine's secret
                  store and the document refers to them by name only. Required for types
                  Anthropic and OpenAI; an OpenAICompatible endpoint that needs no key
                  may omit it. A CLIAgent provider takes exactly one, with
                  cli.auth.mode APIKey, which it gives the CLI.
                items:
                  description: |-
                    SecretKeyReference selects one key of a Secret in the referring object's
                    namespace. The operator reads the value when it renders the company and
                    pushes it into the engine's encrypted secret store; the value itself never
                    appears in the company document, in a pod template or in any status.
                  properties:
                    key:
                      description: key is the key within the Secret's data.
                      maxLength: 253
                      minLength: 1
                      pattern: ^[-._a-zA-Z0-9]+$
                      type: string
                    name:
                      description: name is the metadata.name of the Secret.
                      maxLength: 253
                      minLength: 1
                      type: string
                  required:
                  - key
                  - name
                  type: object
                maxItems: 16
                minItems: 1
                type: array
                x-kubernetes-list-type: atomic
              baseURL:
                description: |-
                  baseURL sends requests to this endpoint instead of the vendor's own,
                  for a gateway or a proxy. Required for type OpenAICompatible. For type
                  Anthropic it is the gateway's root, without /v1: Crewlet's own calls,
                  Claude Code (as ANTHROPIC_BASE_URL) and OpenCode each add the version
                  themselves. A seat's code work running on the provider hands it to the
                  coding agent in each box. Crewlet's `base_url`.
                maxLength: 2048
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: baseURL must be an absolute http or https URL
                  rule: isURL(self) && url(self).getScheme() in ['http', 'https']
                - message: 'baseURL may not hold a ${NAME} reference: the engine would
                    resolve it from its own secret store and environment, which hold
                    credentials that are not this object''s to name'
                  rule: '!self.matches(''[$][{][A-Za-z_][A-Za-z0-9_]*[}]'')'
              claudeModel:
                description: |-
                  claudeModel names the Claude model whose request shape an Anthropic
                  provider uses when model is a gateway alias Crewlet cannot recognise.
                  Crewlet's `claude_model`; type Anthropic only.
                enum:
                - claude-fable-5-1
                - claude-mythos-5-1
                - claude-fable-5
                - claude-mythos-5
                - claude-opus-5-5
                - claude-opus-5
                - claude-opus-4-8
                - claude-opus-4-7
                - claude-sonnet-5-5
                - claude-sonnet-5
                - claude-opus-4-6
                - claude-sonnet-4-6
                - claude-opus-4-5
                - claude-sonnet-4-5
                - claude-haiku-4-5
                - claude-opus-4-1
                - claude-opus-4-0
                - claude-opus-4
                - claude-sonnet-4-0
                - claude-sonnet-4
                - claude-3-7-sonnet
                type: string
              cli:
                description: |-
                  cli is the coding CLI a provider of type CLIAgent drives. Required
                  for, and only for, type CLIAgent. Crewlet's `cli`.
                properties:
                  agent:
                    description: |-
                      agent is which CLI to drive. The provider's model is written as this
                      CLI reads it, and an Agent-mode run is handed it unchanged: OpenCode
                      reads `<provider>/<model>`, such as `anthropic/claude-sonnet-5`.
                      Crewlet's `agent`.
                    enum:
                    - ClaudeCode
                    - Codex
                    - GeminiCLI
                    - QwenCode
                    - OpenCode
                    - CursorAgent
                    - Copilot
                    - Grok
                    - MuseCode
                    - KimiCode
                    - Hermes
                    - Pi
                    type: string
                  auth:
                    description: auth is how the CLI signs in.
                    minProperties: 1
                    properties:
                      credentialBundleSecretRef:
                        description: |-
                          credentialBundleSecretRef is the Secret key holding a credential
                          bundle `crewlet llm export` wrote. Crewlet's `credential_bundle`, a
                          credential position.
                        properties:
                          key:
                            description: key is the key within the Secret's data.
                            maxLength: 253
                            minLength: 1
                            pattern: ^[-._a-zA-Z0-9]+$
                            type: string
                          name:
                            description: name is the metadata.name of the Secret.
                            maxLength: 253
                            minLength: 1
                            type: string
                        required:
                        - key
                        - name
                        type: object
                      mode:
                        description: |-
                          mode is how the CLI signs in. Unset is Subscription. Crewlet's
                          `mode`.
                        enum:
                        - Subscription
                        - APIKey
                        type: string
                      tokenSecretRef:
                        description: |-
                          tokenSecretRef is the Secret key holding a long-lived subscription
                          token the CLI mints for headless use. Crewlet's `token`, a credential
                          position.
                        properties:
                          key:
                            description: key is the key within the Secret's data.
                            maxLength: 253
                            minLength: 1
                            pattern: ^[-._a-zA-Z0-9]+$
                            type: string
                          name:
                            description: name is the metadata.name of the Secret.
                            maxLength: 253
                            minLength: 1
                            type: string
                        required:
                        - key
                        - name
                        type: object
                    type: object
                    x-kubernetes-validations:
                    - message: 'tokenSecretRef and credentialBundleSecretRef sign
                        in to a subscription: they apply to mode Subscription only'
                      rule: '!(has(self.mode) && self.mode != ''Subscription'') ||
                        (!has(self.tokenSecretRef) && !has(self.credentialBundleSecretRef))'
                    - message: 'tokenSecretRef and credentialBundleSecretRef are two
                        logins, and the CLI is given one: keep the headless token,
                        which never needs refreshing, or the bundle where the CLI
                        mints no token'
                      rule: '!has(self.tokenSecretRef) || !has(self.credentialBundleSecretRef)'
                  env:
                    description: |-
                      env is extra environment of every invocation of the CLI: the child
                      gets an allowlisted environment, not the engine's, so a variable the
                      CLI needs beyond that is given here. It is how Hermes, Pi and OpenCode
                      sign in under auth mode Subscription with no login of their own: their
                      model provider's key, under a name Crewlet reads as a credential, such
                      as OPENROUTER_API_KEY. It may not set the CLI's own token or key
                      variable, which auth owns. An OpenCode provider's credential-named
                      variables also travel into every box of an Agent-mode run, and of a
                      seat's code work that runs on it, where the coding agent can read
                      them. Crewlet's `env`, a credential position.
                    items:
                      description: |-
                        SecretEnvVar is a named credential delivered as an environment variable,
                        such as a sandbox setup step's token or a coding CLI's model key. Crewlet
                        treats every value in the positions that use this type as a credential, so
                        a literal value is not accepted: the value always comes from a Secret.
                      properties:
                        name:
                          description: name is the variable's name.
                          maxLength: 128
                          minLength: 1
                          pattern: ^[A-Za-z_][A-Za-z0-9_]*$
                          type: string
                        valueFrom:
                          description: valueFrom is the Secret key the value is read
                            from.
                          properties:
                            secretKeyRef:
                              description: secretKeyRef selects the Secret key that
                                holds the value.
                              properties:
                                key:
                                  description: key is the key within the Secret's
                                    data.
                                  maxLength: 253
                                  minLength: 1
                                  pattern: ^[-._a-zA-Z0-9]+$
                                  type: string
                                name:
                                  description: name is the metadata.name of the Secret.
                                  maxLength: 253
                                  minLength: 1
                                  type: string
                              required:
                              - key
                              - name
                              type: object
                          required:
                          - secretKeyRef
                          type: object
                      required:
                      - name
                      - valueFrom
                      type: object
                    maxItems: 32
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  loginName:
                    description: |-
                      loginName names the login, and the per-seat homes, the provider
                      keeps on the data volume. Providers of the company with the same
                      loginName share one login, which is how several models run off one
                      subscription; they must drive the same CLI. Unset is the provider's
                      own metadata.name. Crewlet's `state_dir`, as
                      /var/lib/crewlet/llm-cli/<loginName>.
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z0-9][a-z0-9-]*$
                    type: string
                  maxConcurrent:
                    description: |-
                      maxConcurrent is how many CLI processes the provider runs at once;
                      each takes 200 to 400 MB of the engine pod's memory. Unset takes
                      Crewlet's default of 4. Crewlet's `max_concurrent`.
                    format: int32
                    maximum: 64
                    minimum: 1
                    type: integer
                  mode:
                    description: mode is how the engine uses the CLI. Unset is Text.
                      Crewlet's `mode`.
                    enum:
                    - Text
                    - Agent
                    type: string
                  runIn:
                    description: |-
                      runIn is where an Agent-mode run happens. Unset is the Company's
                      sandbox, which is E2B. Crewlet's `run_in`.
                    enum:
                    - E2B
                    type: string
                  timeoutSeconds:
                    description: |-
                      timeoutSeconds caps one invocation of the CLI, launch included. Unset
                      takes Crewlet's default of 300. Crewlet's `timeout_seconds`.
                    format: int32
                    minimum: 1
                    type: integer
                required:
                - agent
                - auth
                type: object
                x-kubernetes-validations:
                - message: 'runIn applies to mode Agent only: in mode Text the CLI
                    is a process in the engine''s pod'
                  rule: '!has(self.runIn) || (has(self.mode) && self.mode == ''Agent'')'
                - message: 'mode Agent runs a CLI Crewlet has a sandbox runner for:
                    ClaudeCode or OpenCode'
                  rule: '!has(self.mode) || self.mode != ''Agent'' || self.agent in
                    [''ClaudeCode'', ''OpenCode'']'
                - fieldPath: .auth
                  message: 'a Subscription login needs auth.tokenSecretRef or auth.credentialBundleSecretRef:
                    a pod has no terminal to log in at. Hermes, Pi and OpenCode alone
                    may sign in with their model provider''s key in env instead, under
                    a name Crewlet reads as a credential, one of whose parts between
                    underscores is, in any case, KEY, KEYS, APIKEY, ACCESSKEY, SECRETKEY,
                    TOKEN, SECRET, PASSWORD, PASSWD, CREDENTIAL, CREDENTIALS, AUTH,
                    OAUTH or PAT (such as OPENROUTER_API_KEY), which Crewlet hands
                    them untouched. A CLI with a key variable takes its key through
                    auth mode APIKey, as Crewlet refuses that variable in env'
                  rule: '!has(self.auth) || (has(self.auth.mode) && self.auth.mode
                    != ''Subscription'') || has(self.auth.tokenSecretRef) || has(self.auth.credentialBundleSecretRef)
                    || (self.agent in [''Hermes'', ''Pi'', ''OpenCode''] && has(self.env)
                    && self.env.exists(e, e.name.matches(''(?i)(^|[^A-Za-z0-9])(KEY|KEYS|APIKEY|ACCESSKEY|SECRETKEY|TOKEN|SECRET|PASSWORD|PASSWD|CREDENTIAL|CREDENTIALS|AUTH|OAUTH|PAT)([^A-Za-z0-9]|$)'')))'
                - message: 'auth.tokenSecretRef is a headless token, which Crewlet
                    hands only to ClaudeCode (CLAUDE_CODE_OAUTH_TOKEN): its profile
                    for every other CLI names no token variable. Sign that CLI in
                    with auth.credentialBundleSecretRef, with auth mode APIKey where
                    it has a key variable, or, for Hermes, Pi and OpenCode, with its
                    model provider''s key in env'
                  rule: '!has(self.auth) || !has(self.auth.tokenSecretRef) || self.agent
                    == ''ClaudeCode'''
                - message: 'auth mode APIKey takes a CLI Crewlet hands a key to: ClaudeCode,
                    Codex, GeminiCLI, QwenCode, CursorAgent, Copilot, Grok or MuseCode.
                    Crewlet''s profiles for OpenCode, KimiCode, Hermes and Pi name
                    no key variable: sign Hermes, Pi or OpenCode in with its model
                    provider''s key in env under mode Subscription, and KimiCode,
                    which reads a key only from its own files, with auth.credentialBundleSecretRef'
                  rule: '!has(self.auth) || !has(self.auth.mode) || self.auth.mode
                    != ''APIKey'' || self.agent in [''ClaudeCode'', ''Codex'', ''GeminiCLI'',
                    ''QwenCode'', ''CursorAgent'', ''Copilot'', ''Grok'', ''MuseCode'']'
                - fieldPath: .env
                  message: 'env may not set the CLI''s own token or key variable (ClaudeCode''s
                    CLAUDE_CODE_OAUTH_TOKEN and ANTHROPIC_API_KEY, Codex''s OPENAI_API_KEY,
                    GeminiCLI''s GEMINI_API_KEY, QwenCode''s DASHSCOPE_API_KEY, CursorAgent''s
                    CURSOR_API_KEY, Copilot''s GITHUB_TOKEN, Grok''s XAI_API_KEY,
                    MuseCode''s META_API_KEY): Crewlet''s auth owns it, and whether
                    a value in env reaches the CLI would turn on the auth mode. Give
                    a token as auth.tokenSecretRef, and a key as apiKeySecretRefs
                    with auth mode APIKey'
                  rule: '!has(self.env) || !self.env.exists(e, (self.agent == ''ClaudeCode''
                    && e.name in [''CLAUDE_CODE_OAUTH_TOKEN'', ''ANTHROPIC_API_KEY''])
                    || (self.agent == ''Codex'' && e.name == ''OPENAI_API_KEY'') ||
                    (self.agent == ''GeminiCLI'' && e.name == ''GEMINI_API_KEY'')
                    || (self.agent == ''QwenCode'' && e.name == ''DASHSCOPE_API_KEY'')
                    || (self.agent == ''CursorAgent'' && e.name == ''CURSOR_API_KEY'')
                    || (self.agent == ''Copilot'' && e.name == ''GITHUB_TOKEN'') ||
                    (self.agent == ''Grok'' && e.name == ''XAI_API_KEY'') || (self.agent
                    == ''MuseCode'' && e.name == ''META_API_KEY''))'
                - message: 'a Subscription login reaches an Agent-mode run in a remote
                    sandbox only as a variable of its environment: give ClaudeCode
                    auth.tokenSecretRef, or use auth mode APIKey, and give OpenCode
                    its model provider''s key in env under a name Crewlet reads as
                    a credential, such as ANTHROPIC_API_KEY or OPENROUTER_API_KEY.
                    A credential bundle stays on the engine''s data volume'
                  rule: '!has(self.mode) || self.mode != ''Agent'' || (has(self.auth)
                    && has(self.auth.mode) && self.auth.mode != ''Subscription'')
                    || (self.agent == ''ClaudeCode'' && has(self.auth) && has(self.auth.tokenSecretRef))
                    || (self.agent == ''OpenCode'' && has(self.env) && self.env.exists(e,
                    e.name.matches(''(?i)(^|[^A-Za-z0-9])(KEY|KEYS|APIKEY|ACCESSKEY|SECRETKEY|TOKEN|SECRET|PASSWORD|PASSWD|CREDENTIAL|CREDENTIALS|AUTH|OAUTH|PAT)([^A-Za-z0-9]|$)'')))'
              companyRef:
                description: companyRef names the Company this provider belongs to.
                  Immutable.
                properties:
                  name:
                    description: name is the metadata.name of a Company in this object's
                      namespace.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: companyRef is immutable
                  rule: self == oldSelf
              cooldowns:
                description: |-
                  cooldowns is how long a failing key is set aside. Crewlet's
                  `cooldowns`.
                minProperties: 1
                properties:
                  authSeconds:
                    description: |-
                      authSeconds is how long a key the provider refused is set aside. Unset
                      takes Crewlet's default of 300.
                    format: int32
                    maximum: 86400
                    minimum: 60
                    type: integer
                  rateLimitSeconds:
                    description: |-
                      rateLimitSeconds is how long a key that hit a rate limit is set aside.
                      Unset takes Crewlet's default of 3600.
                    format: int32
                    maximum: 86400
                    minimum: 60
                    type: integer
                type: object
              model:
                description: |-
                  model is the model id requests are sent for, as the provider names it.
                  Crewlet's `model`. Crewlet trims it of white space and refuses a
                  provider with nothing left, as naming no model.
                maxLength: 256
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: 'model may not be white space alone: Crewlet trims it,
                    and refuses a provider that names no model'
                  rule: self.trim().size() > 0
                - message: 'model may not hold a ${NAME} reference: the engine would
                    resolve it from its own secret store and environment, which hold
                    credentials that are not this object''s to name'
                  rule: '!self.matches(''[$][{][A-Za-z_][A-Za-z0-9_]*[}]'')'
              reasoning:
                description: |-
                  reasoning turns on an OpenAI reasoning model's effort, so that
                  reasoningEffort is sent. Crewlet's `reasoning`; type OpenAI only.
                type: boolean
              reasoningBudgetTokens:
                description: |-
                  reasoningBudgetTokens is the thinking budget of an older, budget-based
                  Claude model. Unset means such a model does not think. Crewlet's
                  `reasoning_budget_tokens`; type Anthropic only.
                format: int32
                minimum: 1024
                type: integer
              reasoningEffort:
                description: |-
                  reasoningEffort is how hard the model thinks. For Anthropic it is sent
                  on every call, and unset means High. For OpenAI it is sent only while
                  reasoning is true, so it requires reasoning; an OpenAICompatible
                  provider cannot turn reasoning on and takes no reasoningEffort.
                  Crewlet's `reasoning_effort`.
                enum:
                - Low
                - Medium
                - High
                - XHigh
                - Max
                type: string
              timeoutSeconds:
                description: |-
                  timeoutSeconds bounds one HTTP attempt: the whole of a unary call, the
                  longest silence in a streamed one. Unset takes Crewlet's default of
                  600. Crewlet's `timeout_seconds`.
                format: int32
                minimum: 1
                type: integer
              type:
                description: type is which model API the provider speaks. Crewlet's
                  `type`.
                enum:
                - Anthropic
                - OpenAI
                - OpenAICompatible
                - CLIAgent
                type: string
            required:
            - companyRef
            - model
            - type
            type: object
            x-kubernetes-validations:
            - message: claudeModel applies to type Anthropic only
              rule: '!has(self.claudeModel) || self.type == ''Anthropic'''
            - message: reasoning applies to type OpenAI only; an Anthropic model's
                thinking depth is reasoningEffort
              rule: '!has(self.reasoning) || self.type == ''OpenAI'''
            - message: reasoningEffort is sent to an OpenAI model only while reasoning
                is true, and never to an OpenAICompatible one
              rule: '!has(self.reasoningEffort) || self.type == ''Anthropic'' || (self.type
                == ''OpenAI'' && has(self.reasoning) && self.reasoning)'
            - message: reasoningBudgetTokens applies to type Anthropic only
              rule: '!has(self.reasoningBudgetTokens) || self.type == ''Anthropic'''
            - message: baseURL is required for type OpenAICompatible, which has no
                default endpoint
              rule: self.type != 'OpenAICompatible' || has(self.baseURL)
            - message: apiKeySecretRefs needs at least one key for types Anthropic
                and OpenAI
              rule: self.type in ['OpenAICompatible', 'CLIAgent'] || has(self.apiKeySecretRefs)
            - message: cli is required with type CLIAgent and not allowed otherwise
              rule: (self.type == 'CLIAgent') == has(self.cli)
            - message: 'baseURL, timeoutSeconds and cooldowns configure an HTTP client,
                and a CLIAgent provider runs a process: its timeout is cli.timeoutSeconds'
              rule: self.type != 'CLIAgent' || !(has(self.baseURL) || has(self.timeoutSeconds)
                || has(self.cooldowns))
            - message: a CLIAgent provider takes apiKeySecretRefs with cli.auth.mode
                APIKey, and only then
              rule: self.type != 'CLIAgent' || !has(self.cli) || has(self.apiKeySecretRefs)
                == (has(self.cli.auth) && has(self.cli.auth.mode) && self.cli.auth.mode
                == 'APIKey')
            - message: 'a CLIAgent provider gives its CLI one key: it rotates none'
              rule: self.type != 'CLIAgent' || !has(self.apiKeySecretRefs) || self.apiKeySecretRefs.size()
                == 1
            - fieldPath: .model
              message: 'an OpenCode model is <provider>/<model>, which OpenCode splits
                at its first slash: a model with no slash, or with nothing but white
                space before or after it, names no provider or no model, and every
                call the provider makes, an Agent-mode run''s included, would fail
                inside OpenCode with Model not found. Name the provider as OpenCode
                spells it (opencode models lists them), such as anthropic/claude-sonnet-5
                or openrouter/anthropic/claude-sonnet-5, with that provider''s key
                in cli.env'
              rule: self.type != 'CLIAgent' || !has(self.cli) || self.cli.agent !=
                'OpenCode' || !has(self.model) || (self.model.indexOf('/') >= 0 &&
                self.model.substring(0, self.model.indexOf('/')).trim().size() > 0
                && self.model.substring(self.model.indexOf('/') + 1).trim().size()
                > 0)
          status:
            description: status is the provider's observed state.
            minProperties: 1
            properties:
              conditions:
                description: |-
                  conditions are Accepted (the Company exists), ResolvedRefs (every
                  Secret key exists), Applied (the provider is in the revision the
                  engine runs) and, on a provider of type CLIAgent in mode Agent,
                  AgentModeRunnable (whether its runs can call a seat's tools back
                  through the Company's public address).
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 8
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: observedGeneration is the metadata.generation this status
                  describes.
                format: int64
                minimum: 1
                type: integer
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: 'an LLMProvider may not be named default: Crewlet runs every seat
            that names no chain on the provider keyed default, ahead of spec.llm.order'
          rule: self.metadata.name != 'default'
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
