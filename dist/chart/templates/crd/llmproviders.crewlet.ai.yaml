{{- if .Values.crd.enabled }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    {{- if .Values.crd.keep }}
    "helm.sh/resource-policy": keep
    {{- end }}
    controller-gen.kubebuilder.io/version: v0.22.0
  name: llmproviders.crewlet.ai
spec:
  group: crewlet.ai
  names:
    categories:
    - crewlet
    kind: LLMProvider
    listKind: LLMProviderList
    plural: llmproviders
    shortNames:
    - llmp
    singular: llmprovider
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.companyRef.name
      name: Company
      type: string
    - jsonPath: .spec.agent
      name: Agent
      type: string
    - jsonPath: .spec.model
      name: Model
      type: string
    - jsonPath: .status.conditions[?(@.type=="Applied")].status
      name: Applied
      type: string
    - jsonPath: .status.conditions[?(@.type=="BoxModeRunnable")].status
      name: BoxMode
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          LLMProvider is a model a company's seats can run on: a coding CLI the
          engine drives, one entry of Crewlet's providers.llm, keyed by its name. The
          name default is refused: Crewlet runs a seat that names no chain on the
          provider keyed default when there is one, whatever the Company's
          spec.llm.order says.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec is the provider's desired state.
            properties:
              agent:
                description: |-
                  agent is which CLI to drive. The model is written as this CLI reads
                  it, and a Box-mode run or a seat's code work is handed it
                  unchanged: OpenCode reads `<provider>/<model>`, such as
                  `anthropic/claude-sonnet-5`. Crewlet's `agent`.
                enum:
                - ClaudeCode
                - Codex
                - GeminiCLI
                - QwenCode
                - OpenCode
                - CursorAgent
                - Copilot
                - Grok
                - MuseCode
                - KimiCode
                - Hermes
                - Pi
                type: string
              auth:
                description: auth is how the CLI signs in. Crewlet's `auth`.
                minProperties: 1
                properties:
                  apiKeySecretRef:
                    description: |-
                      apiKeySecretRef is the Secret key holding the metered API key auth
                      mode APIKey hands the CLI, in the key variable Crewlet's profile for
                      it names (ClaudeCode's ANTHROPIC_API_KEY, Codex's CODEX_API_KEY).
                      One key: a CLI holds one sign-in and rotates nothing, so a second key
                      is a provider of its own, later in a seat's chain. Crewlet's
                      `api_key`, a credential position: the value is pushed into the
                      engine's secret store and the document refers to it by name only.
                    properties:
                      key:
                        description: key is the key within the Secret's data.
                        maxLength: 253
                        minLength: 1
                        pattern: ^[-._a-zA-Z0-9]+$
                        type: string
                      name:
                        description: name is the metadata.name of the Secret.
                        maxLength: 253
                        minLength: 1
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  credentialBundleSecretRef:
                    description: |-
                      credentialBundleSecretRef is the Secret key holding a credential
                      bundle `crewlet llm export` wrote. A bundle holding a login OpenCode
                      1.x made (its auth.json) is refused when the engine restores it, and
                      the provider runs signed out: export it again from OpenCode 2.
                      Crewlet's `credential_bundle`, a credential position.
                    properties:
                      key:
                        description: key is the key within the Secret's data.
                        maxLength: 253
                        minLength: 1
                        pattern: ^[-._a-zA-Z0-9]+$
                        type: string
                      name:
                        description: name is the metadata.name of the Secret.
                        maxLength: 253
                        minLength: 1
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  mode:
                    description: |-
                      mode is how the CLI signs in. Unset is Subscription. Crewlet's
                      `mode`.
                    enum:
                    - Subscription
                    - APIKey
                    type: string
                  tokenSecretRef:
                    description: |-
                      tokenSecretRef is the Secret key holding a long-lived subscription
                      token the CLI mints for headless use. Crewlet's `token`, a credential
                      position.
                    properties:
                      key:
                        description: key is the key within the Secret's data.
                        maxLength: 253
                        minLength: 1
                        pattern: ^[-._a-zA-Z0-9]+$
                        type: string
                      name:
                        description: name is the metadata.name of the Secret.
                        maxLength: 253
                        minLength: 1
                        type: string
                    required:
                    - key
                    - name
                    type: object
                type: object
                x-kubernetes-validations:
                - message: 'tokenSecretRef and credentialBundleSecretRef sign in to
                    a subscription: they apply to mode Subscription only'
                  rule: '!(has(self.mode) && self.mode != ''Subscription'') || (!has(self.tokenSecretRef)
                    && !has(self.credentialBundleSecretRef))'
                - message: 'tokenSecretRef and credentialBundleSecretRef are two logins,
                    and the CLI is given one: keep the headless token, which never
                    needs refreshing, or the bundle where the CLI mints no token'
                  rule: '!has(self.tokenSecretRef) || !has(self.credentialBundleSecretRef)'
                - message: 'apiKeySecretRef is the key auth mode APIKey hands the
                    CLI: it is required with mode APIKey and not allowed otherwise,
                    as Crewlet reads a key under no other mode'
                  rule: has(self.apiKeySecretRef) == (has(self.mode) && self.mode
                    == 'APIKey')
              companyRef:
                description: companyRef names the Company this provider belongs to.
                  Immutable.
                properties:
                  name:
                    description: name is the metadata.name of a Company in this object's
                      namespace.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: companyRef is immutable
                  rule: self == oldSelf
              env:
                description: |-
                  env is extra environment of the CLI where it runs in the engine's pod:
                  in every phase a Host-mode provider runs, and in every phase but the
                  executor's of a Box-mode one. There the CLI does not get the engine's
                  environment: it gets the part Crewlet's allowlist names, such as PATH
                  and the TLS and proxy variables, and the variables the CLI's Crewlet
                  profile passes through, such as GeminiCLI's GOOGLE_CLOUD_PROJECT, with
                  a HOME, a TMPDIR and XDG directories of its seat's own rather than the
                  engine's.
                  So a variable the CLI needs beyond that is given here, such as the
                  address of a gateway a CLI reads from its environment (ClaudeCode's
                  ANTHROPIC_BASE_URL). It is how Hermes, Pi and OpenCode sign in under
                  auth mode Subscription with no login of their own: their model
                  provider's key, under a name Crewlet reads as a credential, such as
                  OPENROUTER_API_KEY. It may not set the CLI's own token or key
                  variable, which auth owns, nor a variable Crewlet sets to keep the CLI
                  inside its seat's home and its call's working directory: HOME, the XDG
                  directories, TMPDIR, and the CLI's own configuration directory or
                  switch (docs/guides/cli-agents.md). Under auth mode Subscription it may
                  not set a variable Crewlet sets there to sign the CLI in with its
                  seat's login either: GeminiCLI's GOOGLE_GENAI_USE_GCA.

                  A Box-mode run, and a seat's code work on the provider, run the CLI
                  in the Company's E2B sandbox. There it gets none of that environment,
                  and of env only an OpenCode provider's credential-named variables,
                  where the coding agent can read them; a variable of no credential that
                  such a run needs goes in the Seat's spec.sandbox.env. Crewlet's `env`,
                  a credential position.
                items:
                  description: |-
                    SecretEnvVar is a named credential delivered as an environment variable,
                    such as a sandbox setup step's token or a coding CLI's model key. Crewlet
                    treats every value in the positions that use this type as a credential, so
                    a literal value is not accepted: the value always comes from a Secret.
                  properties:
                    name:
                      description: name is the variable's name.
                      maxLength: 128
                      minLength: 1
                      pattern: ^[A-Za-z_][A-Za-z0-9_]*$
                      type: string
                    valueFrom:
                      description: valueFrom is the Secret key the value is read from.
                      properties:
                        secretKeyRef:
                          description: secretKeyRef selects the Secret key that holds
                            the value.
                          properties:
                            key:
                              description: key is the key within the Secret's data.
                              maxLength: 253
                              minLength: 1
                              pattern: ^[-._a-zA-Z0-9]+$
                              type: string
                            name:
                              description: name is the metadata.name of the Secret.
                              maxLength: 253
                              minLength: 1
                              type: string
                          required:
                          - key
                          - name
                          type: object
                      required:
                      - secretKeyRef
                      type: object
                  required:
                  - name
                  - valueFrom
                  type: object
                maxItems: 32
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              loginName:
                description: |-
                  loginName names the login, and the per-seat homes, the provider
                  keeps on the data volume. Providers of the company with the same
                  loginName that drive the same CLI share one login, which is how
                  several models run off one subscription; each CLI keeps its own
                  beside the others' (Crewlet's <state_dir>/<agent>), so one of another
                  CLI shares the directory and nothing in it. Unset is the provider's
                  own metadata.name. Crewlet's `state_dir`, as
                  /var/lib/crewlet/llm-cli/<loginName>.
                maxLength: 63
                minLength: 1
                pattern: ^[a-z0-9][a-z0-9-]*$
                type: string
              maxConcurrent:
                description: |-
                  maxConcurrent is how many of the provider's CLI processes run at once
                  in each engine pod; each takes 200 to 450 MB of the pod's memory,
                  OpenCode's at the top of that range (docs/guides/cli-agents.md). One
                  process lives for a whole run of the CLI, many model requests and
                  tool calls long, and holds its place for all of it, so this is also
                  how many seats' runs the provider has going at once in a pod: a run
                  past it waits for a place. A model call made on the same provider
                  from inside one of a run's tool calls (a delegated worker's) borrows
                  the run's place rather than wait for another, which the runs holding
                  every place could leave it waiting for forever. Unset takes
                  Crewlet's default of 4. A Box-mode executor's run, in the sandbox,
                  takes none. Crewlet's `max_concurrent`.
                format: int32
                maximum: 64
                minimum: 1
                type: integer
              mode:
                description: |-
                  mode is where a seat's executor runs the CLI's own loop: Host, in the
                  engine's pod that holds the seat, or Box, in the Company's sandbox.
                  Unset is Host. Crewlet's `mode`.
                enum:
                - Host
                - Box
                type: string
              model:
                description: |-
                  model is the model the CLI runs, in the CLI's own grammar: an alias
                  or an id for ClaudeCode (`sonnet`, `claude-opus-5-5`), an OpenAI id
                  for Codex, `<provider>/<model>` for OpenCode. Crewlet's `model`.
                  Crewlet trims it of white space and refuses a provider with nothing
                  left, as naming no model.
                maxLength: 256
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: 'model may not be white space alone: Crewlet trims it,
                    and refuses a provider that names no model'
                  rule: self.trim().size() > 0
                - message: 'model may not hold a ${NAME} reference: the operator refuses
                    every one it did not write, since in many fields the engine resolves
                    one from its own secret store and environment, which hold credentials
                    that are not this object''s to name'
                  rule: '!self.matches(''[$][{][A-Za-z_][A-Za-z0-9_]*[}]'')'
              runIn:
                description: |-
                  runIn is where a Box-mode run happens. Unset is the Company's
                  sandbox, which is E2B. Crewlet's `run_in`.
                enum:
                - E2B
                type: string
              timeoutSeconds:
                description: |-
                  timeoutSeconds bounds one stretch of the CLI's model work, wall clock,
                  with no call of a seat's tool in flight: from the CLI's launch, or the
                  answer to its last tool call, to its next tool call or its end, the
                  model's answer and the CLI's own retries in it. It is not a bound on
                  a run of the CLI, which asks the model many times and calls the
                  seat's tools between: a tool call stops the clock however long it
                  takes (a delegation, a slow tool server), and the next stretch starts
                  afresh. Unset takes Crewlet's default of 600, the ceiling Anthropic
                  documents for one answer of a current Claude model at its full
                  output. A timeout is retryable, so a seat's chain moves on to its
                  next provider. It bounds the CLI where it runs in the engine's pod;
                  a Box-mode executor's run in the sandbox is not bounded by it.
                  Crewlet's `timeout_seconds`.
                format: int32
                minimum: 1
                type: integer
            required:
            - agent
            - auth
            - companyRef
            - model
            type: object
            x-kubernetes-validations:
            - message: 'runIn applies to mode Box only: in mode Host the CLI runs
                in the engine''s pod'
              rule: '!has(self.runIn) || (has(self.mode) && self.mode == ''Box'')'
            - message: 'mode Box runs a CLI Crewlet has a sandbox runner for: ClaudeCode
                or OpenCode'
              rule: '!has(self.mode) || self.mode != ''Box'' || self.agent in [''ClaudeCode'',
                ''OpenCode'']'
            - fieldPath: .auth
              message: 'a Subscription login needs auth.tokenSecretRef or auth.credentialBundleSecretRef:
                a pod has no terminal to log in at. Hermes, Pi and OpenCode alone
                may sign in with their model provider''s key in env instead, under
                a name Crewlet reads as a credential, one of whose parts between underscores
                is, in any case, KEY, KEYS, APIKEY, ACCESSKEY, SECRETKEY, TOKEN, SECRET,
                PASSWORD, PASSWD, CREDENTIAL, CREDENTIALS, AUTH, OAUTH or PAT (such
                as OPENROUTER_API_KEY), which Crewlet hands them untouched. A CLI
                with a key variable takes its key through auth mode APIKey, as Crewlet
                refuses that variable in env'
              rule: '!has(self.auth) || (has(self.auth.mode) && self.auth.mode !=
                ''Subscription'') || has(self.auth.tokenSecretRef) || has(self.auth.credentialBundleSecretRef)
                || (self.agent in [''Hermes'', ''Pi'', ''OpenCode''] && has(self.env)
                && self.env.exists(e, e.name.matches(''(?i)(^|[^A-Za-z0-9])(KEY|KEYS|APIKEY|ACCESSKEY|SECRETKEY|TOKEN|SECRET|PASSWORD|PASSWD|CREDENTIAL|CREDENTIALS|AUTH|OAUTH|PAT)([^A-Za-z0-9]|$)'')))'
            - fieldPath: .auth
              message: 'QwenCode signs in with its key alone, under auth mode APIKey:
                Crewlet''s profile for it keeps no login and names no token variable,
                as the builds of Qwen Code Crewlet supports refuse the OAuth login
                it once kept, so under Subscription it would sign in to nothing. Give
                it its key with auth mode APIKey and auth.apiKeySecretRef'
              rule: self.agent != 'QwenCode' || (has(self.auth) && has(self.auth.mode)
                && self.auth.mode == 'APIKey')
            - message: 'auth.tokenSecretRef is a headless token, which Crewlet hands
                only to ClaudeCode (CLAUDE_CODE_OAUTH_TOKEN): its profile for every
                other CLI names no token variable. Sign that CLI in with auth.credentialBundleSecretRef,
                with auth mode APIKey where it has a key variable, or, for Hermes,
                Pi and OpenCode, with its model provider''s key in env'
              rule: '!has(self.auth) || !has(self.auth.tokenSecretRef) || self.agent
                == ''ClaudeCode'''
            - message: 'auth mode APIKey takes a CLI Crewlet hands a key to: ClaudeCode,
                Codex, GeminiCLI, QwenCode, CursorAgent, Copilot, Grok or MuseCode.
                Crewlet''s profiles for OpenCode, KimiCode, Hermes and Pi name no
                key variable: sign Hermes, Pi or OpenCode in with its model provider''s
                key in env under mode Subscription, and KimiCode, which reads a key
                only from its own files, with auth.credentialBundleSecretRef'
              rule: '!has(self.auth) || !has(self.auth.mode) || self.auth.mode !=
                ''APIKey'' || self.agent in [''ClaudeCode'', ''Codex'', ''GeminiCLI'',
                ''QwenCode'', ''CursorAgent'', ''Copilot'', ''Grok'', ''MuseCode'']'
            - fieldPath: .env
              message: 'env may not set the CLI''s own token or key variable (ClaudeCode''s
                CLAUDE_CODE_OAUTH_TOKEN and ANTHROPIC_API_KEY, Codex''s CODEX_API_KEY,
                GeminiCLI''s GEMINI_API_KEY, QwenCode''s OPENAI_API_KEY, CursorAgent''s
                CURSOR_API_KEY, Copilot''s COPILOT_GITHUB_TOKEN, Grok''s XAI_API_KEY,
                MuseCode''s META_API_KEY): Crewlet''s auth owns it, and whether a
                value in env reaches the CLI would turn on the auth mode. Give a token
                as auth.tokenSecretRef, and a key as auth.apiKeySecretRef with auth
                mode APIKey'
              rule: '!has(self.env) || !self.env.exists(e, (self.agent == ''ClaudeCode''
                && e.name in [''CLAUDE_CODE_OAUTH_TOKEN'', ''ANTHROPIC_API_KEY''])
                || (self.agent == ''Codex'' && e.name == ''CODEX_API_KEY'') || (self.agent
                == ''GeminiCLI'' && e.name == ''GEMINI_API_KEY'') || (self.agent ==
                ''QwenCode'' && e.name == ''OPENAI_API_KEY'') || (self.agent == ''CursorAgent''
                && e.name == ''CURSOR_API_KEY'') || (self.agent == ''Copilot'' &&
                e.name == ''COPILOT_GITHUB_TOKEN'') || (self.agent == ''Grok'' &&
                e.name == ''XAI_API_KEY'') || (self.agent == ''MuseCode'' && e.name
                == ''META_API_KEY''))'
            - fieldPath: .env
              message: 'env may not set a variable Crewlet sets on every call of the
                CLI to keep it inside its seat''s own home and its call''s working
                directory: HOME, XDG_CONFIG_HOME, XDG_DATA_HOME, XDG_STATE_HOME, XDG_CACHE_HOME
                or TMPDIR for any CLI, and ClaudeCode''s CLAUDE_CONFIG_DIR, Codex''s
                CODEX_HOME and CODEX_SQLITE_HOME, OpenCode''s OPENCODE_CONFIG_DIR
                and OPENCODE_CONFIG_PROJECT_DISABLE, CursorAgent''s CURSOR_CONFIG_DIR,
                KimiCode''s KIMI_CODE_HOME, Hermes''s HERMES_HOME or Pi''s PI_CODING_AGENT_DIR.
                A value there would replace that isolation for every seat on the provider,
                so Crewlet refuses the document: drop it'
              rule: '!has(self.env) || !self.env.exists(e, e.name in [''HOME'', ''XDG_CONFIG_HOME'',
                ''XDG_DATA_HOME'', ''XDG_STATE_HOME'', ''XDG_CACHE_HOME'', ''TMPDIR'']
                || (self.agent == ''ClaudeCode'' && e.name == ''CLAUDE_CONFIG_DIR'')
                || (self.agent == ''Codex'' && e.name in [''CODEX_HOME'', ''CODEX_SQLITE_HOME''])
                || (self.agent == ''OpenCode'' && e.name in [''OPENCODE_CONFIG_DIR'',
                ''OPENCODE_CONFIG_PROJECT_DISABLE'']) || (self.agent == ''CursorAgent''
                && e.name == ''CURSOR_CONFIG_DIR'') || (self.agent == ''KimiCode''
                && e.name == ''KIMI_CODE_HOME'') || (self.agent == ''Hermes'' && e.name
                == ''HERMES_HOME'') || (self.agent == ''Pi'' && e.name == ''PI_CODING_AGENT_DIR''))'
            - fieldPath: .env
              message: 'under auth mode Subscription, env may not set a variable Crewlet
                sets there to sign the CLI in with the login the seat''s home holds:
                GeminiCLI''s GOOGLE_GENAI_USE_GCA, which Crewlet sets to true. A value
                there would be replaced on every call, so Crewlet refuses the document:
                drop it'
              rule: (has(self.auth) && has(self.auth.mode) && self.auth.mode != 'Subscription')
                || !has(self.env) || !self.env.exists(e, self.agent == 'GeminiCLI'
                && e.name == 'GOOGLE_GENAI_USE_GCA')
            - message: 'a Subscription login reaches a Box-mode run in a remote sandbox
                only as a variable of its environment: give ClaudeCode auth.tokenSecretRef,
                or use auth mode APIKey, and give OpenCode its model provider''s key
                in env under a name Crewlet reads as a credential, such as ANTHROPIC_API_KEY
                or OPENROUTER_API_KEY. A credential bundle stays on the engine''s
                data volume'
              rule: '!has(self.mode) || self.mode != ''Box'' || (has(self.auth) &&
                has(self.auth.mode) && self.auth.mode != ''Subscription'') || (self.agent
                == ''ClaudeCode'' && has(self.auth) && has(self.auth.tokenSecretRef))
                || (self.agent == ''OpenCode'' && has(self.env) && self.env.exists(e,
                e.name.matches(''(?i)(^|[^A-Za-z0-9])(KEY|KEYS|APIKEY|ACCESSKEY|SECRETKEY|TOKEN|SECRET|PASSWORD|PASSWD|CREDENTIAL|CREDENTIALS|AUTH|OAUTH|PAT)([^A-Za-z0-9]|$)'')))'
            - fieldPath: .model
              message: 'an OpenCode model is <provider>/<model>, which OpenCode splits
                at its first slash: a model with no slash, or with nothing but white
                space before or after it, names no provider or no model, and every
                call the provider makes, a Box-mode run''s included, would fail inside
                OpenCode, which OpenCode 2 refuses as Invalid model reference. Name
                the provider as OpenCode spells it (opencode models --standalone lists
                them), such as anthropic/claude-sonnet-5 or openrouter/anthropic/claude-sonnet-5,
                with that provider''s key in env or, in mode Host, a login of OpenCode''s
                own in auth.credentialBundleSecretRef'
              rule: self.agent != 'OpenCode' || !has(self.model) || (self.model.indexOf('/')
                >= 0 && self.model.substring(0, self.model.indexOf('/')).trim().size()
                > 0 && self.model.substring(self.model.indexOf('/') + 1).trim().size()
                > 0)
          status:
            description: status is the provider's observed state.
            minProperties: 1
            properties:
              conditions:
                description: |-
                  conditions are Accepted (the Company exists), ResolvedRefs (every
                  Secret key exists), Applied (the provider is in the revision the
                  engine runs) and, on a provider in mode Box, BoxModeRunnable
                  (whether its runs can call a seat's tools back through the Company's
                  public address).
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 8
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: observedGeneration is the metadata.generation this status
                  describes.
                format: int64
                minimum: 1
                type: integer
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: 'an LLMProvider may not be named default: Crewlet runs every seat
            that names no chain on the provider keyed default, ahead of spec.llm.order'
          rule: self.metadata.name != 'default'
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
