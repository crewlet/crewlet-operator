                properties:
                  data:
                    description: data is the state of the data pods.
                    minProperties: 1
                    properties:
                      readyReplicas:
                        description: readyReplicas is the number of data pods that
                          are ready.
                        format: int32
                        minimum: 0
                        type: integer
                      replicas:
                        description: replicas is the number of data pods.
                        format: int32
                        minimum: 0
                        type: integer
                      updatedReplicas:
                        description: |-
                          updatedReplicas is the number of data pods that run the current pod
                          template.
                        format: int32
                        minimum: 0
                        type: integer
                    type: object
                  seatPools:
                    description: seatPools is the state of each seat pool's pods.
                    items:
                      description: SeatPoolStatus is the state of one seat pool's
                        pods.
                      properties:
                        mode:
                          description: mode is how the pool runs its seats.
                          enum:
                          - Shared
                          - PerSeat
                          type: string
                        name:
                          description: name is the pool's name.
                          maxLength: 20
                          minLength: 1
                          type: string
                        readyReplicas:
                          description: readyReplicas is the number of the pool's pods
                            that are ready.
                          format: int32
                          minimum: 0
                          type: integer
                        replicas:
                          description: |-
                            replicas is the number of the pool's pods, every seat's together for
                            a PerSeat pool.
                          format: int32
                          minimum: 0
                          type: integer
                        seats:
                          description: seats is the number of agent seats placed in
                            the pool.
                          format: int32
                          minimum: 0
                          type: integer
                        updatedReplicas:
                          description: |-
                            updatedReplicas is the number of the pool's pods that run the
                            current pod template.
                          format: int32
                          minimum: 0
                          type: integer
                      required:
                      - name
                      type: object
                    maxItems: 8
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                type: object
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: a Company's name must be a DNS label of at most 47 characters that
            starts with a letter, because it names the company's StatefulSet and Service
          rule: self.metadata.name.matches('^[a-z]([-a-z0-9]*[a-z0-9])?$') && size(self.metadata.name)
            <= 47
    served: true
    storage: true
    subresources:
      status: {}
