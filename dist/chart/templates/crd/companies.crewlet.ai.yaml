                              minimum: 0
                              type: integer
                            schedules:
                              description: schedules is the number of Schedules.
                              format: int32
                              minimum: 0
                              type: integer
                            seats:
                              description: seats is the number of Seats.
                              format: int32
                              minimum: 0
                              type: integer
                            units:
                              description: units is the number of Units.
                              format: int32
                              minimum: 0
                              type: integer
                          type: object
                        replaced:
                          description: |-
