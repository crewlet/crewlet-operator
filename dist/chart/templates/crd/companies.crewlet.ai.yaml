{{- if .Values.crd.enabled }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    {{- if .Values.crd.keep }}
    "helm.sh/resource-policy": keep
    {{- end }}
    controller-gen.kubebuilder.io/version: v0.22.0
  name: companies.crewlet.ai
spec:
  group: crewlet.ai
  names:
    categories:
    - crewlet
    kind: Company
    listKind: CompanyList
    plural: companies
    shortNames:
    - cmp
    singular: company
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.engineClassName
      name: Class
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.topology.data.readyReplicas
      name: Pods
      type: integer
    - jsonPath: .status.config.objects.seats
      name: Seats
      type: integer
    - jsonPath: .status.config.revisionID
      name: Revision
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Company is one Crewlet company: the operator runs an engine for it and keeps
          the engine's company document equal to what the Company and the objects that
          name it declare.

          The Company's name becomes part of the names of the objects the operator
          creates for it (the data StatefulSet and the engine Service), so it must be
          a DNS label of at most 47 characters: a StatefulSet name longer than 52
          characters overflows its pods' controller-revision-hash label.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec is the company's desired state.
            properties:
              assistant:
                description: |-
                  assistant configures Ask Crewlet. Unset leaves it off.
                  Crewlet's `assistant`.
                minProperties: 1
                properties:
                  deepWork:
                    description: |-
                      deepWork lets Ask Crewlet hand a large task (research, scripts,
                      files, many steps) to a coding CLI running its own tools in a box of
                      its own, which needs spec.sandbox. Unset, Ask Crewlet answers in
                      quick mode only. Crewlet's `deep_work`.
                    properties:
                      llm:
                        description: |-
                          llm is the provider deep work runs on: one driving ClaudeCode, an
                          LLMProvider or a platform model provider. Crewlet's `llm`.
                        properties:
                          kind:
                            default: LLMProvider
                            description: kind is the kind of provider named.
                            enum:
                            - LLMProvider
                            - PlatformLLMProvider
                            type: string
                          name:
                            description: |-
                              name is the LLMProvider's metadata.name, or the platform provider's
                              name.
                            maxLength: 253
                            minLength: 1
                            type: string
                        required:
                        - name
                        type: object
                      maxSteps:
                        description: |-
                          maxSteps is the most agentic rounds and Crewlet tool calls one
                          deep-work task may make. Unset takes Crewlet's default of 150.
                          Crewlet's `max_steps`.
                        format: int32
                        maximum: 400
                        minimum: 10
                        type: integer
                      maxTokens:
                        description: |-
                          maxTokens is the most tokens one deep-work task may spend before it
                          is stopped. Unset takes Crewlet's default of 3000000. The person's
                          tokenBudget and the company's still apply. Crewlet's `max_tokens`.
                        format: int32
                        maximum: 20000000
                        minimum: 10000
                        type: integer
                      timeoutSeconds:
                        description: |-
                          timeoutSeconds is the longest one deep-work run may take. Unset takes
                          Crewlet's default of 1200, which is also the most: a run lives inside
                          the turn's read grant. Crewlet's `timeout_seconds`.
                        format: int32
                        maximum: 1200
                        minimum: 60
                        type: integer
                    required:
                    - llm
                    type: object
                  enabled:
                    description: |-
                      enabled runs Ask Crewlet. Unset or false leaves it off. Crewlet's
                      `enabled`.
                    type: boolean
                  llm:
                    description: |-
                      llm is Ask Crewlet's model chain, the first provider tried first,
                      referred to as a Seat's chain is. Required when enabled is true.
                      Crewlet's `llm`.
                    items:
                      description: |-
                        LLMProviderReference names a model provider: an LLMProvider in the
                        referring object's namespace, or a provider the EngineClass offers.
                      properties:
                        kind:
                          default: LLMProvider
                          description: kind is the kind of provider named.
                          enum:
                          - LLMProvider
                          - PlatformLLMProvider
                          type: string
                        name:
                          description: |-
                            name is the LLMProvider's metadata.name, or the platform provider's
                            name.
                          maxLength: 253
                          minLength: 1
                          type: string
                      required:
                      - name
                      type: object
                    maxItems: 8
                    type: array
                    x-kubernetes-list-type: atomic
                    x-kubernetes-validations:
                    - message: llm must name each provider once
                      rule: self.all(a, self.exists_one(b, b.kind == a.kind && b.name
                        == a.name))
                  maxSteps:
                    description: |-
                      maxSteps is the most tool steps one turn may take. Unset takes
                      Crewlet's default of 30. Crewlet's `max_steps`.
                    format: int32
                    maximum: 40
                    minimum: 1
                    type: integer
                  proposalTTLSeconds:
                    description: |-
                      proposalTTLSeconds is how long a proposed change waits for its
                      owner's approval. Unset takes Crewlet's default of 900. Crewlet's
                      `proposal_ttl_seconds`.
                    format: int32
                    maximum: 3600
                    minimum: 60
                    type: integer
                  retentionDays:
                    description: |-
                      retentionDays is how long a person's conversations are kept. Unset
                      takes Crewlet's default of 30. Crewlet's `retention_days`.
                    format: int32
                    maximum: 365
                    minimum: 1
                    type: integer
                  tokenBudget:
                    description: |-
                      tokenBudget caps the tokens Ask Crewlet may spend for each person per
                      window, charged on top of the company's own spec.tokenBudget.
                      Crewlet's `token_budget`.
                    minProperties: 1
                    properties:
                      day:
                        description: day is the most tokens one local day, midnight
                          to midnight, may spend.
                        format: int64
                        minimum: 1
                        type: integer
                      month:
                        description: month is the most tokens one calendar month may
                          spend.
                        format: int64
                        minimum: 1
                        type: integer
                      week:
                        description: week is the most tokens one ISO week, starting
                          on Monday, may spend.
                        format: int64
                        minimum: 1
                        type: integer
                    type: object
                  turnTimeoutSeconds:
                    description: |-
                      turnTimeoutSeconds is the longest one turn may run. Unset takes
                      Crewlet's default of 900. Crewlet's `turn_timeout_seconds`.
                    format: int32
                    maximum: 1200
                    minimum: 30
                    type: integer
                type: object
                x-kubernetes-validations:
                - fieldPath: .llm
                  message: 'Ask Crewlet, when enabled, needs llm: name the model provider
                    it runs on, one whose webTools is Denied'
                  rule: '!has(self.enabled) || !self.enabled || (has(self.llm) &&
                    size(self.llm) > 0)'
              companyName:
                description: |-
                  companyName is the company's name. Crewlet derives every seat's
                  identity from it and the seat's handle, so it cannot be changed: a new
                  name would orphan every seat's memory. Crewlet's `name`.
                maxLength: 256
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: 'companyName is immutable: every seat''s identity is derived
                    from it'
                  rule: self == oldSelf
              config:
                default:
                  managementPolicy: Enforce
                description: config is how the operator manages the company's document.
                minProperties: 1
                properties:
                  managementPolicy:
                    default: Enforce
                    description: |-
                      managementPolicy says who owns the document. Under Enforce the data
                      pod's crewlet.yaml sets Crewlet's api.auth.company_writers to the
                      operator's own token, so the engine refuses every other credential a
                      change to the document; under Observe and Seed it sets none, and
                      Crewlet's authority table decides who may. The engine reads
                      crewlet.yaml only at start, so changing the policy to or from Enforce
                      restarts the data pod.
                    enum:
                    - Enforce
                    - Observe
                    - Seed
                    type: string
                type: object
              deletionPolicy:
                default: Retain
                description: |-
                  deletionPolicy is what happens to the data volumes when the Company is
                  deleted. With Retain the keyring Secret is kept as well, since the
                  volumes cannot be read without it.
                enum:
                - Retain
                - Delete
                type: string
              embeddings:
                description: |-
                  embeddings is the provider vectors are computed with. Unset leaves
                  search keyword-only. Crewlet's providers.embeddings.
                properties:
                  apiKeySecretRef:
                    description: |-
                      apiKeySecretRef is the Secret key holding the API key. Crewlet's
                      `api_key`, a credential position. Required for type OpenAI: Crewlet
                      reads OPENAI_API_KEY from the environment when it is unset, and the
                      engine's environment never carries one (see spec.runtime.env). An
                      OpenAICompatible endpoint that needs no key may omit it.
                    properties:
                      key:
                        description: key is the key within the Secret's data.
                        maxLength: 253
                        minLength: 1
                        pattern: ^[-._a-zA-Z0-9]+$
                        type: string
                      name:
                        description: name is the metadata.name of the Secret.
                        maxLength: 253
                        minLength: 1
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  baseURL:
                    description: |-
                      baseURL is the endpoint of an OpenAI-compatible service. Crewlet's
                      `base_url`.
                    maxLength: 2048
                    minLength: 1
                    type: string
                    x-kubernetes-validations:
                    - message: baseURL must be an absolute http or https URL
                      rule: isURL(self) && url(self).getScheme() in ['http', 'https']
                    - message: 'baseURL may not hold a user name or password: a credential
                        is named through a Secret, never written into an address'
                      rule: '!self.matches(''^[^:/?#]+://[^/?#]*@'')'
                    - message: 'baseURL may not hold a ${NAME} reference: the operator
                        refuses every one it did not write, since in many fields the
                        engine resolves one from its own secret store and environment,
                        which hold credentials that are not this object''s to name'
                      rule: '!self.matches(''[$][{][A-Za-z_][A-Za-z0-9_]*[}]'')'
                  dimensions:
                    description: |-
                      dimensions is the vector width. Unset takes the model's own width,
                      which Crewlet knows for the models it names; any other model needs it
                      stated, and it must match what the model produces.
                    format: int32
                    maximum: 4096
                    minimum: 64
                    type: integer
                  maxBatchInputs:
                    description: |-
                      maxBatchInputs is the most inputs one request may carry. Unset takes
                      the model's documented limit; it may only lower it.
                    format: int32
                    minimum: 1
                    type: integer
                  maxBatchTokens:
                    description: |-
                      maxBatchTokens is the most tokens one request may carry, summed over
                      its inputs. Unset takes the model's documented limit; it may only
                      lower it.
                    format: int32
                    minimum: 1
                    type: integer
                  maxInputTokens:
                    description: |-
                      maxInputTokens is the most tokens one input may hold. Unset takes the
                      model's documented window; it may only lower it.
                    format: int32
                    minimum: 1
                    type: integer
                  model:
                    description: |-
                      model is the embedding model id. Crewlet's `model`. Crewlet trims it of
                      white space and refuses an embeddings provider with nothing left, as
                      naming no model.
                    maxLength: 256
                    minLength: 1
                    type: string
                    x-kubernetes-validations:
                    - message: 'model may not be white space alone: Crewlet trims
                        it, and refuses an embeddings provider that names no model'
                      rule: self.trim().size() > 0
                    - message: 'model may not hold a ${NAME} reference: the operator
                        refuses every one it did not write, since in many fields the
                        engine resolves one from its own secret store and environment,
                        which hold credentials that are not this object''s to name'
                      rule: '!self.matches(''[$][{][A-Za-z_][A-Za-z0-9_]*[}]'')'
                  type:
                    default: OpenAI
                    description: type is which embeddings API the provider speaks.
                    enum:
                    - OpenAI
                    - OpenAICompatible
                    type: string
                required:
                - model
                type: object
                x-kubernetes-validations:
                - message: baseURL is required for type OpenAICompatible
                  rule: self.type != 'OpenAICompatible' || has(self.baseURL)
                - message: apiKeySecretRef is required for type OpenAI
                  rule: self.type != 'OpenAI' || has(self.apiKeySecretRef)
              engineClassName:
                description: |-
                  engineClassName is the EngineClass the company runs with. Unset uses
                  the class annotated crewlet.ai/is-default-class=true.

                  Whoever may write a Company may name any class, including one that
                  offers platformLLMProviders or larger limits; a class admits only the
                  namespaces its spec.allowedNamespaces selects, and a Company in any
                  other is not accepted (ClassNotAllowed).
                maxLength: 253
                minLength: 1
                type: string
              engineConfig:
                description: |-
                  engineConfig is passed through into the company document as written,
                  for the engine's tuning blocks that have no field here: turn_engine,
                  learning, scheduling, workers, skill_variables, artifacts and the
                  notification_* settings, spelled as Crewlet spells them. Each entry is
                  one top-level key of the document and its value. The operator does not
                  interpret it; the engine validates it in the dry run before every
                  apply, and a refusal is reported on the Company.

                  It may not set what another field or object of this API owns: name,
                  mission, vision, policies, timezone, tracker, knowledge, token_budget,
                  assistant, providers, integrations, mcp_servers, roles, units or
                  seat_access_migrated, which the operator writes with every
                  integration kind so the engine acts on each Seat's
                  spec.integrations. Every
                  position Crewlet holds a credential in lives under one of those keys, so
                  engineConfig can never carry a credential: the API server refuses a
                  Company whose engineConfig names one of them, before anything is
                  stored.
                items:
                  description: |-
                    EngineConfigEntry is one top-level key of the company document that
                    spec.engineConfig passes through, and its value.
                  properties:
                    name:
                      description: name is the key, as Crewlet spells it, such as
                        turn_engine.
                      maxLength: 63
                      minLength: 1
                      pattern: ^[a-z][a-z0-9_]*$
                      type: string
                    value:
                      description: |-
                        value is the key's value: an object, a list, a string, a number or a
                        boolean, kept as written.
                      x-kubernetes-preserve-unknown-fields: true
                  required:
                  - name
                  - value
                  type: object
                maxItems: 64
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
                x-kubernetes-validations:
                - message: 'engineConfig may not set name, mission, vision, policies,
                    timezone, tracker, knowledge, token_budget, assistant, providers,
                    integrations, mcp_servers, roles, units or seat_access_migrated:
                    those are fields and objects of this API, among them every block
                    that holds a credential'
                  rule: self.all(e, !(e.name in ['name', 'mission', 'vision', 'policies',
                    'timezone', 'tracker', 'knowledge', 'token_budget', 'assistant',
                    'providers', 'integrations', 'mcp_servers', 'roles', 'units',
                    'seat_access_migrated']))
              exposure:
                description: exposure overrides how the company is reached.
                minProperties: 1
                properties:
                  artifactsBaseURL:
                    description: |-
                      artifactsBaseURL is where a browser reaches the artifact origin,
                      ahead of the class's artifacts route: a tunnel, or http://localhost:8082
                      for a browser that port-forwards it. Crewlet's api.artifacts.external_url;
                      changing it restarts the data pod. https, or http on localhost or
                      127.x.x.x; {artifact} at the start of the host gives each artifact a host
                      of its own. It may not be the dashboard's or the public listener's
                      origin, nor a parent of either's host (RuntimeReady=False AddressRefused).
                    maxLength: 2048
                    minLength: 1
                    type: string
                    x-kubernetes-validations:
                    - message: 'artifactsBaseURL must be a scheme and a lowercase
                        host name, with at most a port and a ''/'' after it, and {artifact}
                        only at the start of its first label, such as https://{artifact}.artifacts.example.net
                        or https://artifacts.example.com: Crewlet serves artifacts
                        from the root of their host'
                      rule: self.matches('^https?://([{]artifact[}][a-z0-9-]*[.])?[a-z0-9]([-a-z0-9]*[a-z0-9])?([.][a-z0-9]([-a-z0-9]*[a-z0-9])?)*(:[0-9]+)?/?$')
                    - message: 'artifactsBaseURL may use plain http only on localhost,
                        a name under it or a 127.x.x.x address: Crewlet refuses an
                        artifact origin reached over plain http on a routable host,
                        since every byte a page loads would travel in the clear'
                      rule: '!self.startsWith(''http://'') || self.matches(''^http://([^/:]*[.])?localhost(:[0-9]+)?/?$'')
                        || self.matches(''^http://127([.][0-9]{1,3}){3}(:[0-9]+)?/?$'')'
                    - message: 'artifactsBaseURL''s port must be 1 to 65535: Crewlet
                        refuses to start on any other; leave the port out for the
                        scheme''s own'
                      rule: '!self.matches(''^https?://[^/]*:(0+|0*([1-9][0-9]{5,}|[7-9][0-9]{4}|6[6-9][0-9]{3}|65[6-9][0-9]{2}|655[4-9][0-9]|6553[6-9]))(/|$)'')'
                    - message: 'artifactsBaseURL may follow {artifact} with at most
                        37 characters of its label: every artifact''s label is 26
                        characters and that suffix, and a DNS label holds 63'
                      rule: '!self.matches(''^https?://[{]artifact[}][a-z0-9-]{38,}[.]'')'
                    - message: 'artifactsBaseURL''s host ends in a number, which a
                        browser reads as an IPv4 address and rewrites before it sends
                        it: write an IPv4 address as four decimal octets, such as
                        127.0.0.1, and a host name whose last label is not a number'
                      rule: '!self.matches(''^https?://([^/:]*[.])?([0-9]+|0x[0-9a-f]*)(:[0-9]+)?/?$'')
                        || self.matches(''^https?://((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])[.]){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])(:[0-9]+)?/?$'')'
                  dashboardBaseURL:
                    description: |-
                      dashboardBaseURL is where a browser reaches the engine: its dashboard,
                      and the sign-in of the company's people. It overrides the address of
                      the class's API route: set it when the class routes no API, or people
                      reach it through something in front of the route (a single sign-on
                      proxy, say). Crewlet's api.external_url, in the data pod's
                      crewlet.yaml, which the engine reads only at start: changing it
                      restarts the data pod. The engine takes from it the origin a person's
                      write must come from, whether the session cookie is Secure (https)
                      and its scope, and the base of every link a person follows: a link an
                      agent composes, an invitation (/dashboard#/invite/...), a password
                      link. An address other than the route's must serve the engine, its
                      /dashboard and its /auth routes included. The route, when the class
                      has one, stays an origin the engine accepts. It is never the public
                      address: the public listener serves no dashboard. A trailing '/' is
                      dropped.

                      Crewlet compares the origin of a person's write with this address as a
                      browser spells it, and refuses to start on an address whose host a
                      browser rewrites before it sends it, so the API refuses it too: a host
                      outside ASCII, as it is or percent-encoded (write its xn-- form,
                      https://xn--bcher-kva.example for https://bücher.example), a host
                      whose last label is a number and that is not an IPv4 address of four
                      decimal octets (127.1, 2130706433, 0x7f.0.0.1, 192.168.010.1,
                      crewlet.123: write 127.0.0.1, or a name that ends in a word), and an
                      IPv6 address with a zone ([fe80::1%25eth0]). Its host is a name, an
                      IPv4 address or an IPv6 address in brackets, followed by at most one
                      port, 1 to 65535 (http://[::1]:8080, not http://::1:8080), which the
                      API judges itself, as for publicBaseURL.
                    maxLength: 2048
                    minLength: 1
                    type: string
                    x-kubernetes-validations:
                    - message: dashboardBaseURL must be an absolute URL starting with
                        http:// or https://
                      rule: isURL(self) && (self.startsWith('http://') || self.startsWith('https://'))
                        && url(self).getHostname() != ''
                    - message: 'dashboardBaseURL''s port must be 1 to 65535: Crewlet
                        refuses to start on any other; leave the port out for the
                        scheme''s own'
                      rule: '!isURL(self) || !self.matches(''^https?://[^/]*:(0+|0*([1-9][0-9]{5,}|[7-9][0-9]{4}|6[6-9][0-9]{3}|65[6-9][0-9]{2}|655[4-9][0-9]|6553[6-9]))(/|$)'')'
                    - message: 'dashboardBaseURL''s host must be a name, an IPv4 address
                        or an IPv6 address in brackets, and at most one '':'' and
                        a port may follow it: Crewlet refuses to start on any other
                        address (write http://[::1]:8080, not http://::1:8080)'
                      rule: '!self.matches(''^[^:/?#]+://'') || self.matches(''^[^:/?#]+://([^/?#]*@)?([[](([0-9A-Fa-f]{1,4}:){7}[0-9A-Fa-f]{1,4}|([0-9A-Fa-f]{1,4}:){1,7}:|:(:[0-9A-Fa-f]{1,4}){1,7}|::|([0-9A-Fa-f]{1,4}:)(:[0-9A-Fa-f]{1,4}){1,6}|([0-9A-Fa-f]{1,4}:){2}(:[0-9A-Fa-f]{1,4}){1,5}|([0-9A-Fa-f]{1,4}:){3}(:[0-9A-Fa-f]{1,4}){1,4}|([0-9A-Fa-f]{1,4}:){4}(:[0-9A-Fa-f]{1,4}){1,3}|([0-9A-Fa-f]{1,4}:){5}(:[0-9A-Fa-f]{1,4}){1,2}|([0-9A-Fa-f]{1,4}:){6}(:[0-9A-Fa-f]{1,4})|(([0-9A-Fa-f]{1,4}:){6}|:(:[0-9A-Fa-f]{1,4}){0,5}:|([0-9A-Fa-f]{1,4}:){5}:|([0-9A-Fa-f]{1,4}:)(:[0-9A-Fa-f]{1,4}){0,4}:|([0-9A-Fa-f]{1,4}:){2}(:[0-9A-Fa-f]{1,4}){0,3}:|([0-9A-Fa-f]{1,4}:){3}(:[0-9A-Fa-f]{1,4}){0,2}:|([0-9A-Fa-f]{1,4}:){4}(:[0-9A-Fa-f]{1,4}){0,1}:)(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])([.](25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])){3})(%25[^]/?#]+)?[]]|[^/?#:[]*)(:[0-9]*)?([/?#]|$)'')'
                    - message: 'dashboardBaseURL''s host must be ASCII: a browser
                        sends a host outside ASCII in its xn-- form, which Crewlet
                        cannot compare it with, so write that form (https://xn--bcher-kva.example
                        for https://bücher.example)'
                      rule: '!isURL(self) || !self.matches(''^https?://[^/]*[^[:ascii:]]'')'
                    - message: 'dashboardBaseURL''s host may not hold a ''%'': Crewlet
                        cannot compare a browser''s origin with a percent-encoded
                        host, nor can a browser reach an IPv6 zone (%25eth0), so write
                        the host as a browser sends it, in ASCII (its xn-- form) and
                        without a zone'
                      rule: '!isURL(self) || !self.matches(''^https?://[^/]*%'')'
                    - message: 'dashboardBaseURL''s host ends in a number, which a
                        browser reads as an IPv4 address and rewrites before it sends
                        it: write an IPv4 address as four decimal octets, such as
                        127.0.0.1, and a host name whose last label is not a number'
                      rule: '!isURL(self) || !self.matches(''^https?://([^/:]*[.])?([0-9]+|0[xX][0-9a-fA-F]*)[.]?(:[0-9]*)?(/|$)'')
                        || self.matches(''^https?://((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])[.]){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])(:[0-9]*)?(/|$)'')'
                    - message: 'dashboardBaseURL may not hold a user name or password:
                        a credential is named through a Secret, never written into
                        an address'
                      rule: '!self.matches(''^[^:/?#]+://[^/?#]*@'')'
                    - message: 'dashboardBaseURL may not have a query or a fragment:
                        Crewlet builds every link a person follows, an invitation
                        and a password link included, by appending a path to it'
