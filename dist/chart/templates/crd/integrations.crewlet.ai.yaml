{{- if .Values.crd.enabled }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    {{- if .Values.crd.keep }}
    "helm.sh/resource-policy": keep
    {{- end }}
    controller-gen.kubebuilder.io/version: v0.22.0
  name: integrations.crewlet.ai
spec:
  group: crewlet.ai
  names:
    categories:
    - crewlet
    kind: Integration
    listKind: IntegrationList
    plural: integrations
    shortNames:
    - intg
    singular: integration
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.companyRef.name
      name: Company
      type: string
    - jsonPath: .status.conditions[?(@.type=="Applied")].status
      name: Applied
      type: string
    - jsonPath: .status.conditions[?(@.type=="Healthy")].status
      name: Healthy
      type: string
    - jsonPath: .status.webhookURL
      name: Webhook
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Integration connects a company to a vendor (Slack, GitHub): the company-wide
          settings and the credentials that verify the vendor's webhooks. Credentials
          that belong to one seat, such as its own Slack app, are on the Seat.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec is the integration's desired state.
            properties:
              companyRef:
                description: companyRef names the Company this integration belongs
                  to. Immutable.
                properties:
                  name:
                    description: name is the metadata.name of a Company in this object's
                      namespace.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: companyRef is immutable
                  rule: self == oldSelf
              github:
                description: github connects GitHub.
                properties:
                  provisioning:
                    description: provisioning is where the webhooks are registered.
                    minProperties: 1
                    properties:
                      org:
                        description: |-
                          org is the GitHub organization holding the repositories. Crewlet's
                          `org`.
                        maxLength: 39
                        minLength: 1
                        pattern: ^[A-Za-z0-9-]+$
                        type: string
                      orgWebhook:
                        description: |-
                          orgWebhook is whether one organization hook replaces the
                          per-repository ones. Unset is Auto. Crewlet's `org_webhook`.
                        enum:
                        - Auto
                        - Require
                        - Never
                        type: string
                      repos:
                        description: |-
                          repos are repositories, as owner/name, to register a webhook on one by
                          one. Crewlet's `repos`.
                        items:
                          maxLength: 201
                          pattern: ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$
                          type: string
                        maxItems: 128
                        type: array
                        x-kubernetes-list-type: set
                    type: object
                  tokenSecretRef:
                    description: |-
                      tokenSecretRef is the Secret key holding an organization token with
                      the admin:org_hook scope, which the engine registers the company's
                      webhooks with. Unset registers none. Crewlet's `token`, a credential
                      position.
                    properties:
                      key:
                        description: key is the key within the Secret's data.
                        maxLength: 253
                        minLength: 1
                        pattern: ^[-._a-zA-Z0-9]+$
                        type: string
                      name:
                        description: name is the metadata.name of the Secret.
                        maxLength: 253
                        minLength: 1
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  url:
                    description: |-
                      url is the base URL of a GitHub Enterprise Server, such as
                      https://github.example.com. Unset is github.com. Crewlet's `url`.
                    maxLength: 2048
                    minLength: 1
                    type: string
                    x-kubernetes-validations:
                    - message: url must be an absolute https URL
                      rule: isURL(self) && url(self).getScheme() == 'https'
                  webhookSecretRef:
                    description: |-
                      webhookSecretRef is the Secret key holding the secret that verifies
                      webhooks delivered to the company-wide route. Crewlet's
                      `webhook_secret`, a credential position.
                    properties:
                      key:
                        description: key is the key within the Secret's data.
                        maxLength: 253
                        minLength: 1
                        pattern: ^[-._a-zA-Z0-9]+$
                        type: string
                      name:
                        description: name is the metadata.name of the Secret.
                        maxLength: 253
                        minLength: 1
                        type: string
                    required:
                    - key
                    - name
                    type: object
                required:
                - webhookSecretRef
                type: object
              slack:
                description: slack connects Slack.
                properties:
                  statusPhrases:
                    description: |-
                      statusPhrases replaces the words the working indicator shows.
                      Crewlet's `status_phrases`.
                    minProperties: 1
                    properties:
                      default:
                        description: default is shown in any phase without lines of
                          its own.
                        items:
                          maxLength: 256
                          minLength: 1
                          type: string
                        maxItems: 32
                        type: array
                        x-kubernetes-list-type: atomic
                      execute:
                        description: execute is shown while the seat works.
                        items:
                          maxLength: 256
                          minLength: 1
                          type: string
                        maxItems: 32
                        type: array
                        x-kubernetes-list-type: atomic
                      onboarding:
                        description: onboarding is shown during a seat's first-turn
                          onboarding pass.
                        items:
                          maxLength: 256
                          minLength: 1
                          type: string
                        maxItems: 32
                        type: array
                        x-kubernetes-list-type: atomic
                      review:
                        description: review is shown while the reviewer judges the
                          seat's work.
                        items:
                          maxLength: 256
                          minLength: 1
                          type: string
                        maxItems: 32
                        type: array
                        x-kubernetes-list-type: atomic
                    type: object
                  typingStatus:
                    description: |-
                      typingStatus is when a seat shows that it is working. Unset takes
                      Crewlet's default, Always. Crewlet's `typing_status`.
                    enum:
                    - Always
                    - Addressed
                    type: string
                type: object
            required:
            - companyRef
            type: object
            x-kubernetes-validations:
            - message: exactly one vendor (slack or github) must be set
              rule: '[has(self.slack), has(self.github)].filter(x, x).size() == 1'
            - message: an Integration's vendor cannot change; create another Integration
              rule: has(self.slack) == has(oldSelf.slack) && has(self.github) == has(oldSelf.github)
          status:
            description: status is the integration's observed state.
            minProperties: 1
            properties:
              conditions:
                description: |-
                  conditions are Accepted (the Company exists and has no other
                  Integration for the vendor), ResolvedRefs (every Secret key exists),
                  Applied (the integration is in the revision the engine runs) and
                  Healthy (the engine's own check of the vendor passes).
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 8
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: observedGeneration is the metadata.generation this status
                  describes.
                format: int64
                minimum: 1
                type: integer
              webhookURL:
                description: |-
                  webhookURL is the company-wide URL the vendor delivers webhooks to,
                  when the company is exposed and the vendor has one. Per-seat URLs are
                  in each Seat's status.
                maxLength: 2048
                minLength: 1
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
