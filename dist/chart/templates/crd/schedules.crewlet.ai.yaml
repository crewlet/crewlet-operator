{{- if .Values.crd.enabled }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    {{- if .Values.crd.keep }}
    "helm.sh/resource-policy": keep
    {{- end }}
    controller-gen.kubebuilder.io/version: v0.22.0
  name: schedules.crewlet.ai
spec:
  group: crewlet.ai
  names:
    categories:
    - crewlet
    kind: Schedule
    listKind: ScheduleList
    plural: schedules
    shortNames:
    - sched
    singular: schedule
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.companyRef.name
      name: Company
      type: string
    - jsonPath: .spec.target.seatRef.name
      name: Seat
      type: string
    - jsonPath: .spec.target.unitRef.name
      name: Unit
      type: string
    - jsonPath: .spec.schedule
      name: Schedule
      type: string
    - jsonPath: .spec.suspend
      name: Suspend
      type: boolean
    - jsonPath: .status.conditions[?(@.type=="Applied")].status
      name: Applied
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Schedule is recurring work a seat or a unit owns, fired on a cron schedule:
          the CronJob of a company.

          The Schedule's metadata.name is the schedule's name in the engine, which
          is half of the identity the engine claims each fire under, so that a fire
          runs once however often the engine evaluates its minute. Two Schedules of
          one seat or unit therefore never share a name, and a fire is never run
          twice.

          A fire that comes due while its seat is paused is skipped, not queued.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec is the schedule's desired state.
            properties:
              catchUp:
                description: |-
                  catchUp says whether an engine that starts after missing a fire runs
                  the most recent missed one, when it is recent enough (half the
                  schedule's period, within the engine's catch-up bounds); older misses
                  are never run. Unset is true. Crewlet's `catchup`.
                type: boolean
              companyRef:
                description: companyRef names the Company this schedule belongs to.
                  Immutable.
                properties:
                  name:
                    description: name is the metadata.name of a Company in this object's
                      namespace.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: companyRef is immutable
                  rule: self == oldSelf
              prompt:
                description: |-
                  prompt is the task the runner is handed each time the schedule fires,
                  such as "Post your standup: what shipped yesterday, what is next,
                  what blocks you." Crewlet's `task`.
                maxLength: 8192
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: 'prompt must not be blank: it is the task the schedule
                    hands its runner'
                  rule: self.matches('\\S')
              schedule:
                description: |-
                  schedule is when the task fires: a standard cron expression of five
                  fields (minute, hour, day of month, month, day of week), such as
                  "30 9 * * 1-5", evaluated in timeZone. When both the day of month and
                  the day of week are restricted, a day matches if either does. The
                  engine's dry run checks each field's values. Crewlet's `cron`.
                maxLength: 256
                minLength: 9
                type: string
                x-kubernetes-validations:
                - message: 'schedule is a cron expression of exactly five fields (minute
                    hour day-of-month month day-of-week), such as 30 9 * * 1-5; macros
                    such as @daily and a CRON_TZ= prefix are not supported: set timeZone
                    instead'
                  rule: self.matches('^\\s*\\S+(\\s+\\S+){4}\\s*$')
              suspend:
                description: |-
                  suspend keeps the schedule in the company without firing it. Unset
                  is false. Crewlet's `enabled`, inverted.
                type: boolean
              target:
                description: target is the seat or the unit whose schedule this is.
                minProperties: 1
                properties:
                  fanOut:
                    description: |-
                      fanOut is who in the unit runs it. Unset is Each. Crewlet's `target`.
                      The engine refuses a schedule that could never run while it is not
                      suspended: Each on a unit with no agent seat directly in it, and Lead
                      on a unit whose lead is a Human seat.
                    enum:
                    - Each
                    - Lead
                    type: string
                  seatRef:
                    description: |-
                      seatRef names the Seat, in this namespace, whose schedule this is; it
                      always runs as that seat. The Seat must be an Agent: the engine runs
                      no turn for a person. Rendered into the seat's role `schedules`.
                    properties:
                      name:
                        description: name is the metadata.name of the referenced object.
                        maxLength: 253
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  unitRef:
                    description: |-
                      unitRef names the Unit, in this namespace, whose schedule this is;
                      fanOut says who in it runs it. A unit's schedule is not inherited by
                      the units below it. Rendered into the unit's `schedules`.
                    properties:
                      name:
                        description: name is the metadata.name of the referenced object.
                        maxLength: 253
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                type: object
                x-kubernetes-validations:
                - message: a schedule targets exactly one of seatRef and unitRef
                  rule: has(self.seatRef) != has(self.unitRef)
                - message: 'fanOut applies to a unit''s schedule only: a seat''s schedule
                    always runs as that seat'
                  rule: '!has(self.fanOut) || has(self.unitRef)'
              timeZone:
                description: |-
                  timeZone is the IANA time zone the schedule is evaluated in, such as
                  Asia/Tokyo. Unset is the Company's spec.timeZone, which is UTC when
                  that is unset too. The engine refuses a zone it cannot load, and
                  Local, which would be whatever zone the engine's host is set to.
                  Crewlet's `timezone`.
                maxLength: 64
                minLength: 1
                pattern: ^[A-Za-z][A-Za-z0-9_+-]*(/[A-Za-z0-9_+-]+)*$
                type: string
              timeoutSeconds:
                description: |-
                  timeoutSeconds caps one scheduled turn's wall-clock time: a turn past
                  it starts no further round and ends failed. Unset is the engine's
                  default, 180 seconds. Crewlet's `timeout_seconds`.
                format: int32
                minimum: 1
                type: integer
            required:
            - companyRef
            - prompt
            - schedule
            - target
            type: object
          status:
            description: status is the schedule's observed state.
            minProperties: 1
            properties:
              conditions:
                description: |-
                  conditions are Accepted (the Company exists), ResolvedRefs (the seat
                  or unit it targets exists, and a seat is an Agent) and Applied (the
                  schedule is in the revision the engine runs).
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 8
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: observedGeneration is the metadata.generation this status
                  describes.
                format: int64
                minimum: 1
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
