apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "crewlet-operator.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  name: {{ include "crewlet-operator.resourceName" (dict "suffix" "manager-writes" "context" $) }}
spec:
  failurePolicy: Fail
  matchConditions:
  - expression: request.userInfo.username.startsWith('system:serviceaccount:') &&
      request.userInfo.username.endsWith('crewlet-operator-controller-manager')
    name: manager
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ""
      apiVersions:
      - '*'
      operations:
      - CREATE
      - UPDATE
      - DELETE
      resources:
      - secrets
      - serviceaccounts
      - services
      - persistentvolumeclaims
    - apiGroups:
      - ""
      apiVersions:
      - '*'
      operations:
      - DELETE
      resources:
      - pods
    - apiGroups:
      - apps
      apiVersions:
      - '*'
      operations:
      - CREATE
      - UPDATE
      - DELETE
      resources:
      - statefulsets
    - apiGroups:
      - policy
      apiVersions:
      - '*'
      operations:
      - CREATE
      - UPDATE
      - DELETE
      resources:
      - poddisruptionbudgets
    - apiGroups:
      - networking.k8s.io
      apiVersions:
      - '*'
      operations:
      - CREATE
      - UPDATE
      - DELETE
      resources:
      - ingresses
      - networkpolicies
    - apiGroups:
      - gateway.networking.k8s.io
      apiVersions:
      - '*'
      operations:
      - CREATE
      - UPDATE
      - DELETE
      resources:
      - httproutes
  validations:
  - expression: request.operation == 'DELETE' || variables.managed
    messageExpression: 'request.resource.resource + '' '' + request.namespace + ''/''
      + request.name + '': the operator writes only objects labelled app.kubernetes.io/managed-by=crewlet-operator'''
  - expression: request.operation == 'CREATE' || variables.wasManaged || (request.resource.resource
      == 'secrets' && request.operation == 'UPDATE' && object.?data.orValue({}) ==
      oldObject.?data.orValue({}) && object.?type == oldObject.?type)
    messageExpression: 'request.resource.resource + '' '' + request.namespace + ''/''
      + request.name + '': the operator changes or deletes only objects labelled app.kubernetes.io/managed-by=crewlet-operator'''
  - expression: request.resource.resource != 'secrets' || request.operation == 'DELETE'
      || object.?type.orValue('Opaque') == 'Opaque'
    message: the operator writes only Secrets of type Opaque
  - expression: request.resource.resource != 'statefulsets' || request.operation ==
      'DELETE' || (object.spec.template.spec.?serviceAccountName.orValue('').endsWith('-engine')
      && !object.spec.template.spec.?hostNetwork.orValue(false) && !object.spec.template.spec.?hostPID.orValue(false)
      && !object.spec.template.spec.?hostIPC.orValue(false) && object.spec.template.spec.?volumes.orValue([]).all(v,
      !has(v.hostPath)) && object.spec.template.spec.containers.all(c, !c.?securityContext.?privileged.orValue(false))
      && object.spec.template.spec.?initContainers.orValue([]).all(c, !c.?securityContext.?privileged.orValue(false)))
    message: 'the operator runs only engine pods: as a ServiceAccount named *-engine,
      without the node''s network, PID or IPC namespace, host paths or privileged
      containers'
  variables:
  - expression: '''app.kubernetes.io/managed-by'' in object.?metadata.?labels.orValue({})
      && object.metadata.labels[''app.kubernetes.io/managed-by''] == ''crewlet-operator'''
    name: managed
  - expression: '''app.kubernetes.io/managed-by'' in oldObject.?metadata.?labels.orValue({})
      && oldObject.metadata.labels[''app.kubernetes.io/managed-by''] == ''crewlet-operator'''
    name: wasManaged
