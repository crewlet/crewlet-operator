apiVersion: rbac.authorization.k8s.io/v1
{{- if .Values.rbac.namespaced }}
kind: Role
{{- else }}
kind: ClusterRole
{{- end }}
metadata:
{{- if .Values.rbac.namespaced }}
  namespace: {{ .Release.Namespace }}
{{- end }}
  name: {{ include "crewlet-operator.resourceName" (dict "suffix" "manager-role" "context" $) }}
rules:
- apiGroups:
  - crewlet.ai
  resources:
  - companies
  - engineclasses
  - mcpservers
  - seats
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - crewlet.ai
  resources:
  - companies/status
  verbs:
  - get
  - patch
  - update
