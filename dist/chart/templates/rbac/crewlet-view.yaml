apiVersion: rbac.authorization.k8s.io/v1
{{- if .Values.rbac.namespaced }}
kind: Role
{{- else }}
kind: ClusterRole
{{- end }}
metadata:
{{- if .Values.rbac.namespaced }}
  namespace: {{ .Release.Namespace }}
{{- end }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "crewlet-operator.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
    rbac.authorization.k8s.io/aggregate-to-view: "true"
  name: {{ include "crewlet-operator.resourceName" (dict "suffix" "crewlet-view" "context" $) }}
rules:
- apiGroups:
  - crewlet.ai
  resources:
  - companies
  - companies/status
  - integrations
  - integrations/status
  - llmproviders
  - llmproviders/status
  - mcpservers
  - mcpservers/status
  - schedules
  - schedules/status
  - seats
  - seats/status
  - units
  - units/status
  verbs:
  - get
  - list
  - watch
