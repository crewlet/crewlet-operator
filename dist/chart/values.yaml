## String to partially override chart.fullname template (will maintain the release name)
##
# nameOverride: ""

## String to fully override chart.fullname template
##
# fullnameOverride: ""

## Configure the controller manager deployment
##
manager:
  ## Set to false to skip manager installation
  ##
  enabled: true

  ## Two replicas with leader election: one reconciles, the other waits to
  ## take over, so a node drain or a crash does not stop reconciling for
  ## longer than the lease takes to move. --leader-elect in args below is
  ## what makes a second replica safe; keep it.
  ##
  replicas: 2

  image:
    repository: ghcr.io/crewlet/crewlet-operator
    ## Image tag. Empty means the chart's appVersion, which a release sets
    ## to its own tag, so a released chart deploys the image built with it.
    ##
    tag: ""
    pullPolicy: IfNotPresent

  ## Arguments
  ##
  args:
    - --leader-elect

  ## Environment variables
  ## POD_NAMESPACE is the operator's own namespace, which every engine's
  ## NetworkPolicy admits so that the operator can reach the engines it
  ## configures; keep it.
  ##
  env:
    - name: POD_NAMESPACE
      valueFrom:
        fieldRef:
          fieldPath: metadata.namespace

  ## Health probes.
  ## The manager serves the liveness (/healthz) and readiness (/readyz) endpoints on this port.
  ##
  healthProbe:
    # Health probe server port
    port: 8081

  ## Image pull secrets
  ##
  # imagePullSecrets:
  #   - name: myregistrykey

  ## Pod-level security settings
  ##
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  ## Container-level security settings
  ##
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: true

  ## Resource limits and requests.
  ## The manager's own footprint; every engine runs in a pod of its own,
  ## sized by its EngineClass. Its memory grows with the number of companies
  ## and their objects, which it caches. No CPU limit: a throttled manager
  ## only reconciles later, and reconciles in bursts.
  ##
  resources:
    limits:
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 128Mi

  ## Manager pod's affinity.
  ## The replicas prefer separate nodes, so that losing one node never takes
  ## both. The selector names the chart's default labels; change it with
  ## nameOverride.
  ##
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: crewlet-operator
                control-plane: controller-manager

  ## Manager pod's node selector
  ##
  nodeSelector: {}

  ## Manager pod's tolerations
  ##
  tolerations: []

  ## Deployment strategy
  ##
  # strategy:
  #   type: RollingUpdate
  #   rollingUpdate:
  #     maxSurge: 25%
  #     maxUnavailable: 25%

  ## Priority class name
  ##
  # priorityClassName: ""

  ## Topology spread constraints
  ##
  # topologySpreadConstraints: []

  ## Termination grace period seconds
  ##
  terminationGracePeriodSeconds: 10

  ## Custom Deployment labels
  ##
  # labels: {}

  ## Custom Deployment annotations
  ##
  # annotations: {}

  ## Custom Pod labels and annotations
  ##
  # pod:
  #   labels: {}
  #   annotations: {}

## RBAC configuration.
## The operator is cluster-scoped: it reads the cluster-scoped EngineClasses
## and runs Companies in every namespace, so its role is always a
## ClusterRole. There is no namespace-scoped mode; values.schema.json refuses
## rbac.namespaced.
##
## The ClusterRoles crewlet-edit and crewlet-view are always installed. They
## are aggregated into the built-in admin, edit and view roles, so that
## people manage and read crewlet.ai objects in the namespaces they already
## may edit or read.
##
rbac:
  ## Helper roles for CRD management (admin/editor/viewer)
  ##
  helpers:
    ## Install convenience admin/editor/viewer roles for each kind
    ##
    enabled: false

## The ClusterRole of a control plane that provisions tenants: it creates
## each tenant's namespace (the operator never creates namespaces), the
## crewlet.ai objects in it and the Secrets they reference, and reads the
## Secret each Company publishes for its API. Secrets in every namespace are
## a lot to hold: bind it only to the control plane's own identity.
##
tenantProvisioner:
  ## Install the ClusterRole
  ##
  enabled: false
  ## Subjects to bind it to with a ClusterRoleBinding; empty installs the
  ## role alone, for a binding of your own
  ##
  subjects: []
  # - kind: ServiceAccount
  #   name: control-plane
  #   namespace: platform

## ServiceAccount configuration
##
serviceAccount:
  # Install default ServiceAccount provided
  enabled: true

  ## Existing ServiceAccount name (required when enabled=false)
  ## Set to "default" to use the namespace default ServiceAccount
  ## Note: When enabled=true, respects nameOverride/fullnameOverride
  ##
  # name: ""

  ## Custom ServiceAccount annotations
  ##
  # annotations: {}

  ## Custom ServiceAccount labels
  ##
  # labels: {}

## Custom Resource Definitions
##
crd:
  # Install CRDs with the chart
  enabled: true
  # Keep CRDs when uninstalling
  keep: true

## Controller metrics endpoint.
## Enable to expose /metrics endpoint
##
metrics:
  enabled: true
  # Metrics server port
  port: 8443
  # Enable secure metrics: HTTPS with certs/auth (true) or HTTP (false).
  # Note: Metrics authn/authz needs ClusterRole access.
  secure: true

## Whether the ServiceMonitor verifies the metrics endpoint against the
## certificate in the Secret metrics-server-cert (ca.crt, tls.crt, tls.key)
## instead of skipping verification. The chart does not create that Secret:
## issue it (cert-manager or otherwise) in the release namespace first. The
## operator serves no admission webhooks, so nothing else needs a certificate.
##
certManager:
  enabled: false

## Prometheus ServiceMonitor for metrics scraping.
## Requires prometheus-operator to be installed in the cluster.
##
prometheus:
  enabled: false

  ## Custom ServiceMonitor labels
  ##
  # labels: {}

  ## Custom ServiceMonitor annotations
  ##
  # annotations: {}

## Network policies for controlling traffic flow.
## Enable to restrict ingress to the controller manager.
##
networkPolicy:
  enabled: false

