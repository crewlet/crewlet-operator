name: release

# Publishes a release from a `v*` tag: the multi-arch manager image, signed
# and attested; the engine image the release was tested against, tagged and
# signed; the Helm chart as an OCI artifact; and a GitHub Release with
# generated notes, the engine it runs and the kustomize-rendered install.yaml.
# Nothing is published unless the tagged commit is on main and passes `make
# check`. See RELEASING.md.
#
# API module tags (`api/v*`) do not match `v*` and release nothing here: a Go
# module tag is published by pushing it.

on:
  push:
    tags: ["v*"]

permissions: {}

# Two runs for one tag would race to publish the same artifacts.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GOTOOLCHAIN: auto
  IMAGE: ghcr.io/crewlet/crewlet-operator
  # Where a release keeps the engine it was tested against; see the engine
  # job.
  ENGINE_IMAGE: ghcr.io/crewlet/crewlet-operator/engine
  CHART_REPOSITORY: oci://ghcr.io/crewlet/charts

jobs:
  # The engine this release is tested against, kept. Every suite runs
  # crewlet's main image (ADR-0002), a tag that moves with every build of
  # crewlet's main, and GHCR deletes the image it named once main has moved
  # and the image is an hour old: often minutes after the move, sooner than
  # the gate takes. So the tag is resolved to one digest here, crewlet's
  # signature on it is checked for the commit its label names, and the image
  # is copied by that digest into this repository's engine package, under
  # that commit, before the gate tests the same commit. The copy names a
  # crewlet commit and nothing of this release: one left by a release whose
  # gate fails claims nothing. The image job gives it this release's tag and
  # this workflow's signature once the gate has passed.
  engine:
    name: engine (keep crewlet's main image)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Push the copy with the run's own token.
      packages: write
    outputs:
      digest: ${{ steps.keep.outputs.digest }}
      commit: ${{ steps.keep.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            api/go.sum
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # crewlet signs its main image in cosign 3's bundle format.
          cosign-release: v3.1.3
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The image is the Makefile's CREWLET_MAIN_IMG, the one every suite
      # runs; test/enginecommit reads its commit, as `make crewlet` does, by
      # the digest resolved first, so the two name one image.
      # `imagetools create` copies the index as it is, both platforms with
      # it, so the copy has the digest that was verified.
      - id: keep
        name: resolve, verify and copy crewlet's main image
        run: |
          set -euo pipefail
          main="$(sed -n 's/^CREWLET_MAIN_IMG := //p' Makefile)"
          test -n "$main"
          repository="${main%:*}"
          digest="$(docker buildx imagetools inspect "$main" --format '{{.Manifest.Digest}}')"
          commit="$(go run ./test/enginecommit "${repository}@${digest}")"
          cosign verify "${repository}@${digest}" \
            --certificate-identity 'https://github.com/crewlet/crewlet/.github/workflows/main-image.yml@refs/heads/main' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-github-workflow-sha "$commit" >/dev/null
          docker buildx imagetools create --tag "${ENGINE_IMAGE}:${commit}" "${repository}@${digest}"
          copied="$(docker buildx imagetools inspect "${ENGINE_IMAGE}:${commit}" --format '{{.Manifest.Digest}}')"
          if [ "$copied" != "$digest" ]; then
            echo "::error::the copy of ${repository}@${digest} is ${copied}"
            exit 1
          fi
          echo "Crewlet engine: crewlet commit ${commit}, ${repository}@${digest}, kept as ${ENGINE_IMAGE}:${commit}"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"

  # A tag is a claim that its commit is fit to ship, and nothing else checks
  # that claim: the tag protection in RELEASING.md decides who may push one,
  # not which commit it may point at. So the release first proves both halves
  # itself, before anything is published: the commit is on main (it went
  # through review and CI there), and it passes every gate CI runs, on this
  # very checkout, with the pinned tools, against the engine the engine job
  # kept.
  gate:
    name: gate (on main, make check)
    needs: engine
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Every branch and tag, so origin/main is there to compare with.
          fetch-depth: 0
      - name: the tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main; tag a commit of main."
            exit 1
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            api/go.sum
      # The commit the engine job kept, rather than main's image again, which
      # may have moved since.
      - name: make check, against the engine kept
        env:
          CREWLET_VERSION: ${{ needs.engine.outputs.commit }}
        run: make check

  image:
    name: image
    needs: [engine, gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Push to GHCR with the run's own token.
      packages: write
      # Keyless cosign signing and the provenance attestation both take an
      # OIDC token that names this workflow run.
      id-token: write
      attestations: write
      # actions/attest pushes the attestation next to the image and records
      # the image as an artifact of this repository (its storage record);
      # without this permission that record fails on every release.
      artifact-metadata: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No QEMU: the Dockerfile cross-compiles on the build platform, and the
      # final stage only copies the binary.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The tag itself (v1.2.3) and its minor (v1.2); `latest` only for a
      # tag without a pre-release suffix. The v is a prefix rather than part
      # of the pattern because, for a pre-release tag, metadata-action
      # replaces every pattern but {{raw}} with {{version}} and keeps only the
      # prefix: v0.2.0-rc.1 is then published as v0.2.0-rc.1 (by both lines),
      # which is the tag the chart's appVersion names.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},prefix=v
            type=semver,pattern={{major}}.{{minor}},prefix=v
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # The installer's own default lags cosign's releases; the binary
          # that signs is pinned here, to the newest.
          cosign-release: v3.1.3
      # Signs the manifest list by digest, so every tag that points at it
      # carries the signature and no tag can be moved under it.
      - name: sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      # The engine the gate tested, under this release's tag and with this
      # workflow's signature, as the image above: an installer runs the
      # engine the release was tested against, verifies it the same way, and
      # the operator orders the tag, a semantic version, so a class moved to
      # an older release's engine is refused (DowngradeRefused). The copy
      # carries no signature of crewlet's, which stays with the original.
      - name: tag and sign the engine
        env:
          ENGINE_DIGEST: ${{ needs.engine.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools create --tag "${ENGINE_IMAGE}:${GITHUB_REF_NAME}" "${ENGINE_IMAGE}@${ENGINE_DIGEST}"
          cosign sign --yes "${ENGINE_IMAGE}@${ENGINE_DIGEST}"
      # SLSA build provenance: actions/attest generates it when given no
      # predicate. (actions/attest-build-provenance is now only a wrapper
      # around this action, a release behind it.)
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  chart:
    name: chart
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            api/go.sum
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      # cosign reads registry credentials from Docker's configuration only;
      # `helm registry login` below writes Helm's own file, which cosign
      # never looks at, so without this login the signature push is refused
      # after the chart is already published.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The pinned helm from the Makefile; the same lint CI's verify job runs.
      - run: make helm-lint
      # The tag is the chart's version (without the v, as SemVer 2 requires)
      # and its appVersion (with it), and appVersion is the image tag the
      # chart deploys by default.
      - name: package and push the chart
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          bin/helm package dist/chart --version "$version" --app-version "$GITHUB_REF_NAME" --destination .
          echo "$REGISTRY_PASSWORD" | bin/helm registry login ghcr.io --username "$REGISTRY_USER" --password-stdin
          bin/helm push "crewlet-operator-${version}.tgz" "$CHART_REPOSITORY" 2>&1 | tee push.log
          digest="$(sed -n 's/^Digest: //p' push.log)"
          test -n "$digest"
          cosign sign --yes "${CHART_REPOSITORY#oci://}/crewlet-operator@${digest}"

  github-release:
    name: GitHub Release
    needs: [engine, image, chart]
    runs-on: ubuntu-latest
    permissions:
      # Creating the release and uploading its asset.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            api/go.sum
      # install.yaml pins the image by digest, so the manifest deploys exactly
      # the image this run signed even if the tag is later moved.
      - name: render install.yaml
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
        run: make build-installer IMG="${IMAGE}@${DIGEST}"
      # Notes are generated by GitHub from the pull requests merged since the
      # previous tag, sorted by .github/release.yml, after a line naming the
      # engine the release was tested against. A tag with a pre-release
      # suffix (v1.2.0-rc.1) is published as a pre-release.
      - name: create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENGINE_DIGEST: ${{ needs.engine.outputs.digest }}
          ENGINE_COMMIT: ${{ needs.engine.outputs.commit }}
        run: |
          set -euo pipefail
          prerelease=()
          case "$GITHUB_REF_NAME" in *-*) prerelease=(--prerelease) ;; esac
          engine="**Engine:** \`${ENGINE_IMAGE}:${GITHUB_REF_NAME}\` (\`${ENGINE_IMAGE}@${ENGINE_DIGEST}\`), crewlet's main at"
          engine+=" [${ENGINE_COMMIT:0:12}](https://github.com/crewlet/crewlet/commit/${ENGINE_COMMIT}), the engine this release"
          engine+=" was tested against: name it in an EngineClass's \`spec.engine.image\`"
          engine+=" ([Engine image](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/docs/guides/installing.md#engine-image))."
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --notes "$engine" \
            --title "$GITHUB_REF_NAME" "${prerelease[@]}" dist/install.yaml
