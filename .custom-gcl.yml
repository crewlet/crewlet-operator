# golangci-lint loads module plugins only by compiling them in, so `make lint`
# builds a custom binary from this file (see the golangci-lint target in the
# Makefile, which also checks that `version` matches GOLANGCI_LINT_VERSION).
#
# See: https://golangci-lint.run/plugins/module-plugins/
version: v2.14.0
plugins:
  # logcheck: structured logging calls follow the Kubernetes logging
  # conventions (balanced key/value pairs, constant messages).
  - module: "sigs.k8s.io/logtools"
    import: "sigs.k8s.io/logtools/logcheck/gclplugin"
    version: v0.10.1
  # kube-api-linter: the API types follow the Kubernetes API conventions.
  # The project publishes no tags; this is the head of main.
  - module: "sigs.k8s.io/kube-api-linter"
    version: v0.0.0-20260716143926-092fe0c72997
