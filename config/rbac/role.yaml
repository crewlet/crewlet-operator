kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - crewlet.ai
  resources:
  - companies
  - engineclasses
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - crewlet.ai
  resources:
  - companies/finalizers
  - engineclasses/finalizers
  verbs:
  - update
- apiGroups:
  - crewlet.ai
  resources:
  - companies/status
  - engineclasses/status
  verbs:
  - get
  - patch
  - update
