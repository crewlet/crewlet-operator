---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: units.crewlet.ai
spec:
  group: crewlet.ai
  names:
    categories:
    - crewlet
    kind: Unit
    listKind: UnitList
    plural: units
    shortNames:
    - un
    singular: unit
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.companyRef.name
      name: Company
      type: string
    - jsonPath: .spec.parentRef.name
      name: Parent
      type: string
    - jsonPath: .spec.leadRef.name
      name: Lead
      type: string
    - jsonPath: .status.conditions[?(@.type=="Applied")].status
      name: Applied
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Unit is one node of a company's org chart. Units nest through
          spec.parentRef; Seats join one through spec.unitRef.

          The Unit's metadata.name is the unit's stable id in Crewlet, which has its
          own rules: it must start with a lowercase letter and be at most 64
          characters, and may hold lowercase letters, digits and '-'. (Crewlet also
          admits '_' in a unit id, which no Kubernetes name can hold.)
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec is the unit's desired state.
            properties:
              channel:
                description: |-
                  channel is the unit's channel on the company's chat surface, such as
                  #platform; child units without one inherit it. Crewlet's `channel`.
                maxLength: 256
                minLength: 1
                type: string
              companyRef:
                description: companyRef names the Company this unit belongs to. Immutable.
                properties:
                  name:
                    description: name is the metadata.name of a Company in this object's
                      namespace.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: companyRef is immutable
                  rule: self == oldSelf
              displayName:
                description: |-
                  displayName is the unit's name as people read it, in prompts and on
                  boards. Unset is the Unit's metadata.name. The metadata.name itself is
                  the unit's stable id, which survives a rename. Crewlet's `name`; the
                  metadata.name is Crewlet's `id`, the key a seat's manages entry names
                  the unit by. The displayName is for reading only: nothing refers to a
                  unit by it, so two Units may share one.
                maxLength: 256
                minLength: 1
                type: string
              goals:
                description: goals are what the unit is working toward. Crewlet's
                  `goals`.
                items:
                  maxLength: 1024
                  minLength: 1
                  type: string
                maxItems: 32
                type: array
                x-kubernetes-list-type: atomic
              knowledge:
                description: |-
                  knowledge are free-text references to knowledge the unit relies on.
                  They are not a read scope. Crewlet's `knowledge`.
                items:
                  maxLength: 1024
                  minLength: 1
                  type: string
                maxItems: 32
                type: array
                x-kubernetes-list-type: atomic
              leadRef:
                description: |-
                  leadRef names the Seat that leads the unit. Unset inherits the
                  parent's lead. Crewlet's `lead`.
                properties:
                  name:
                    description: name is the metadata.name of the referenced object.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              mcp:
                description: |-
                  mcp are tool-server credentials and settings every agent seat
                  directly in this unit inherits; a seat's own values win per variable.
                  One entry per server, keyed by its name. Crewlet's `mcp_env`, a
                  credential position. Every credential comes from a Secret: the engine
                  provisions a credential for one seat, and a unit's are every member's.
                  A value one seat must not share, such as slack-mcp-server's channel
                  cache, belongs on the Seat.
                items:
                  description: |-
                    MCPCredentials are the values one tool server is started with for a seat:
                    environment variables for a Stdio server, request headers for an HTTP one.
                    They map onto one server's entry of Crewlet's mcp_env, a credential
                    position.

                    The server is named by a top-level name, as an imagePullSecrets entry names
                    its Secret, rather than by a nested reference, because name is the key of
                    the list that holds these: with a scalar key, server-side apply merges the
                    list entry by entry, so that one field manager (a control plane's GitHub
                    flow, say) can own the credentials of one server without owning, or
                    overwriting, every other server's.
                  properties:
                    env:
                      description: |-
                        env are the values. For a Stdio server each is an environment
                        variable of its process; for an HTTP server each is a request header
                        (the name is the header's name). Names must differ in more than case:
                        HTTP header names are case-insensitive, so Authorization and
                        authorization are one header.
                      items:
                        description: |-
                          MCPCredentialValue is one value a tool server is started with for a seat:
                          one of its credentials, from a Secret or provisioned by the engine, or a
                          setting that is no credential, written as a literal value. Whether it is an
                          environment variable or a request header depends on the server's
                          transport, which is why its name follows the grammar of an HTTP header
                          name, of which an environment variable's name is a subset.

                          A literal value is for a setting such as a path: slack-mcp-server, for one,
                          keeps the channels its bot can see in a file named after the workspace
                          alone, so each seat names its own (SLACK_MCP_CHANNELS_CACHE), or seats on
                          one engine pod are shown each other's private channels. Crewlet treats every
                          value of mcp_env as a credential and masks it on every read, and cannot
                          tell a setting from a credential; the name can, so a name that says it
                          holds a credential, as Crewlet reads one (see MCPEnvVar), takes valueFrom.
                        properties:
                          name:
                            description: |-
                              name is the environment variable's name (Stdio) or the header's name
                              (HTTP).
                            maxLength: 128
                            minLength: 1
                            pattern: ^[A-Za-z0-9!#$%&'*+.^_|~-]+$
                            type: string
                          value:
                            description: |-
                              value is a literal value, for a setting that is no credential. It
                              lands in the company document as written, where anyone who can read
                              this object reads it too. An empty string is a valid value, which is
                              why the field is a pointer.
                            maxLength: 4096
                            type: string
                            x-kubernetes-validations:
                            - message: 'value may not hold a ${NAME} reference: the
                                operator refuses every one it did not write, since
                                in many fields the engine resolves one from its own
                                secret store and environment, which hold credentials
                                that are not this object''s to name'
                              rule: '!self.matches(''[$][{][A-Za-z_][A-Za-z0-9_]*[}]'')'
                          valueFrom:
                            description: |-
                              valueFrom is where a credential comes from: a Secret key, or, for a
                              Seat's own credentials, the engine (provisioned). For a header the
                              value is the whole header, scheme included (for example "Bearer
                              <token>"); a provisioned value is the credential alone, so provision
                              one for a variable rather than a header.
                            minProperties: 1
                            properties:
                              provisioned:
                                description: |-
                                  provisioned is a value the engine creates and keeps, under an
                                  Integration with provisioning Engine.
                                properties:
                                  name:
                                    description: |-
                                      name names the value among the seat's provisioned credentials. Every
                                      place a seat names the same provisioned name refers to one value, so
                                      a token given to a tool server's environment and to the seat's
                                      sandbox is one token; different names are different values, such as
                                      an account's token and its email address.
                                    maxLength: 32
                                    minLength: 1
                                    pattern: ^[a-z0-9][a-z0-9-]*$
                                    type: string
                                required:
                                - name
                                type: object
                              secretKeyRef:
                                description: secretKeyRef selects the Secret key that
                                  holds the value.
                                properties:
                                  key:
                                    description: key is the key within the Secret's
                                      data.
                                    maxLength: 253
                                    minLength: 1
                                    pattern: ^[-._a-zA-Z0-9]+$
                                    type: string
                                  name:
                                    description: name is the metadata.name of the
                                      Secret.
                                    maxLength: 253
                                    minLength: 1
                                    type: string
                                required:
                                - key
                                - name
                                type: object
                            type: object
                            x-kubernetes-validations:
                            - message: exactly one of secretKeyRef and provisioned
                                must be set
                              rule: has(self.secretKeyRef) != has(self.provisioned)
                        required:
                        - name
                        type: object
                        x-kubernetes-validations:
                        - message: exactly one of value and valueFrom must be set
                          rule: has(self.value) != has(self.valueFrom)
                        - fieldPath: .value
                          message: 'value may not be given to a name that says it
                            holds a credential, which comes from a Secret through
                            valueFrom: one of its parts, cut at every character that
                            is not a letter or a digit, is, in any case, KEY, KEYS,
                            APIKEY, ACCESSKEY, SECRETKEY, TOKEN, SECRET, PASSWORD,
                            PASSWD, CREDENTIAL, CREDENTIALS, AUTH, OAUTH or PAT, as
                            Crewlet reads a credential''s name, or it is the Authorization,
                            Proxy-Authorization or Cookie header'
                          rule: '!has(self.value) || !(self.name.matches(''(?i)(^|[^A-Za-z0-9])(KEY|KEYS|APIKEY|ACCESSKEY|SECRETKEY|TOKEN|SECRET|PASSWORD|PASSWD|CREDENTIAL|CREDENTIALS|AUTH|OAUTH|PAT)([^A-Za-z0-9]|$)'')
                            || self.name.lowerAscii() in [''authorization'', ''proxy-authorization'',
                            ''cookie''])'
                      maxItems: 32
                      minItems: 1
                      type: array
                      x-kubernetes-list-map-keys:
                      - name
                      x-kubernetes-list-type: map
                      x-kubernetes-validations:
                      - message: 'names must differ in more than case: HTTP header
                          names are case-insensitive'
                        rule: self.all(a, self.exists_one(b, b.name.lowerAscii() ==
                          a.name.lowerAscii()))
                    name:
                      description: |-
                        name is the metadata.name of the MCPServer, in this namespace, the
                        values are for.
                      maxLength: 253
                      minLength: 1
                      type: string
                  required:
                  - env
                  - name
                  type: object
                maxItems: 16
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
                x-kubernetes-validations:
                - message: 'a unit''s credentials come from Secrets: the engine provisions
                    a credential for one seat, so name it on the Seat'
                  rule: self.all(c, c.env.all(v, !has(v.valueFrom) || !has(v.valueFrom.provisioned)))
              parentRef:
                description: |-
                  parentRef names the Unit this one belongs to. Unset makes it a
                  top-level unit. A parent that does not exist, or a chain of parents
                  that leads back to this unit, is reported on this Unit.
                properties:
                  name:
                    description: name is the metadata.name of the referenced object.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              project:
                description: |-
                  project is the tracker project the unit files work in, by its key.
                  Crewlet requires a container key to be an upper-case letter followed
                  by 1 to 9 upper-case letters or digits, such as PLAT. Crewlet's
                  `project`.
                maxLength: 10
                minLength: 2
                pattern: ^[A-Z][A-Z0-9]{1,9}$
                type: string
              purpose:
                description: purpose is what the unit is for. Crewlet's `purpose`.
                maxLength: 2048
                minLength: 1
                type: string
              space:
                description: |-
                  space is the knowledge container the unit writes pages in, by its
                  key, which follows the same rule as project. Crewlet's `space`.
                maxLength: 10
                minLength: 2
                pattern: ^[A-Z][A-Z0-9]{1,9}$
                type: string
              type:
                description: type is an informational label. Crewlet's `type`.
                enum:
                - Division
                - Department
                - Group
                - Team
                - Squad
                - Pod
                - Guild
                - Chapter
                - Unit
                type: string
            required:
            - companyRef
            type: object
          status:
            description: status is the unit's observed state.
            minProperties: 1
            properties:
              conditions:
                description: |-
                  conditions are Accepted (the Company exists), ResolvedRefs (the
                  parent, the lead, the tool servers and every Secret key exist, and the
                  parents form no cycle) and Applied (the unit is in the revision the
                  engine runs).
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 8
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              depth:
                description: |-
                  depth is the unit's distance from the top of the chart: 0 for a
                  top-level unit.
                format: int32
                minimum: 0
                type: integer
              observedGeneration:
                description: observedGeneration is the metadata.generation this status
                  describes.
                format: int64
                minimum: 1
                type: integer
              seats:
                description: seats is the number of Seats directly in the unit.
                format: int32
                minimum: 0
                type: integer
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: 'a Unit''s name is its Crewlet unit id: it must start with a lowercase
            letter, hold only lowercase letters, digits and ''-'', and be at most
            64 characters'
          rule: self.metadata.name.matches('^[a-z][a-z0-9-]{0,63}$')
    served: true
    storage: true
    subresources:
      status: {}
