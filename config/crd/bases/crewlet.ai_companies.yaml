---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: companies.crewlet.ai
spec:
  group: crewlet.ai
  names:
    categories:
    - crewlet
    kind: Company
    listKind: CompanyList
    plural: companies
    shortNames:
    - cmp
    singular: company
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.engineClassName
      name: Class
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.topology.data.readyReplicas
      name: Pods
      type: integer
    - jsonPath: .status.config.objects.seats
      name: Seats
      type: integer
    - jsonPath: .status.config.revisionID
      name: Revision
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Company is one Crewlet company: the operator runs an engine for it and keeps
          the engine's company document equal to what the Company and the objects that
          name it declare.

          The Company's name becomes part of the names of the objects the operator
          creates for it (the data StatefulSet and the engine Service), so it must be
          a DNS label of at most 47 characters: a StatefulSet name longer than 52
          characters overflows its pods' controller-revision-hash label.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec is the company's desired state.
            properties:
              companyName:
                description: |-
                  companyName is the company's name. Crewlet derives every seat's
                  identity from it and the seat's handle, so it cannot be changed: a new
                  name would orphan every seat's memory. Crewlet's `name`.
                maxLength: 256
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: 'companyName is immutable: every seat''s identity is derived
                    from it'
                  rule: self == oldSelf
              config:
                default:
                  managementPolicy: Enforce
                description: config is how the operator manages the company's document.
                minProperties: 1
                properties:
                  managementPolicy:
                    default: Enforce
                    description: |-
                      managementPolicy says who owns the document. Under Enforce the data
                      pod's crewlet.yaml sets Crewlet's api.auth.company_writers to the
                      operator's own token, so the engine refuses every other token a change
                      to the document; under Observe and Seed it sets none. The engine reads
                      crewlet.yaml only at start, so changing the policy to or from Enforce
                      restarts the data pod.
                    enum:
                    - Enforce
                    - Observe
                    - Seed
                    type: string
                type: object
              deletionPolicy:
                default: Retain
                description: |-
                  deletionPolicy is what happens to the data volumes when the Company is
                  deleted. With Retain the keyring Secret is kept as well, since the
                  volumes cannot be read without it.
                enum:
                - Retain
                - Delete
                type: string
              embeddings:
                description: |-
                  embeddings is the provider vectors are computed with. Unset leaves
                  search keyword-only. Crewlet's providers.embeddings.
                properties:
                  apiKeySecretRef:
                    description: |-
                      apiKeySecretRef is the Secret key holding the API key. Crewlet's
                      `api_key`, a credential position. Required for type OpenAI: Crewlet
                      reads OPENAI_API_KEY from the environment when it is unset, and the
                      engine's environment never carries one (see spec.runtime.env). An
                      OpenAICompatible endpoint that needs no key may omit it.
                    properties:
                      key:
                        description: key is the key within the Secret's data.
                        maxLength: 253
                        minLength: 1
                        pattern: ^[-._a-zA-Z0-9]+$
                        type: string
                      name:
                        description: name is the metadata.name of the Secret.
                        maxLength: 253
                        minLength: 1
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  baseURL:
                    description: |-
                      baseURL is the endpoint of an OpenAI-compatible service. Crewlet's
                      `base_url`.
                    maxLength: 2048
                    minLength: 1
                    type: string
                    x-kubernetes-validations:
                    - message: baseURL must be an absolute http or https URL
                      rule: isURL(self) && url(self).getScheme() in ['http', 'https']
                    - message: 'baseURL may not hold a ${NAME} reference: the engine
                        would resolve it from its own secret store and environment,
                        which hold credentials that are not this object''s to name'
                      rule: '!self.matches(''[$][{][A-Za-z_][A-Za-z0-9_]*[}]'')'
                  dimensions:
                    description: |-
                      dimensions is the vector width. Unset takes the model's own width,
                      which Crewlet knows for the models it names; any other model needs it
                      stated, and it must match what the model produces.
                    format: int32
                    maximum: 4096
                    minimum: 64
                    type: integer
                  maxBatchInputs:
                    description: |-
                      maxBatchInputs is the most inputs one request may carry. Unset takes
                      the model's documented limit; it may only lower it.
                    format: int32
                    minimum: 1
                    type: integer
                  maxBatchTokens:
                    description: |-
                      maxBatchTokens is the most tokens one request may carry, summed over
                      its inputs. Unset takes the model's documented limit; it may only
                      lower it.
                    format: int32
                    minimum: 1
                    type: integer
                  maxInputTokens:
                    description: |-
                      maxInputTokens is the most tokens one input may hold. Unset takes the
                      model's documented window; it may only lower it.
                    format: int32
                    minimum: 1
                    type: integer
                  model:
                    description: model is the embedding model id.
                    maxLength: 256
                    minLength: 1
                    type: string
                    x-kubernetes-validations:
                    - message: 'model may not hold a ${NAME} reference: the engine
                        would resolve it from its own secret store and environment,
                        which hold credentials that are not this object''s to name'
                      rule: '!self.matches(''[$][{][A-Za-z_][A-Za-z0-9_]*[}]'')'
                  type:
                    default: OpenAI
                    description: type is which embeddings API the provider speaks.
                    enum:
                    - OpenAI
                    - OpenAICompatible
                    type: string
                required:
                - model
                type: object
                x-kubernetes-validations:
                - message: baseURL is required for type OpenAICompatible
                  rule: self.type != 'OpenAICompatible' || has(self.baseURL)
                - message: apiKeySecretRef is required for type OpenAI
                  rule: self.type != 'OpenAI' || has(self.apiKeySecretRef)
              engineClassName:
                description: |-
                  engineClassName is the EngineClass the company runs with. Unset uses
                  the class annotated crewlet.ai/is-default-class=true.

                  Whoever may write a Company may name any class, including one that
                  offers platformLLMProviders or larger limits; a class admits only the
                  namespaces its spec.allowedNamespaces selects, and a Company in any
                  other is not accepted (ClassNotAllowed).
                maxLength: 253
                minLength: 1
                type: string
              engineConfig:
                description: |-
                  engineConfig is passed through into the company document as written,
                  for the engine's tuning blocks that have no field here: turn_engine,
                  learning, scheduling, workers, skill_variables and the
                  notification_* settings, spelled as Crewlet spells them. Each entry is
                  one top-level key of the document and its value. The operator does not
                  interpret it; the engine validates it in the dry run before every
                  apply, and a refusal is reported on the Company.

                  It may not set what another field or object of this API owns: name,
                  mission, vision, policies, timezone, tracker, knowledge, token_budget,
                  providers, integrations, mcp_servers, roles or units. Every position
                  Crewlet holds a credential in lives under one of those keys, so
                  engineConfig can never carry a credential: the API server refuses a
                  Company whose engineConfig names one of them, before anything is
                  stored.
                items:
                  description: |-
                    EngineConfigEntry is one top-level key of the company document that
                    spec.engineConfig passes through, and its value.
                  properties:
                    name:
                      description: name is the key, as Crewlet spells it, such as
                        turn_engine.
                      maxLength: 63
                      minLength: 1
                      pattern: ^[a-z][a-z0-9_]*$
                      type: string
                    value:
                      description: |-
                        value is the key's value: an object, a list, a string, a number or a
                        boolean, kept as written.
                      x-kubernetes-preserve-unknown-fields: true
                  required:
                  - name
                  - value
                  type: object
                maxItems: 64
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
                x-kubernetes-validations:
                - message: 'engineConfig may not set name, mission, vision, policies,
                    timezone, tracker, knowledge, token_budget, providers, integrations,
                    mcp_servers, roles or units: those are fields and objects of this
                    API, and the only blocks that hold credentials'
                  rule: self.all(e, !(e.name in ['name', 'mission', 'vision', 'policies',
                    'timezone', 'tracker', 'knowledge', 'token_budget', 'providers',
                    'integrations', 'mcp_servers', 'roles', 'units']))
              exposure:
                description: exposure overrides how the company is reached.
                minProperties: 1
                properties:
                  publicBaseURL:
                    description: |-
                      publicBaseURL is the HTTPS address vendors deliver webhooks to,
                      overriding the one the class's webhooks.hostname derives. Required when
                      the class's webhooks.mode is External, where something outside the
                      operator (a relay, an API gateway) forwards its /webhooks/ path to the
                      engine. A trailing '/' is dropped, as Crewlet drops it. Crewlet's
                      integrations.public_base_url.
                    maxLength: 2048
                    minLength: 1
                    type: string
                    x-kubernetes-validations:
                    - message: publicBaseURL must be an absolute https URL
                      rule: isURL(self) && url(self).getScheme() == 'https' && url(self).getHostname()
                        != ''
                    - message: 'publicBaseURL may not hold a ${NAME} reference: the
                        engine would resolve it from its own secret store and environment,
                        which hold credentials that are not this object''s to name'
                      rule: '!self.matches(''[$][{][A-Za-z_][A-Za-z0-9_]*[}]'')'
                type: object
              integrations:
                description: integrations is company-wide integration behaviour.
                minProperties: 1
                properties:
                  checkIntervalSeconds:
                    description: |-
                      checkIntervalSeconds is how long a working integration is trusted
                      before the engine reads it back, and so how long access revoked at the
                      vendor goes unnoticed. Unset takes Crewlet's default of 600. Crewlet's
                      integrations.check_interval_seconds.
                    format: int32
                    minimum: 60
                    type: integer
                type: object
              knowledge:
                description: knowledge is which knowledge base the company runs.
                minProperties: 1
                properties:
                  backend:
                    default: Native
                    description: backend is which knowledge base the company runs.
                    enum:
                    - Native
                    - None
                    type: string
                  rootSpace:
                    description: |-
                      rootSpace is the container holding the company's own pages, such as
                      the root onboarding page, a container key (see scope). Unset takes
                      Crewlet's default. Crewlet's `root_space`.
                    maxLength: 10
                    minLength: 2
                    pattern: ^[A-Z][A-Z0-9]{1,9}$
                    type: string
                  scope:
                    description: |-
                      scope narrows every knowledge search to these containers. Empty
                      searches the whole company. Each is a container key, which Crewlet
                      requires to be an upper-case letter followed by 1 to 9 upper-case
                      letters or digits, such as PLAT. Crewlet's `scope`.
                    items:
                      maxLength: 10
                      minLength: 2
                      pattern: ^[A-Z][A-Z0-9]{1,9}$
                      type: string
                    maxItems: 64
                    type: array
                    x-kubernetes-list-type: set
                  skillsContainer:
                    description: |-
                      skillsContainer is the container holding tool-skill pages, a container
                      key (see scope). Unset takes Crewlet's default container; an empty
                      string turns tool skills off. Crewlet's `skills_container`.
                    maxLength: 10
                    type: string
                    x-kubernetes-validations:
                    - message: 'skillsContainer must be empty or a container key:
                        an upper-case letter followed by 1 to 9 upper-case letters
                        or digits'
                      rule: self == '' || self.matches('^[A-Z][A-Z0-9]{1,9}$')
                  vectors:
                    description: |-
                      vectors fuses semantic recall into knowledge and work search; false
                      also stops embedding the corpus. Unset is on exactly when the company
                      has an embeddings provider; true requires one (spec.embeddings).
                      Crewlet's `vectors`.
                    type: boolean
                type: object
              llm:
                description: llm is how the company chooses among its model providers.
                minProperties: 1
                properties:
                  order:
                    description: |-
                      order is the providers' precedence. A seat with no default chain runs
                      on the first provider here, and on it alone: Crewlet tries no other
                      provider of the order when its keys are all cooling down, so give a
                      seat a chain for a fallback. The providers the order leaves out follow
                      it: the company's LLMProviders by name, then the platform providers by
                      name. Crewlet's providers.llm_order.
                    items:
                      description: |-
                        LLMProviderReference names a model provider: an LLMProvider in the
                        referring object's namespace, or a provider the EngineClass offers.
                      properties:
                        kind:
                          default: LLMProvider
                          description: kind is the kind of provider named.
                          enum:
                          - LLMProvider
                          - PlatformLLMProvider
                          type: string
                        name:
                          description: |-
                            name is the LLMProvider's metadata.name, or the platform provider's
                            name.
                          maxLength: 253
                          minLength: 1
                          type: string
                      required:
                      - name
                      type: object
                    maxItems: 32
                    type: array
                    x-kubernetes-list-type: atomic
                    x-kubernetes-validations:
                    - message: order must name each provider once
                      rule: self.all(a, self.exists_one(b, b.kind == a.kind && b.name
                        == a.name))
                  usePlatformProviders:
                    description: |-
                      usePlatformProviders adds the EngineClass's platformLLMProviders to the
                      company, so seats can run on models the platform provides. Their keys
                      are pushed into the company's engine, where the tenant can read them
                      (see the class's platformLLMProviders).
                    type: boolean
                type: object
              mission:
                description: |-
                  mission is one line on what the company is for; every seat's prompt
                  carries it. Crewlet's `mission`.
                maxLength: 2048
                minLength: 1
                type: string
              objects:
                description: objects is the company's own access to its class's object
                  store.
                minProperties: 1
                properties:
                  credentialsSecretRef:
                    description: |-
                      credentialsSecretRef is a Secret, in the Company's namespace, holding
                      the keys accessKeyID and secretAccessKey (S3AccessKeyIDKey,
                      S3SecretAccessKeyKey) the engine reaches its class's S3 bucket with:
                      Crewlet's store.objects.s3.access_key_id and secret_access_key. Used
                      only while the class's objects.backend is S3.

                      Issue them per company, with a policy that admits the company's own
                      prefix of the bucket only (the class's objects.s3.prefix, expanded):
                      they are written into the engine pod's crewlet.yaml, and code the
                      tenant runs in the pod (a stdio MCP server, a sandbox setup command)
                      can read them. Unset uses the pod's own credentials through the SDK's
                      default chain: a workload identity bound through the class's
                      serviceAccount.annotations, which every company of the class shares
                      unless it is scoped per tenant.
                    properties:
                      name:
                        description: name is the metadata.name of the Secret.
                        maxLength: 253
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                type: object
              policies:
                description: |-
                  policies are company-wide rules every seat's prompt carries. Crewlet's
                  `policies`.
                items:
                  maxLength: 2048
                  minLength: 1
                  type: string
                maxItems: 64
                type: array
                x-kubernetes-list-type: atomic
              runtime:
                description: runtime is the company's bounded overrides of its class.
                minProperties: 1
                properties:
                  env:
                    description: |-
                      env adds environment variables to the engine container, for platform
                      wiring the engine reads from its environment. They are merged over the
                      class's podTemplate.spec.env by name: a variable here replaces the
                      class's variable of the same name.

                      Names starting with CREWLET_ or OTEL_ are the operator's own.
                      ANTHROPIC_API_KEY and OPENAI_API_KEY are refused too: Crewlet reads them
                      as the key of a model or embeddings provider that names none, so a
                      value here would be a credential outside the engine's secret store;
                      give the provider its key with apiKeySecretRefs or apiKeySecretRef.
                    items:
                      description: |-
                        EnvVar is an environment variable set on the engine's pods. Unlike
                        SecretEnvVar it may carry a literal value, because it is not a Crewlet
                        credential position but platform wiring (a feature flag, an endpoint); a
                        sensitive value is referenced from a Secret with valueFrom, which Kubernetes
                        resolves when it starts the container, so the value never appears in the pod
                        template.
                      properties:
                        name:
                          description: name is the variable's name.
                          maxLength: 128
                          minLength: 1
                          pattern: ^[A-Za-z_][A-Za-z0-9_]*$
                          type: string
                        value:
                          description: |-
                            value is the variable's literal value. An empty string is a valid
                            value, which is why the field is a pointer.
                          maxLength: 4096
                          type: string
                        valueFrom:
                          description: valueFrom reads the value from a Secret key
                            in the Company's namespace.
                          properties:
                            secretKeyRef:
                              description: secretKeyRef selects the Secret key that
                                holds the value.
                              properties:
                                key:
                                  description: key is the key within the Secret's
                                    data.
                                  maxLength: 253
                                  minLength: 1
                                  pattern: ^[-._a-zA-Z0-9]+$
                                  type: string
                                name:
                                  description: name is the metadata.name of the Secret.
                                  maxLength: 253
                                  minLength: 1
                                  type: string
                              required:
                              - key
                              - name
                              type: object
                          required:
                          - secretKeyRef
                          type: object
                      required:
                      - name
                      type: object
                      x-kubernetes-validations:
                      - message: exactly one of value and valueFrom must be set
                        rule: has(self.value) != has(self.valueFrom)
                    maxItems: 32
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                    x-kubernetes-validations:
                    - message: variables starting with CREWLET_ or OTEL_ are set by
                        the operator
                      rule: self.all(e, !e.name.startsWith('CREWLET_') && !e.name.startsWith('OTEL_'))
                    - message: 'ANTHROPIC_API_KEY and OPENAI_API_KEY are model provider
                        keys: give a provider its key with a Secret reference instead'
                      rule: self.all(e, !(e.name in ['ANTHROPIC_API_KEY', 'OPENAI_API_KEY']))
                  version:
                    description: |-
                      version replaces the tag of the class's engine image, for example
                      v0.14.3. It is honoured only when the class sets
                      engine.allowVersionOverride; the operator refuses a version older than
                      the one the company's data was last written by.
                    maxLength: 128
                    minLength: 1
                    pattern: ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$
                    type: string
                type: object
              sandbox:
                description: |-
                  sandbox is where seats run code. Unset gives no seat a sandbox.
                  Crewlet's providers.sandbox.
                properties:
                  defaultCodingAgent:
                    description: |-
                      defaultCodingAgent is the coding agent of seats that name none.
                      Crewlet's `default_coding_agent`.
                    enum:
                    - ClaudeCode
                    - OpenCode
                    type: string
                  defaultMaxTurns:
                    description: |-
                      defaultMaxTurns caps the agentic rounds of a coding run on seats that
                      name none. Unset or 0 is uncapped. Crewlet's `default_max_turns`.
                    format: int32
                    minimum: 0
                    type: integer
                  defaultPauseTTLSeconds:
                    description: |-
                      defaultPauseTTLSeconds is how long a sandbox waiting on a person's
                      answer stays paused before it is reclaimed. Unset takes Crewlet's
                      default of 1800; 0 never pauses. Crewlet's
                      `default_pause_ttl_seconds`.
                    format: int32
                    minimum: 0
                    type: integer
                  defaultTimeoutSeconds:
                    description: |-
                      defaultTimeoutSeconds is how long a sandbox outlives an engine that
                      stopped renewing it. It never stops a running job. Crewlet's
                      `default_timeout_seconds`.
                    format: int32
                    minimum: 1
                    type: integer
                  e2b:
                    description: e2b is the remote sandbox service.
                    properties:
                      apiKeySecretRef:
                        description: |-
                          apiKeySecretRef is the Secret key holding the service's API key.
                          Crewlet's `api_key`, a credential position.
                        properties:
                          key:
                            description: key is the key within the Secret's data.
                            maxLength: 253
                            minLength: 1
                            pattern: ^[-._a-zA-Z0-9]+$
                            type: string
                          name:
                            description: name is the metadata.name of the Secret.
                            maxLength: 253
                            minLength: 1
                            type: string
                        required:
                        - key
                        - name
                        type: object
                      domain:
                        description: |-
                          domain points at a self-hosted cluster of the service. Unset is the
                          vendor's cloud.
                        maxLength: 253
                        minLength: 1
                        type: string
                        x-kubernetes-validations:
                        - message: 'domain may not hold a ${NAME} reference: the engine
                            would resolve it from its own secret store and environment,
                            which hold credentials that are not this object''s to
                            name'
                          rule: '!self.matches(''[$][{][A-Za-z_][A-Za-z0-9_]*[}]'')'
                      template:
                        description: |-
                          template is the sandbox template, which also fixes each sandbox's CPU,
                          memory and disk.
                        maxLength: 253
                        minLength: 1
                        type: string
                        x-kubernetes-validations:
                        - message: 'template may not hold a ${NAME} reference: the
                            engine would resolve it from its own secret store and
                            environment, which hold credentials that are not this
                            object''s to name'
                          rule: '!self.matches(''[$][{][A-Za-z_][A-Za-z0-9_]*[}]'')'
                    required:
                    - apiKeySecretRef
                    type: object
                  setup:
                    description: |-
                      setup is applied to every sandbox before each seat's own steps.
                      Crewlet's `setup`.
                    items:
                      description: |-
                        SandboxSetupStep is one provisioning step applied to a sandbox before the
                        coding agent starts. It maps onto a Crewlet sandbox setup step.
                      properties:
                        brief:
                          description: |-
                            brief tells the coding agent what this step made true about the
                            sandbox.
                          maxLength: 2048
                          minLength: 1
                          type: string
                        commands:
                          description: |-
                            commands are shell commands run in order; one that exits non-zero
                            fails the sandbox. Crewlet's `commands`. Crewlet substitutes every
                            ${NAME} in them (NAME an identifier) from the engine's own secret
                            store and environment before the sandbox runs them, so ${HOME} would be
                            the engine's, not the sandbox's, and the API refuses ${NAME}: write a
                            sandbox variable as $NAME. Parameter expansions such as ${1:-x} are
                            not substituted and are allowed.
                          items:
                            maxLength: 4096
                            minLength: 1
                            type: string
                          maxItems: 32
                          type: array
                          x-kubernetes-list-type: atomic
                          x-kubernetes-validations:
                          - message: 'commands may not hold a ${NAME} reference: the
                              engine would resolve it from its own secret store and
                              environment, which hold credentials that are not this
                              object''s to name'
                            rule: self.all(x, !x.matches('[$][{][A-Za-z_][A-Za-z0-9_]*[}]'))
                        env:
                          description: |-
                            env is merged into the environment of the commands and of the run.
                            Crewlet's `env`, a credential position.
                          items:
                            description: |-
                              SecretEnvVar is a named credential delivered as an environment variable,
                              such as a tool server's API token. Crewlet treats every value in the
                              positions that use this type as a credential, so a literal value is not
                              accepted: the value always comes from a Secret.
                            properties:
                              name:
                                description: name is the variable's name.
                                maxLength: 128
                                minLength: 1
                                pattern: ^[A-Za-z_][A-Za-z0-9_]*$
                                type: string
                              valueFrom:
                                description: valueFrom is the Secret key the value
                                  is read from.
                                properties:
                                  secretKeyRef:
                                    description: secretKeyRef selects the Secret key
                                      that holds the value.
                                    properties:
                                      key:
                                        description: key is the key within the Secret's
                                          data.
                                        maxLength: 253
                                        minLength: 1
                                        pattern: ^[-._a-zA-Z0-9]+$
                                        type: string
                                      name:
                                        description: name is the metadata.name of
                                          the Secret.
                                        maxLength: 253
                                        minLength: 1
                                        type: string
                                    required:
                                    - key
                                    - name
                                    type: object
                                required:
                                - secretKeyRef
                                type: object
                            required:
                            - name
                            - valueFrom
                            type: object
                          maxItems: 32
                          type: array
                          x-kubernetes-list-map-keys:
                          - name
                          x-kubernetes-list-type: map
                        files:
                          description: |-
                            files are written into the sandbox before the commands run. Crewlet's
                            `files`, a credential position.
                          items:
                            description: |-
                              SandboxFile is a file written into a sandbox before its commands run. Its
