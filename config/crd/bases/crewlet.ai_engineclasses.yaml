                      properties:
                        name:
                          description: name is the metadata.name of the referenced
                            object.
                          maxLength: 253
                          minLength: 1
                          type: string
                      required:
                      - name
                      type: object
                    maxItems: 8
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                required:
                - image
                type: object
                x-kubernetes-validations:
                - message: 'allowVersionOverride needs an image by tag: a Company''s
                    spec.runtime.version replaces the tag, and an image pinned by
                    digest has none'
                  rule: '!has(self.allowVersionOverride) || !self.allowVersionOverride
                    || !self.image.contains(''@'')'
              exposure:
                default:
                  api:
                    mode: ClusterInternal
                  artifacts:
                    mode: None
                  webhooks:
                    mode: None
                description: exposure is how each company is reached from outside
                  its namespace.
                minProperties: 1
                properties:
                  api:
                    default:
                      mode: ClusterInternal
                    description: api is how the engine's API is reached.
                    minProperties: 1
                    properties:
                      gateway:
                        description: gateway is the Gateways to attach to, for mode
                          Gateway.
                        properties:
                          parentRefs:
                            description: parentRefs are the Gateways the HTTPRoute
                              attaches to.
                            items:
                              description: |-
                                GatewayParentReference names a Gateway API Gateway (or one listener of it)
                                that the operator attaches a company's HTTPRoute to.
                              properties:
                                name:
                                  description: name is the Gateway's name.
                                  maxLength: 253
                                  minLength: 1
                                  type: string
                                namespace:
                                  description: |-
                                    namespace is the Gateway's namespace. Unset is the Company's own
                                    namespace.
                                  maxLength: 63
                                  minLength: 1
                                  type: string
                                sectionName:
                                  description: |-
                                    sectionName is the name of one listener of the Gateway. Unset attaches
                                    to every listener that accepts the route.
                                  maxLength: 253
                                  minLength: 1
                                  type: string
                              required:
                              - name
                              type: object
                            maxItems: 8
                            minItems: 1
                            type: array
                            x-kubernetes-list-type: atomic
                          proxyNamespaces:
                            description: |-
                              proxyNamespaces are the namespaces the pods that carry the Gateways'
                              traffic run in. Under networkPolicy Isolated they are admitted to the
                              one port of the engine the route reaches: the public listener for the
                              webhooks' route, the API port for the API's, the artifact listener for
                              the artifacts'. Unset is the namespaces
                              of parentRefs, which is right for
                              implementations that run a proxy beside each Gateway (Istio, for
                              example); implementations with a shared data plane run it elsewhere
                              (Envoy Gateway in envoy-gateway-system, for example) and need it named
                              here.
                            items:
                              maxLength: 63
                              minLength: 1
                              pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                              type: string
                            maxItems: 8
                            minItems: 1
                            type: array
                            x-kubernetes-list-type: set
                        required:
                        - parentRefs
                        type: object
                      hostname:
                        description: |-
                          hostname is the API's host name, as a template with the variables and
                          rules of webhooks.hostname, and one rule more.

                          It is also where a browser reaches the engine (the Company's
                          status.endpoints.dashboardBaseURL, unless the Company states its own),
                          and an origin the engine accepts a person's write from, and Crewlet
                          refuses to start on a browser's address whose host ends in a label
                          that is a number: a browser reads such a host as an IPv4 address and
                          rewrites it before it sends it. So its last label may not be one
                          ({{uid}}.123, {{uid}}.0x1f), where webhooks.hostname's may. A last
                          label a variable fills is a number only for some Companies: one whose
                          namespace is a number (4711, 0x1f) under {{name}}.{{namespace}}, or
                          whose namespace or name makes one with the template's own characters
                          beside it ({{uid}}.0x{{name}} for a Company named cafe; a Company's
                          name begins with a letter, so it is never a number alone). That
                          Company's engine is held back, with RuntimeReady=False AddressRefused,
                          rather than started to refuse. Ending the template in a domain of your
                          own, as in {{name}}.{{namespace}}.crewlet.example.com, leaves it to no
                          Company.
                        maxLength: 253
                        minLength: 1
                        type: string
                        x-kubernetes-validations:
                        - message: hostname may use only the variables {{namespace}},
                            {{name}} and {{uid}}
                          rule: '!self.replace(''{{namespace}}'', '''').replace(''{{name}}'',
                            '''').replace(''{{uid}}'', '''').contains(''{'' + ''{'')'
                        - message: 'hostname must contain {{uid}}, or {{name}} and
                            {{namespace}} joined by a ''.'', so that no two companies
                            share a host name: names and namespaces hold ''-'', so
                            {{namespace}}-{{name}} is team-a-b-web for both team-a/b-web
                            and team-a-b/web'
                          rule: self.contains('{{uid}}') || self.contains('{{name}}.{{namespace}}')
                            || self.contains('{{namespace}}.{{name}}')
                        - message: hostname must be a lowercase DNS name once its
                            variables are replaced
                          rule: self.replace('{{namespace}}', 'n').replace('{{name}}',
                            'n').replace('{{uid}}', 'u').matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$')
                        - message: 'hostname may not end in a label that is a number,
                            such as {{uid}}.123 or {{uid}}.0x1f: a browser reads the
                            host as an IPv4 address and rewrites it before it sends
                            it, and Crewlet refuses to start on such an address; end
                            it in a label that is not one, such as a domain of your
                            own'
                          rule: '!self.matches(''(^|[.])([0-9]+|0x[0-9a-f]*)$'')'
                      ingress:
                        description: ingress is the Ingress settings, for mode Ingress.
                        properties:
                          annotations:
                            additionalProperties:
                              type: string
                            description: |-
                              annotations are added to the Ingress, for the controller that serves it
