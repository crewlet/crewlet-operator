                      Grok or MuseCode. Crewlet''s profiles for OpenCode, KimiCode,
                      Hermes and Pi name no key variable: give Hermes, Pi or OpenCode
                      its model provider''s key in env under mode Subscription; KimiCode
                      reads a key only from its own files, which a platform provider
                      does not give it'
                    rule: '!has(self.auth) || !has(self.auth.mode) || self.auth.mode
                      != ''APIKey'' || self.agent in [''ClaudeCode'', ''Codex'', ''GeminiCLI'',
                      ''QwenCode'', ''CursorAgent'', ''Copilot'', ''Grok'', ''MuseCode'']'
                  - fieldPath: .env
                    message: 'env may not set the CLI''s own token or key variable
                      (ClaudeCode''s CLAUDE_CODE_OAUTH_TOKEN and ANTHROPIC_API_KEY,
                      Codex''s CODEX_API_KEY, GeminiCLI''s GEMINI_API_KEY, QwenCode''s
                      OPENAI_API_KEY, CursorAgent''s CURSOR_API_KEY, Copilot''s COPILOT_GITHUB_TOKEN,
                      Grok''s XAI_API_KEY, MuseCode''s META_API_KEY): Crewlet''s auth
                      owns it, and whether a value in env reaches the CLI would turn
                      on the auth mode. Give the key as auth.apiKeySecretRef with
                      auth mode APIKey'
                    rule: '!has(self.env) || !self.env.exists(e, (self.agent == ''ClaudeCode''
                      && e.name in [''CLAUDE_CODE_OAUTH_TOKEN'', ''ANTHROPIC_API_KEY''])
                      || (self.agent == ''Codex'' && e.name == ''CODEX_API_KEY'')
                      || (self.agent == ''GeminiCLI'' && e.name == ''GEMINI_API_KEY'')
                      || (self.agent == ''QwenCode'' && e.name == ''OPENAI_API_KEY'')
                      || (self.agent == ''CursorAgent'' && e.name == ''CURSOR_API_KEY'')
                      || (self.agent == ''Copilot'' && e.name == ''COPILOT_GITHUB_TOKEN'')
                      || (self.agent == ''Grok'' && e.name == ''XAI_API_KEY'') ||
                      (self.agent == ''MuseCode'' && e.name == ''META_API_KEY''))'
                  - fieldPath: .env
                    message: 'env may not set a variable Crewlet sets on every call
                      of the CLI to keep it inside its seat''s own home and its call''s
                      working directory: HOME, XDG_CONFIG_HOME, XDG_DATA_HOME, XDG_STATE_HOME,
                      XDG_CACHE_HOME or TMPDIR for any CLI, and ClaudeCode''s CLAUDE_CONFIG_DIR,
                      CLAUDE_CODE_DISABLE_CLAUDE_MDS and CLAUDE_CODE_DISABLE_AUTO_MEMORY,
                      Codex''s CODEX_HOME and CODEX_SQLITE_HOME, OpenCode''s OPENCODE_CONFIG_DIR
                      and OPENCODE_CONFIG_PROJECT_DISABLE, CursorAgent''s CURSOR_CONFIG_DIR,
                      KimiCode''s KIMI_CODE_HOME, Hermes''s HERMES_HOME or Pi''s PI_CODING_AGENT_DIR.
                      A value there would replace that isolation for every seat on
                      the provider, so Crewlet refuses the document: drop it'
