                      env:
                        description: |-
                          env adds environment variables to the engine container of every
                          Company of the class: platform wiring that is the same for all of
                          them, such as the address of the platform's own API. Every value,
                          one from a Secret included, reaches every tenant of the class: code
                          the tenant runs in the engine's pod can read its environment. They are
                          the engine's environment, not that of the processes it starts: a Stdio
                          tool server is handed only the part Crewlet's allowlist names, such as
                          PATH and the TLS and proxy variables, a coding CLI that part and the
                          variables its Crewlet profile passes through, such as GeminiCLI's
                          GOOGLE_CLOUD_PROJECT and GOOGLE_CLOUD_LOCATION, and a sandbox run none
                          of it. So a variable a tool server reads goes in its MCPServer's env
                          (docs/guides/tool-servers.md), and any other a coding CLI reads in its
                          LLMProvider's spec.env. A Company's spec.runtime.env is merged over
                          this env by name. The same names are refused as there: those
                          starting with CREWLET_ or OTEL_, and ANTHROPIC_API_KEY and
                          OPENAI_API_KEY.
                        items:
                          description: |-
                            ClassEnvVar is an environment variable an EngineClass sets on the engine
                            pods of every Company of the class: platform wiring such as the address of
                            the platform's own API. A value from a Secret is copied by the operator into
                            a Secret it owns in each Company's namespace and referenced from the pod, as
                            telemetry headers are, so the value never appears in the pod template and the
                            platform's Secret never has to be readable from a tenant namespace. The
                            value is in every tenant's engine pod all the same, where code the tenant
                            runs can read it: put nothing here a tenant must not hold.
                          properties:
                            name:
                              description: name is the variable's name.
                              maxLength: 128
                              minLength: 1
                              pattern: ^[A-Za-z_][A-Za-z0-9_]*$
                              type: string
                            value:
                              description: |-
                                value is the variable's literal value. An empty string is a valid
                                value, which is why the field is a pointer.
                              maxLength: 4096
                              type: string
                            valueFrom:
                              description: |-
                                valueFrom reads the value from a Secret key in a namespace the
                                platform controls.
                              properties:
                                secretKeyRef:
                                  description: secretKeyRef selects the Secret key
                                    that holds the value.
                                  properties:
                                    key:
                                      description: key is the key within the Secret's
                                        data.
                                      maxLength: 253
                                      minLength: 1
                                      pattern: ^[-._a-zA-Z0-9]+$
                                      type: string
                                    name:
                                      description: name is the metadata.name of the
                                        Secret.
                                      maxLength: 253
                                      minLength: 1
                                      type: string
                                    namespace:
                                      description: namespace is the namespace the
                                        Secret is in.
                                      maxLength: 63
                                      minLength: 1
                                      type: string
                                  required:
                                  - key
                                  - name
                                  - namespace
                                  type: object
                              required:
                              - secretKeyRef
                              type: object
                          required:
                          - name
                          type: object
                          x-kubernetes-validations:
                          - message: exactly one of value and valueFrom must be set
                            rule: has(self.value) != has(self.valueFrom)
                        maxItems: 32
                        type: array
                        x-kubernetes-list-map-keys:
                        - name
                        x-kubernetes-list-type: map
                        x-kubernetes-validations:
                        - message: variables starting with CREWLET_ or OTEL_ are set
