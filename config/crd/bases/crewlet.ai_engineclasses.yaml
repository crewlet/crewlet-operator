                      && e.name in [''CODEX_HOME'', ''CODEX_SQLITE_HOME'']) || (self.agent
                      == ''OpenCode'' && e.name in [''OPENCODE_CONFIG_DIR'', ''OPENCODE_CONFIG_PROJECT_DISABLE''])
                      || (self.agent == ''CursorAgent'' && e.name == ''CURSOR_CONFIG_DIR'')
                      || (self.agent == ''KimiCode'' && e.name == ''KIMI_CODE_HOME'')
                      || (self.agent == ''Hermes'' && e.name == ''HERMES_HOME'') ||
                      (self.agent == ''Pi'' && e.name == ''PI_CODING_AGENT_DIR''))'
                  - fieldPath: .model
                    message: 'an OpenCode model is <provider>/<model>, which OpenCode
                      splits at its first slash: a model with no slash, or with nothing
                      but white space before or after it, names no provider or no
                      model, and every call the provider makes would fail inside OpenCode,
                      which OpenCode 2 refuses as Invalid model reference. Name the
                      provider as OpenCode spells it (opencode models --standalone
                      lists them), such as anthropic/claude-sonnet-5 or openrouter/anthropic/claude-sonnet-5,
                      with that provider''s key in env'
