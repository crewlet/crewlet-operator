---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: llmproviders.crewlet.ai
spec:
  group: crewlet.ai
  names:
    categories:
    - crewlet
    kind: LLMProvider
    listKind: LLMProviderList
    plural: llmproviders
    shortNames:
    - llmp
    singular: llmprovider
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.companyRef.name
      name: Company
      type: string
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .spec.model
      name: Model
      type: string
    - jsonPath: .status.conditions[?(@.type=="Applied")].status
      name: Applied
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          LLMProvider is a model provider a company's seats can run on: one entry of
          Crewlet's providers.llm.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec is the provider's desired state.
            properties:
              apiKeySecretRefs:
                description: |-
                  apiKeySecretRefs are the provider's API keys, each a key of a Secret in
                  this namespace. With more than one, Crewlet rotates through them,
                  setting aside a key that hits a rate limit or is refused, in the order
                  listed when several are equally free. Crewlet's `api_keys`, a
                  credential position: the values are pushed into the engine's secret
                  store and the document refers to them by name only. Required for types
                  Anthropic and OpenAI; an OpenAICompatible endpoint that needs no key
                  may omit it.
                items:
                  description: |-
                    SecretKeyReference selects one key of a Secret in the referring object's
                    namespace. The operator reads the value when it renders the company and
                    pushes it into the engine's encrypted secret store; the value itself never
                    appears in the company document, in a pod template or in any status.
                  properties:
                    key:
                      description: key is the key within the Secret's data.
                      maxLength: 253
                      minLength: 1
                      pattern: ^[-._a-zA-Z0-9]+$
                      type: string
                    name:
                      description: name is the metadata.name of the Secret.
                      maxLength: 253
                      minLength: 1
                      type: string
                  required:
                  - key
                  - name
                  type: object
                maxItems: 16
                minItems: 1
                type: array
                x-kubernetes-list-type: atomic
              baseURL:
                description: |-
                  baseURL sends requests to this endpoint instead of the vendor's own,
                  for a gateway or a proxy. Required for type OpenAICompatible. Crewlet's
                  `base_url`.
                maxLength: 2048
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: baseURL must be an absolute http or https URL
                  rule: isURL(self) && url(self).getScheme() in ['http', 'https']
                - message: 'baseURL may not hold a ${NAME} reference: the engine would
                    resolve it from its own secret store and environment, which hold
                    credentials that are not this object''s to name'
                  rule: '!self.matches(''[$][{][A-Za-z_][A-Za-z0-9_]*[}]'')'
              claudeModel:
                description: |-
                  claudeModel names the Claude model whose request shape an Anthropic
                  provider uses when model is a gateway alias Crewlet cannot recognise.
                  Crewlet's `claude_model`; type Anthropic only.
                maxLength: 256
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: 'claudeModel may not hold a ${NAME} reference: the engine
                    would resolve it from its own secret store and environment, which
                    hold credentials that are not this object''s to name'
                  rule: '!self.matches(''[$][{][A-Za-z_][A-Za-z0-9_]*[}]'')'
              companyRef:
                description: companyRef names the Company this provider belongs to.
                  Immutable.
                properties:
                  name:
                    description: name is the metadata.name of a Company in this object's
                      namespace.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: companyRef is immutable
                  rule: self == oldSelf
              cooldowns:
                description: |-
                  cooldowns is how long a failing key is set aside. Crewlet's
                  `cooldowns`.
                minProperties: 1
                properties:
                  authSeconds:
                    description: |-
                      authSeconds is how long a key the provider refused is set aside. Unset
                      takes Crewlet's default of 300.
                    format: int32
                    maximum: 86400
                    minimum: 60
                    type: integer
                  rateLimitSeconds:
                    description: |-
                      rateLimitSeconds is how long a key that hit a rate limit is set aside.
                      Unset takes Crewlet's default of 3600.
                    format: int32
                    maximum: 86400
                    minimum: 60
                    type: integer
                type: object
              model:
                description: |-
                  model is the model id requests are sent for, as the provider names it.
                  Crewlet's `model`.
                maxLength: 256
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: 'model may not hold a ${NAME} reference: the engine would
                    resolve it from its own secret store and environment, which hold
                    credentials that are not this object''s to name'
                  rule: '!self.matches(''[$][{][A-Za-z_][A-Za-z0-9_]*[}]'')'
              reasoning:
                description: |-
                  reasoning turns on an OpenAI reasoning model's effort, so that
                  reasoningEffort is sent. Crewlet's `reasoning`; type OpenAI only.
                type: boolean
              reasoningBudgetTokens:
                description: |-
                  reasoningBudgetTokens is the thinking budget of an older, budget-based
                  Claude model. Unset means such a model does not think. Crewlet's
                  `reasoning_budget_tokens`; type Anthropic only.
                format: int32
                minimum: 1024
                type: integer
              reasoningEffort:
                description: |-
                  reasoningEffort is how hard the model thinks. For Anthropic it is sent
                  on every call, and unset means High. For OpenAI it is sent only while
                  reasoning is true, so it requires reasoning; an OpenAICompatible
                  provider cannot turn reasoning on and takes no reasoningEffort.
                  Crewlet's `reasoning_effort`.
                enum:
                - Low
                - Medium
                - High
                - XHigh
                - Max
                type: string
              timeoutSeconds:
                description: |-
                  timeoutSeconds bounds one HTTP attempt: the whole of a unary call, the
                  longest silence in a streamed one. Unset takes Crewlet's default of
                  600. Crewlet's `timeout_seconds`.
                format: int32
                minimum: 1
                type: integer
              type:
                description: type is which model API the provider speaks. Crewlet's
                  `type`.
                enum:
                - Anthropic
                - OpenAI
                - OpenAICompatible
                type: string
            required:
            - companyRef
            - model
            - type
            type: object
            x-kubernetes-validations:
            - message: claudeModel applies to type Anthropic only
              rule: '!has(self.claudeModel) || self.type == ''Anthropic'''
            - message: reasoning applies to type OpenAI only; an Anthropic model's
                thinking depth is reasoningEffort
              rule: '!has(self.reasoning) || self.type == ''OpenAI'''
            - message: reasoningEffort is sent to an OpenAI model only while reasoning
                is true, and never to an OpenAICompatible one
              rule: '!has(self.reasoningEffort) || self.type == ''Anthropic'' || (self.type
                == ''OpenAI'' && has(self.reasoning) && self.reasoning)'
            - message: reasoningBudgetTokens applies to type Anthropic only
              rule: '!has(self.reasoningBudgetTokens) || self.type == ''Anthropic'''
            - message: baseURL is required for type OpenAICompatible, which has no
                default endpoint
              rule: self.type != 'OpenAICompatible' || has(self.baseURL)
            - message: apiKeySecretRefs needs at least one key for types Anthropic
                and OpenAI
              rule: self.type == 'OpenAICompatible' || has(self.apiKeySecretRefs)
          status:
            description: status is the provider's observed state.
            minProperties: 1
            properties:
              conditions:
                description: |-
                  conditions are Accepted (the Company exists), ResolvedRefs (every
                  Secret key exists) and Applied (the provider is in the revision the
                  engine runs).
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 8
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: observedGeneration is the metadata.generation this status
                  describes.
                format: int64
                minimum: 1
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
