---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: mcpservers.crewlet.ai
spec:
  group: crewlet.ai
  names:
    categories:
    - crewlet
    kind: MCPServer
    listKind: MCPServerList
    plural: mcpservers
    shortNames:
    - mcps
    singular: mcpserver
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.companyRef.name
      name: Company
      type: string
    - jsonPath: .spec.transport
      name: Transport
      type: string
    - jsonPath: .spec.shared
      name: Shared
      type: boolean
    - jsonPath: .status.conditions[?(@.type=="Applied")].status
      name: Applied
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          MCPServer is a Model Context Protocol tool server a company's agents call.

          The name crewlet is reserved: the engine gives a seat's own tool bridge that
          name inside a coding agent's sandbox.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec is the server's desired state.
            properties:
              args:
                description: |-
                  args are the executable's arguments. Crewlet's `args`, which it passes
                  on as written: it resolves no ${NAME} in them.
                items:
                  maxLength: 4096
                  type: string
                maxItems: 64
                type: array
                x-kubernetes-list-type: atomic
                x-kubernetes-validations:
                - message: 'args may not hold a ${NAME} reference: the operator refuses
                    every one it did not write, since in many fields the engine resolves
                    one from its own secret store and environment, which hold credentials
                    that are not this object''s to name'
                  rule: self.all(x, !x.matches('[$][{][A-Za-z_][A-Za-z0-9_]*[}]'))
              command:
                description: |-
                  command is the executable a Stdio server is launched with, as a process
                  of the engine's container, by the engine's user. It must be installed
                  in the engine image, and Crewlet's image ships no Python or Node.js
                  runtime (docs/guides/tool-servers.md). Crewlet's `command`, which it
                  passes on as written: it resolves no ${NAME} in it.
                maxLength: 1024
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: 'command may not hold a ${NAME} reference: the operator
                    refuses every one it did not write, since in many fields the engine
                    resolves one from its own secret store and environment, which
                    hold credentials that are not this object''s to name'
                  rule: '!self.matches(''[$][{][A-Za-z_][A-Za-z0-9_]*[}]'')'
              companyRef:
                description: companyRef names the Company this server belongs to.
                  Immutable.
                properties:
                  name:
                    description: name is the metadata.name of a Company in this object's
                      namespace.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: companyRef is immutable
                  rule: self == oldSelf
              env:
                description: |-
                  env is the environment of a Stdio server's process, shared by every
                  instance; per-seat values belong in a Seat's or a Unit's spec.mcp,
                  which win over these. It is laid over the part of the engine's own
                  environment Crewlet hands a tool server: PATH, the locale, the TLS and
                  proxy variables and the engine user's HOME, among a few others
                  (docs/guides/tool-servers.md). Nothing else of the engine's
                  environment reaches the server: a variable the engine image sets with
                  ENV, or the class or the Company sets on the pod, reaches it only when
                  it is one of those, so every other variable the server reads is given
                  here. Crewlet's `env`, a credential position.
                items:
                  description: |-
                    MCPEnvVar is one variable of a Stdio tool server's environment, which every
                    instance of the server starts with: a credential, read from a Secret, or a
                    setting that is no credential, written as a literal value, such as the
                    address of the service the server reaches or a switch that turns one of its
                    tools on.

                    Crewlet treats a server's whole environment as credentials, masking every
                    value on every read, so it cannot tell the two apart; a name can. A name
                    says it holds a credential when one of its parts, cut at every character
                    that is not a letter or a digit and read without case, is KEY, KEYS,
                    APIKEY, ACCESSKEY, SECRETKEY, TOKEN, SECRET, PASSWORD, PASSWD, CREDENTIAL,
                    CREDENTIALS, AUTH, OAUTH or PAT, which is how Crewlet itself reads a
                    credential's name (cliprofile.IsCredentialName), or when it is one of the
                    HTTP headers that carry one, Authorization, Proxy-Authorization and
                    Cookie; such a name takes valueFrom, never a literal. So GITLAB_TOKEN,
                    TAVILY_API_KEY and X-Api-Key come from Secrets, and JIRA_URL or
                    SLACK_MCP_ADD_MESSAGE_TOOL may be written out. The rule keeps a credential
                    from being typed where a setting goes; a credential under a name that says
                    nothing (a URL with a password in it, say) is still yours to keep in a
                    Secret.
                  properties:
                    name:
                      description: name is the variable's name.
                      maxLength: 128
                      minLength: 1
                      pattern: ^[A-Za-z_][A-Za-z0-9_]*$
                      type: string
                    value:
                      description: |-
                        value is a literal value, for a setting that is no credential. It
                        lands in the company document as written, where anyone who can read
                        this object reads it too. An empty string is a valid value, which is
                        why the field is a pointer.
                      maxLength: 4096
                      type: string
                      x-kubernetes-validations:
                      - message: 'value may not hold a ${NAME} reference: the operator
                          refuses every one it did not write, since in many fields
                          the engine resolves one from its own secret store and environment,
                          which hold credentials that are not this object''s to name'
                        rule: '!self.matches(''[$][{][A-Za-z_][A-Za-z0-9_]*[}]'')'
                    valueFrom:
                      description: valueFrom reads a credential from a Secret key.
                      properties:
                        secretKeyRef:
                          description: secretKeyRef selects the Secret key that holds
                            the value.
                          properties:
                            key:
                              description: key is the key within the Secret's data.
                              maxLength: 253
                              minLength: 1
                              pattern: ^[-._a-zA-Z0-9]+$
                              type: string
                            name:
                              description: name is the metadata.name of the Secret.
                              maxLength: 253
                              minLength: 1
                              type: string
                          required:
                          - key
                          - name
                          type: object
                      required:
                      - secretKeyRef
                      type: object
                  required:
                  - name
                  type: object
                  x-kubernetes-validations:
                  - message: exactly one of value and valueFrom must be set
                    rule: has(self.value) != has(self.valueFrom)
                  - fieldPath: .value
                    message: 'value may not be given to a name that says it holds
                      a credential, which comes from a Secret through valueFrom: one
                      of its parts, cut at every character that is not a letter or
                      a digit, is, in any case, KEY, KEYS, APIKEY, ACCESSKEY, SECRETKEY,
                      TOKEN, SECRET, PASSWORD, PASSWD, CREDENTIAL, CREDENTIALS, AUTH,
                      OAUTH or PAT, as Crewlet reads a credential''s name, or it is
                      the Authorization, Proxy-Authorization or Cookie header'
                    rule: '!has(self.value) || !(self.name.matches(''(?i)(^|[^A-Za-z0-9])(KEY|KEYS|APIKEY|ACCESSKEY|SECRETKEY|TOKEN|SECRET|PASSWORD|PASSWD|CREDENTIAL|CREDENTIALS|AUTH|OAUTH|PAT)([^A-Za-z0-9]|$)'')
                      || self.name.lowerAscii() in [''authorization'', ''proxy-authorization'',
                      ''cookie''])'
                maxItems: 32
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              headers:
                description: |-
                  headers are sent with every request to an HTTP server, shared by every
                  instance; per-seat values belong in a Seat's or a Unit's spec.mcp.
                  Header names are case-insensitive, so names must differ in more than
                  case. Crewlet's `headers`, a credential position.
                items:
                  description: |-
                    MCPHeader is one header of every request to an HTTP tool server, which every
                    instance of the server sends: a credential, read from a Secret, such as the
                    Authorization header, or a setting that is no credential, written as a
                    literal value, by the rule MCPEnvVar states.
                  properties:
                    name:
                      description: name is the header's name.
                      maxLength: 128
                      minLength: 1
                      pattern: ^[A-Za-z0-9!#$%&'*+.^_|~-]+$
                      type: string
                    value:
                      description: |-
                        value is a literal value, for a setting that is no credential. It
                        lands in the company document as written, where anyone who can read
                        this object reads it too. An empty string is a valid value, which is
                        why the field is a pointer.
                      maxLength: 4096
                      type: string
                      x-kubernetes-validations:
                      - message: 'value may not hold a ${NAME} reference: the operator
                          refuses every one it did not write, since in many fields
                          the engine resolves one from its own secret store and environment,
                          which hold credentials that are not this object''s to name'
                        rule: '!self.matches(''[$][{][A-Za-z_][A-Za-z0-9_]*[}]'')'
                    valueFrom:
                      description: |-
                        valueFrom reads a credential from a Secret key, which holds the whole
                        header value, scheme included (for example "Bearer <token>").
                      properties:
                        secretKeyRef:
                          description: secretKeyRef selects the Secret key that holds
                            the value.
                          properties:
                            key:
                              description: key is the key within the Secret's data.
                              maxLength: 253
                              minLength: 1
                              pattern: ^[-._a-zA-Z0-9]+$
                              type: string
                            name:
                              description: name is the metadata.name of the Secret.
                              maxLength: 253
                              minLength: 1
                              type: string
                          required:
                          - key
                          - name
                          type: object
                      required:
                      - secretKeyRef
                      type: object
                  required:
                  - name
                  type: object
                  x-kubernetes-validations:
                  - message: exactly one of value and valueFrom must be set
                    rule: has(self.value) != has(self.valueFrom)
                  - fieldPath: .value
                    message: 'value may not be given to a name that says it holds
                      a credential, which comes from a Secret through valueFrom: one
                      of its parts, cut at every character that is not a letter or
                      a digit, is, in any case, KEY, KEYS, APIKEY, ACCESSKEY, SECRETKEY,
                      TOKEN, SECRET, PASSWORD, PASSWD, CREDENTIAL, CREDENTIALS, AUTH,
                      OAUTH or PAT, as Crewlet reads a credential''s name, or it is
                      the Authorization, Proxy-Authorization or Cookie header'
                    rule: '!has(self.value) || !(self.name.matches(''(?i)(^|[^A-Za-z0-9])(KEY|KEYS|APIKEY|ACCESSKEY|SECRETKEY|TOKEN|SECRET|PASSWORD|PASSWD|CREDENTIAL|CREDENTIALS|AUTH|OAUTH|PAT)([^A-Za-z0-9]|$)'')
                      || self.name.lowerAscii() in [''authorization'', ''proxy-authorization'',
                      ''cookie''])'
                maxItems: 32
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
                x-kubernetes-validations:
                - message: 'names must differ in more than case: HTTP header names
                    are case-insensitive'
                  rule: self.all(a, self.exists_one(b, b.name.lowerAscii() == a.name.lowerAscii()))
              optionalKeys:
                description: |-
                  optionalKeys names the keys whose value may go missing: variables of env
                  (Stdio) or headers (HTTP), and the values every Seat and Unit gives the
                  server in spec.mcp, which land in the same environment or the same headers.
                  Crewlet starts a server only once every value it is started with has one, so
                  a value read from a Secret that does not exist, holds no such key or holds
                  an empty value keeps the server from starting. Under a key listed here, such
                  a value is left out instead, whole: the server starts without the variable,
                  or its requests go without the header, as Kubernetes starts a container
                  without an optional secretKeyRef. A missing Secret or key under one is then
                  no failure of the references of the object that gives the value, and holds
                  nothing back. Under the Enforce policy the operator also takes the value it
                  pushed for it out of the engine's secret store, and has the engine read the
                  store again whether or not the document can be applied, so the server is not
                  started again with a deleted Secret's value, but by a revision the engine
                  runs that reads the key as required (one from before the key was listed) or
                  whose reading the operator does not know (another document somebody else
                  activated), which keeps the value until the next document runs, and that one
                  is activated once with it and at once again without it; a Secret key that is
                  also read where it is required holds the document while it is missing, and
                  keeps the value it had in a revision the engine runs that requires it too
                  until the document applies. A Seat's or a Unit's value for a key replaces
                  the server's whole, so one that goes missing leaves the key out rather than
                  handing the server's own value back; and a provisioned value an Integration
                  mints for a seat is waited for whatever this says. Every entry must name a
                  key at least one value read from a Secret, or provisioned, is written under,
                  here or in a Seat's or a Unit's spec.mcp for this server: one under which
                  every value is a literal, which is never missing, or no value at all, leaves
                  nothing out and holds the document (ResolvedRefs=False with
                  OptionalKeyUnused), as Crewlet refuses it. A Stdio server's keys are
                  compared as written, an HTTP server's without case, as headers are.
                  Crewlet's `optional_keys`.
                items:
                  maxLength: 128
                  minLength: 1
                  pattern: ^[A-Za-z0-9!#$%&'*+.^_|~-]+$
                  type: string
                maxItems: 32
                type: array
                x-kubernetes-list-type: set
              requestTimeoutSeconds:
                description: |-
                  requestTimeoutSeconds bounds one tool call. Unset takes Crewlet's
                  default of 300. Crewlet's `request_timeout_seconds`.
                format: int32
                minimum: 1
                type: integer
              shared:
                default: true
                description: |-
                  shared launches one instance whose tools every agent calls. false
                  makes the server a template instead: every agent seat that names it
                  in spec.mcp, its own or its unit's, gets an instance of its own,
                  which is how each agent acts as itself on the server. An entry of
                  settings alone starts one too, with none of the seat's credentials.
                  Crewlet's `shared`.
                type: boolean
              startupTimeoutSeconds:
                description: |-
                  startupTimeoutSeconds bounds starting the server and the handshake,
                  and separately its first tool listing, so a start can take up to twice
                  it before Crewlet gives the server up. Unset takes Crewlet's default
                  of 120. Crewlet's `startup_timeout_seconds`.
                format: int32
                minimum: 1
                type: integer
              toolAnnotations:
                description: |-
                  toolAnnotations correct the hints individual tools advertise.
                  Crewlet's `tool_annotations`.
                items:
                  description: |-
                    MCPToolAnnotations corrects the behavioural hints one tool advertises. The
                    engine decides from them what a tool may be used for, such as whether a
                    delegated worker may call it. Each field maps onto Crewlet's
                    tool_annotations entry; unset keeps what the server says.
                  properties:
                    destructive:
                      description: |-
                        destructive marks a tool whose effect cannot be undone. Crewlet's
                        `destructive`.
                      type: boolean
                    idempotent:
                      description: |-
                        idempotent marks a tool that can be repeated safely. Crewlet's
                        `idempotent`.
                      type: boolean
                    openWorld:
                      description: |-
                        openWorld marks a tool that reaches outside the company. Crewlet's
                        `open_world`.
                      type: boolean
                    readOnly:
                      description: readOnly marks a tool that changes nothing. Crewlet's
                        `read_only`.
                      type: boolean
                    tool:
                      description: |-
                        tool is the tool's name as the server publishes it, without any
                        prefix.
                      maxLength: 128
                      minLength: 1
                      type: string
                  required:
                  - tool
                  type: object
                maxItems: 128
                type: array
                x-kubernetes-list-map-keys:
                - tool
                x-kubernetes-list-type: map
              toolPrefix:
                description: |-
                  toolPrefix is put in front of the server's tool names, to keep them
                  apart from another server's. Crewlet's `tool_prefix`.
                maxLength: 32
                minLength: 1
                pattern: ^[A-Za-z][A-Za-z0-9_-]*$
                type: string
              transport:
                default: Stdio
                description: transport is how the engine reaches the server. Crewlet's
                  `transport`.
                enum:
                - Stdio
                - HTTP
                type: string
              url:
                description: url is the endpoint of an HTTP server. Crewlet's `url`.
                maxLength: 2048
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: url must be an absolute http or https URL
                  rule: isURL(self) && url(self).getScheme() in ['http', 'https']
                - message: 'url may not hold a user name or password: a credential
                    is named through a Secret, never written into an address'
                  rule: '!self.matches(''^[^:/?#]+://[^/?#]*@'')'
                - message: 'url may not hold a ${NAME} reference: the operator refuses
                    every one it did not write, since in many fields the engine resolves
                    one from its own secret store and environment, which hold credentials
                    that are not this object''s to name'
                  rule: '!self.matches(''[$][{][A-Za-z_][A-Za-z0-9_]*[}]'')'
            required:
            - companyRef
            type: object
            x-kubernetes-validations:
            - message: command is required with transport Stdio and not allowed with
                HTTP
              rule: 'self.transport == ''Stdio'' ? has(self.command) : !has(self.command)'
            - message: args and env apply to transport Stdio only
              rule: self.transport == 'Stdio' || (!has(self.args) && !has(self.env))
            - message: url is required with transport HTTP and not allowed with Stdio
              rule: 'self.transport == ''HTTP'' ? has(self.url) : !has(self.url)'
            - message: headers apply to transport HTTP only
              rule: self.transport == 'HTTP' || !has(self.headers)
            - fieldPath: .optionalKeys
              message: 'optionalKeys names each header once: HTTP header names are
                case-insensitive, so its names must differ in more than case'
              rule: self.transport != 'HTTP' || !has(self.optionalKeys) || self.optionalKeys.all(a,
                self.optionalKeys.exists_one(b, b.lowerAscii() == a.lowerAscii()))
          status:
            description: status is the server's observed state.
            minProperties: 1
            properties:
              conditions:
                description: |-
                  conditions are Accepted (the Company exists), ResolvedRefs (every
                  Secret key exists) and Applied (the server is in the revision the
                  engine runs).
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 8
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: observedGeneration is the metadata.generation this status
                  describes.
                format: int64
                minimum: 1
                type: integer
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: the name crewlet is reserved for the seat's own tool bridge
          rule: self.metadata.name != 'crewlet'
    served: true
    storage: true
    subresources:
      status: {}
