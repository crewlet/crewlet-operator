                the engine creates no account and mints no credential at Slack, GitHub,
                Jira, Confluence, Google Analytics, Google Ads, Search Console, Google
                Play, AdMob or AdSense, and gives no seat one at App Store Connect,
                Apple Ads or Meta Ads, where it makes every call itself'
              rule: '!has(self.provisioning) || self.provisioning != ''Engine'' ||
                has(self.gitlab) || has(self.mattermost) || has(self.datadog) || has(self.cloudflare)
                || has(self.expo) || has(self.digitalocean) || has(self.scaleway)
                || has(self.aws) || has(self.googleCloud) || has(self.atlassian)'
            - message: 'datadog, cloudflare, expo, digitalocean, scaleway, aws, googleCloud
                and atlassian need provisioning Engine: the engine holds each seat''s
                credential, which it mints with the credential they reference, at
                Expo and DigitalOcean seals from the token a person pastes, and at
                AWS and Google Cloud issues at use'
              rule: '!(has(self.datadog) || has(self.cloudflare) || has(self.expo)
                || has(self.digitalocean) || has(self.scaleway) || has(self.aws) ||
                has(self.googleCloud) || has(self.atlassian)) || (has(self.provisioning)
                && self.provisioning == ''Engine'')'
            - message: 'gitlab.engineProvisioning is required with provisioning Engine
                and not allowed otherwise: it holds the administrator token the engine
                creates the seats'' accounts with'
              rule: '!has(self.gitlab) || has(self.gitlab.engineProvisioning) == (has(self.provisioning)
                && self.provisioning == ''Engine'')'
            - message: 'mattermost.engineProvisioning is required with provisioning
                Engine and not allowed otherwise: it holds the administrator token
                the engine creates the seats'' bots with'
              rule: '!has(self.mattermost) || has(self.mattermost.engineProvisioning)
                == (has(self.provisioning) && self.provisioning == ''Engine'')'
          status:
            description: status is the integration's observed state.
            minProperties: 1
            properties:
              conditions:
                description: |-
                  conditions are Accepted (the Company exists and has no other
                  Integration for the vendor), ResolvedRefs (every Secret key exists),
                  Applied (the integration is in the revision the engine runs) and
                  Healthy (the engine's own check of the vendor passes).
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 8
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: observedGeneration is the metadata.generation this status
                  describes.
                format: int64
                minimum: 1
                type: integer
              webhookURL:
                description: |-
                  webhookURL is the company-wide URL the vendor delivers webhooks to,
                  when the company is exposed and the vendor has one:
                  <publicBaseURL>/webhooks/<vendor> for GitHub, GitLab, Jira,
                  Confluence (a Data Center instance's; Confluence Cloud delivers to
                  <webhookURL>/<event>, a hook the engine registers per event) and
                  Datadog. Slack, Mattermost, Cloudflare, Expo, DigitalOcean, Scaleway, AWS,
                  Google Cloud, Google Analytics, Google Ads, Search Console, Google Play,
                  AdMob, AdSense, App Store Connect, Apple Ads, Meta Ads and Atlassian have
                  none; Slack's and
                  GitHub's per-seat URLs are in each Seat's status.
                maxLength: 2048
                minLength: 1
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
