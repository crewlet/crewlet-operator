# Nimbus's seats: the founder (a person), the CTO and a platform engineer
# (agents). The Secrets each agent references hold its own credentials, so it
# acts as itself on Slack, on GitHub and on the Linear tool server. On GitLab
# it acts as the account the engine creates for it at the role its Seat
# names, and the engine hands that account's token, and the GitHub App's
# token, to the gitlab and github tool servers itself.
apiVersion: crewlet.ai/v1alpha1
kind: Seat
metadata:
  name: jane
spec:
  companyRef:
    name: nimbus
  kind: Human
  displayName: Jane Founder
  goal: Own Nimbus's direction and make the final call on what ships.
  manages:
    - kind: Seat
      name: cto
  contact:
    slackUserID: U0FOUNDER
    githubLogin: jane-founder
    gitlabUsername: jane-founder
  availability: CET business hours
---
apiVersion: crewlet.ai/v1alpha1
kind: Seat
metadata:
  name: cto
spec:
  companyRef:
    name: nimbus
  displayName: Agent CTO
  email: cto@nimbus.example
  unitRef:
    name: engineering
  goal: Own Nimbus's technical architecture and engineering execution.
  manages:
    - kind: Unit
      name: platform
  llm:
    default:
      - name: anthropic
  integrations:
    slack:
      enabled: true
      # Keys: botToken, signingSecret.
      credentialsSecretRef:
        name: cto-slack
---
apiVersion: crewlet.ai/v1alpha1
kind: Seat
metadata:
  name: ana
spec:
  companyRef:
    name: nimbus
  displayName: Ana (Platform Engineer)
  email: ana@nimbus.example
  unitRef:
    name: platform
  goal: Keep CI green and deploys boring.
  responsibilities:
    - Own the deploy pipeline
  behavioralGuidelines:
    - Prefer small pull requests.
  tokenBudget:
    day: 300000
  llm:
    default:
      - name: anthropic
    auxiliary:
      - kind: PlatformLLMProvider
        name: platform-claude
  mcp:
    - name: linear
      env:
        - name: Authorization
          valueFrom:
            secretKeyRef:
              name: ana-linear
              key: authorization
  # Ana's executor is Claude Code's own run on the head of her default
  # chain, LLMProvider anthropic, in the company's E2B sandbox, whose key
  # Crewlet exports into each of her boxes as ANTHROPIC_API_KEY. Her box
  # gets the GitHub tool server beside its tool bridge, and the tokens git
  # uses there.
  sandbox:
    mcpServerRefs:
      - name: github
    env:
      - name: GITHUB_TOKEN
        valueFrom:
          secretKeyRef:
            name: ana-github
            key: token
      # The token the engine mints for Ana's GitLab account, which it gives
      # the gitlab tool server too, for git in the box.
      - name: GITLAB_TOKEN
        valueFrom:
          provisioned:
            vendor: GitLab
            field: Token
  integrations:
    slack:
      enabled: true
      # Keys: botToken, signingSecret.
      credentialsSecretRef:
        name: ana-slack
    gitlab:
      enabled: true
      accessLevel: Developer
    github:
      enabled: true
      permissions:
        contents: Read
        issues: Write
        pullRequests: Write
        checks: Read
        actions: Read
      repos:
        - nimbus-hq/nimbuscore
      app:
        id: 1234567
        slug: nimbus-ana
        installationID: 89012345
        # Keys: privateKey, webhookSecret.
        credentialsSecretRef:
          name: ana-github-app
