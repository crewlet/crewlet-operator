# GitHub's remote tool server. shared: false starts one instance per seat
# with that seat's own Authorization header (see the Seat ana).
apiVersion: crewlet.ai/v1alpha1
kind: MCPServer
metadata:
  name: github
spec:
  companyRef:
    name: nimbus
  transport: HTTP
  shared: false
  url: https://api.githubcopilot.com/mcp/
  toolPrefix: gh_
  requestTimeoutSeconds: 60
