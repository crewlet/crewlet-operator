# GitHub's and Linear's remote tool servers, and GitLab's own CLI as a local
# one. shared: false starts one instance per seat with that seat's own
# credentials: the engine gives the github and gitlab servers each seat's own
# token itself (its GitHub App's installation token, and the token it mints
# for its GitLab account), and a seat gives the linear server its own API key
# (see the Seat ana).
#
# A Stdio server's command runs in the engine's container, and Crewlet's image
# ships no glab (nor any other runtime a stdio server needs): run this one on
# an image derived from the engine's with glab installed
# (docs/guides/tool-servers.md). On the plain engine image the server fails to
# start, and every other part of the company still runs.
apiVersion: crewlet.ai/v1alpha1
kind: MCPServer
metadata:
  name: github
spec:
  companyRef:
    name: nimbus
  transport: HTTP
  shared: false
  url: https://api.githubcopilot.com/mcp/
  toolPrefix: gh_
  requestTimeoutSeconds: 60
---
apiVersion: crewlet.ai/v1alpha1
kind: MCPServer
metadata:
  name: linear
spec:
  companyRef:
    name: nimbus
  transport: HTTP
  shared: false
  url: https://mcp.linear.app/mcp
  requestTimeoutSeconds: 60
---
apiVersion: crewlet.ai/v1alpha1
kind: MCPServer
metadata:
  name: gitlab
spec:
  companyRef:
    name: nimbus
  transport: Stdio
  shared: false
  command: glab
  args:
    - mcp
    - serve
  # glab answers a tool call with what the call's command wrote to stderr
  # too, so its update notice and its "What's new" banner would land in the
  # agent's answer, and each call would report itself to the GitLab
  # instance: the three GLAB_ variables turn them off. They are the server's
  # env because the engine hands a stdio server none of the image's ENV but
  # what Crewlet's allowlist names, and it names no GLAB_ variable
  # (docs/guides/tool-servers.md).
  #
  # The gitlab Integration is Nimbus's own instance, and glab talks to
  # gitlab.com unless GITLAB_HOST names another host: without it, glab would
  # send every call to gitlab.com, and with each the token the engine minted
  # on gitlab.nimbus.example, which gitlab.com refuses. glab speaks https to
  # the host unless told otherwise, so the host alone is enough.
  env:
    - name: GITLAB_HOST
      value: gitlab.nimbus.example
    - name: GLAB_CHECK_UPDATE
      value: "false"
    - name: GLAB_SHOW_WHATS_NEW
      value: "false"
    - name: GLAB_SEND_TELEMETRY
      value: "false"
