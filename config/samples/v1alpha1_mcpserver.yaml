# GitHub's remote tool server, and GitLab's own CLI as a local one.
# shared: false starts one instance per seat with that seat's own credentials
# (see the Seat ana): an Authorization header for GitHub, a GITLAB_TOKEN for
# GitLab, which the engine mints.
#
# A Stdio server's command runs in the engine's container, and Crewlet's image
# ships no glab (nor any other runtime a stdio server needs): run this one on
# an image derived from the engine's with glab installed
# (docs/guides/tool-servers.md). On the plain engine image the server fails to
# start, and every other part of the company still runs.
apiVersion: crewlet.ai/v1alpha1
kind: MCPServer
metadata:
  name: github
spec:
  companyRef:
    name: nimbus
  transport: HTTP
  shared: false
  url: https://api.githubcopilot.com/mcp/
  toolPrefix: gh_
  requestTimeoutSeconds: 60
---
apiVersion: crewlet.ai/v1alpha1
kind: MCPServer
metadata:
  name: gitlab
spec:
  companyRef:
    name: nimbus
  transport: Stdio
  shared: false
  command: glab
  args:
    - mcp
    - serve
  # glab answers a tool call with what the call's command wrote to stderr
  # too, so its update notice and its "What's new" banner would land in the
  # agent's answer, and each call would report itself to the GitLab
  # instance: these turn the three off. They are the server's env because
  # the engine hands a stdio server none of the image's ENV but what
  # Crewlet's allowlist names, and it names no GLAB_ variable
  # (docs/guides/tool-servers.md).
  env:
    - name: GLAB_CHECK_UPDATE
      value: "false"
    - name: GLAB_SHOW_WHATS_NEW
      value: "false"
    - name: GLAB_SEND_TELEMETRY
      value: "false"
