# The model Nimbus's seats run on: Claude Code, signed in with the Anthropic
# API key the Secret nimbus-anthropic holds under apiKey. The class's engine
# image carries Claude Code (docs/guides/harnesses.md).
apiVersion: crewlet.ai/v1alpha1
kind: LLMProvider
metadata:
  name: anthropic
spec:
  companyRef:
    name: nimbus
  harness: ClaudeCode
  model: claude-sonnet-5
  timeoutSeconds: 600
  auth:
    mode: APIKey
    apiKeySecretRef:
      name: nimbus-anthropic
      key: apiKey
