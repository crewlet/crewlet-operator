# The model Nimbus's seats run on. The Secret nimbus-anthropic holds the API
# key under apiKey.
apiVersion: crewlet.ai/v1alpha1
kind: LLMProvider
metadata:
  name: anthropic
spec:
  companyRef:
    name: nimbus
  type: Anthropic
  model: claude-sonnet-5
  apiKeySecretRefs:
    - name: nimbus-anthropic
      key: apiKey
  reasoningEffort: High
  timeoutSeconds: 600
