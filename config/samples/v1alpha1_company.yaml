# Nimbus, an example company. Its units, seats, model provider, tool server
# and integrations are the other samples in this directory; each names the
# Company in spec.companyRef. The Secrets they reference are not included:
# create them in the same namespace before the company can be applied, all
# but nimbus-npm, which the company goes without (below).
apiVersion: crewlet.ai/v1alpha1
kind: Company
metadata:
  name: nimbus
spec:
  engineClassName: standard
  companyName: Nimbus
  mission: Turn any hardware into cloud-native infrastructure.
  vision: >-
    A control plane that turns bare metal, cloud and edge hardware into
    Kubernetes clusters ready to serve AI workloads, and an open framework
    that runs on them.
  policies:
    - Communicate decisions in writing.
    - Never push directly to the default branch.
  timeZone: Europe/Berlin
  tracker:
    backend: Worklet
  knowledge:
    backend: Doclet
  tokenBudget:
    day: 3000000
    month: 40000000
  llm:
    order:
      - name: anthropic
    # The class's platform-claude model, which the seat ana uses for its
    # cheap auxiliary work, is offered only to companies that opt in.
    usePlatformProviders: true
  embeddings:
    type: OpenAI
    model: text-embedding-3-large
    apiKeySecretRef:
      name: nimbus-openai
      key: apiKey
  sandbox:
    e2b:
      apiKeySecretRef:
        name: nimbus-e2b
        key: apiKey
    defaultCodingAgent: ClaudeCode
    defaultPauseTTLSeconds: 1800
    # Every coding run's box logs npm in to the company's own registry,
    # where the Secret holds a login. optionalKeys lets a run go without
    # it: without the Secret, or with the key empty, the file is not
    # written and the run starts all the same. Unlisted, a missing Secret
    # would hold the company's document, and an empty key have every run
    # refused.
    setup:
      - name: npm-registry
        files:
          - path: .npmrc
            valueFrom:
              secretKeyRef:
                name: nimbus-npm
                key: npmrc
        optionalKeys:
          - .npmrc
  # Engine tuning without a typed field, written as Crewlet spells it and
  # validated by the engine before every apply.
  engineConfig:
    - name: turn_engine
      value:
        extension_enabled: true
    - name: learning
      value:
        enabled: true
  config:
    managementPolicy: Enforce
  deletionPolicy: Retain
