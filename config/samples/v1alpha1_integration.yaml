# Slack and GitHub for Nimbus. Slack needs no company-wide credential: each
# seat brings its own app. GitHub's company-wide webhook route is verified
# with the secret in nimbus-github under webhookSecret, and the engine
# registers that webhook on the organization with the token under orgToken.
apiVersion: crewlet.ai/v1alpha1
kind: Integration
metadata:
  name: slack
spec:
  companyRef:
    name: nimbus
  slack:
    typingStatus: Addressed
---
apiVersion: crewlet.ai/v1alpha1
kind: Integration
metadata:
  name: github
spec:
  companyRef:
    name: nimbus
  github:
    webhookSecretRef:
      name: nimbus-github
      key: webhookSecret
    tokenSecretRef:
      name: nimbus-github
      key: orgToken
    provisioning:
      org: nimbus-hq
      orgWebhook: Auto
