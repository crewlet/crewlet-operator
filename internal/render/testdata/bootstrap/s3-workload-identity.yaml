api:
  auth:
    allow_anonymous_read: false
    company_writers:
    - operator
    tokens:
    - id: operator
      token: test-operator-token
    - id: access
      token: test-access-token
  host: 0.0.0.0
  port: 8080
  public:
    port: 8081
coordination:
  type: embedded-kv
node:
  id: ${CREWLET_NODE_ID}
  labels:
    crewlet.ai/pool: data
  roles:
  - data
  - ingress
  - seats
  - workers
retention:
  backup_owner: sre@example.com
secrets:
  active_key_id: k1
  keys:
  - id: k1
    material: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
store:
  objects:
    backend: s3
    s3:
      bucket: crewlet-tenants
      prefix: tenant-nimbus/nimbus/
      region: eu-central-1
  path: /var/lib/crewlet/store/crewlet.db
stream:
  replicas: 1
  store_dir: /var/lib/crewlet/stream
  store_max_bytes: 8053063680
  type: embedded
