api:
  auth:
    allow_anonymous_read: false
    tokens:
    - id: operator
      token: ${CREWLET_TOKEN_OPERATOR}
    - id: access
      token: ${CREWLET_TOKEN_ACCESS}
  host: 0.0.0.0
  port: 8080
coordination:
  type: embedded-kv
node:
  id: ${CREWLET_NODE_ID}
  labels:
    crewlet.ai/pool: data
  roles:
  - data
  - ingress
  - seats
  - workers
retention:
  backup_owner: storage-team
secrets:
  active_key_id: 2026-10.b
  keys:
  - id: "2026-01-01"
    material: ${CREWLET_SECRET_KEY_2026_01_01}
  - id: 2026-10.b
    material: ${CREWLET_SECRET_KEY_2026_10_B}
store:
  objects:
    backend: s3
    s3:
      access_key_id: ${CREWLET_S3_ACCESS_KEY_ID}
      bucket: crewlet-tenants
      endpoint: https://minio.storage.example
      path_style: true
      prefix: tenants/3f2a9c1e-6b1d-4e7a-9a52-0c8d5f1e2b47/
      region: us-east-1
      secret_access_key: ${CREWLET_S3_SECRET_ACCESS_KEY}
  path: /var/lib/crewlet/store/crewlet.db
stream:
  replicas: 1
  store_dir: /var/lib/crewlet/stream
  store_max_bytes: 8053063680
  type: embedded
