api:
  auth:
    allow_anonymous_read: false
    company_writers:
    - operator
    tokens:
    - id: operator
      token: test-operator-token
    - id: access
      token: test-access-token
  host: 0.0.0.0
  port: 8080
coordination:
  type: embedded-kv
node:
  id: ${CREWLET_NODE_ID}
  labels:
    crewlet.ai/pool: data
  roles:
  - data
  - ingress
  - seats
  - workers
retention:
  backup_owner: storage-team
secrets:
  active_key_id: 2026-10.b
  keys:
  - id: "2026-01-01"
    material: ZmVkY2JhOTg3NjU0MzIxMGZlZGNiYTk4NzY1NDMyMTA=
  - id: 2026-10.b
    material: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
store:
  objects:
    backend: s3
    s3:
      access_key_id: test-access-key-id
      bucket: crewlet-tenants
      endpoint: https://minio.storage.example
      path_style: true
      prefix: tenants/3f2a9c1e-6b1d-4e7a-9a52-0c8d5f1e2b47/
      region: us-east-1
      secret_access_key: test-secret-access-key
  path: /var/lib/crewlet/store/crewlet.db
stream:
  replicas: 1
  store_dir: /var/lib/crewlet/stream
  store_max_bytes: 8053063680
  type: embedded
