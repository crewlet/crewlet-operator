- name: CREWLET_NODE_ID
  valueFrom:
    fieldRef:
      apiVersion: v1
      fieldPath: metadata.name
- name: CREWLET_SECRET_KEY_K1
  valueFrom:
    secretKeyRef:
      key: k1
      name: nimbus-keyring
- name: CREWLET_TOKEN_ACCESS
  valueFrom:
    secretKeyRef:
      key: access
      name: nimbus-api-tokens
- name: CREWLET_TOKEN_OPERATOR
  valueFrom:
    secretKeyRef:
      key: operator
      name: nimbus-api-tokens
