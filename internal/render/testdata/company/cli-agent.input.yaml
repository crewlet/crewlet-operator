# Coding CLIs as model providers: Claude Code on a subscription's headless
# token running a seat's executor in mode Box, as a detached run in the
# company's E2B sandbox, beside Codex on an exported login in mode Host, in
# the engine's pod, the reviewer's, and Hermes, the delegated workers',
# signed in with no login of its own: its model provider's key in env,
# a ${NAME} Crewlet passes to the Hermes process untouched. Pi and OpenCode
# sign in the same way, and Cursor on a Cursor account's metered key in
# CURSOR_API_KEY. Box mode calls the seat's tools back through the
# company's public address, so the case is exposed.
apiVersion: crewlet.ai/v1alpha1
kind: Company
metadata:
  name: forge
spec:
  engineClassName: basic
  companyName: Forge
  sandbox:
    e2b:
      apiKeySecretRef:
        name: e2b
        key: apiKey
---
apiVersion: crewlet.ai/v1alpha1
kind: LLMProvider
metadata:
  name: claude-box
spec:
  companyRef:
    name: forge
  agent: ClaudeCode
  model: sonnet
  mode: Box
  runIn: E2B
  loginName: claude
  timeoutSeconds: 900
  maxConcurrent: 2
  auth:
    mode: Subscription
    tokenSecretRef:
      name: claude-subscription
      key: oauthToken
---
apiVersion: crewlet.ai/v1alpha1
kind: LLMProvider
metadata:
  name: codex
spec:
  companyRef:
    name: forge
  agent: Codex
  model: gpt-5-codex
  auth:
    credentialBundleSecretRef:
      name: codex-login
      key: bundle
---
apiVersion: crewlet.ai/v1alpha1
kind: LLMProvider
metadata:
  name: hermes
spec:
  companyRef:
    name: forge
  agent: Hermes
  model: anthropic/claude-sonnet-5
  auth:
    mode: Subscription
  env:
    - name: OPENROUTER_API_KEY
      valueFrom:
        secretKeyRef:
          name: openrouter
          key: apiKey
---
apiVersion: crewlet.ai/v1alpha1
kind: LLMProvider
metadata:
  name: pi
spec:
  companyRef:
    name: forge
  agent: Pi
  model: openrouter/anthropic/claude-sonnet-5
  auth:
    mode: Subscription
  env:
    - name: OPENROUTER_API_KEY
      valueFrom:
        secretKeyRef:
          name: openrouter
          key: apiKey
---
apiVersion: crewlet.ai/v1alpha1
kind: LLMProvider
metadata:
  name: cursor
spec:
  companyRef:
    name: forge
  agent: CursorAgent
  model: auto
  auth:
    mode: APIKey
    apiKeySecretRef:
      name: cursor
      key: apiKey
---
apiVersion: crewlet.ai/v1alpha1
kind: LLMProvider
metadata:
  name: opencode
spec:
  companyRef:
    name: forge
  agent: OpenCode
  model: anthropic/claude-sonnet-5
  auth:
    mode: Subscription
  env:
    - name: ANTHROPIC_API_KEY
      valueFrom:
        secretKeyRef:
          name: anthropic
          key: apiKey
---
apiVersion: crewlet.ai/v1alpha1
kind: Seat
metadata:
  name: builder
spec:
  companyRef:
    name: forge
  goal: Ship the changes the team files.
  llm:
    default:
      - name: claude-box
    review:
      - name: codex
    subagent:
      - name: hermes
