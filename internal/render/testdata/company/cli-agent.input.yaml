# Coding CLIs as model providers. A seat's executor is its CLI's own run in a
# box: Claude Code on a subscription's headless token runs it in the
# company's E2B sandbox (its runIn), and OpenCode, behind it in the seat's
# chain, runs it while Claude Code sits out its plan, in the company's
# default cell, Direct, on the engine pod that holds the seat. Codex on an
# exported login is the reviewer, in the engine's pod, and Hermes, signed in
# with no login of its own (its model provider's key in env, a ${NAME}
# Crewlet passes to the Hermes process untouched), the delegated workers'.
# Pi signs in the same way, and Cursor on a Cursor account's metered key in
# CURSOR_API_KEY. An E2B run calls the seat's tools back through the
# company's public address, so the case is exposed.
apiVersion: crewlet.ai/v1alpha1
kind: Company
metadata:
  name: forge
spec:
  engineClassName: basic
  companyName: Forge
  sandbox:
    defaultRunIn: Direct
    e2b:
      apiKeySecretRef:
        name: e2b
        key: apiKey
---
apiVersion: crewlet.ai/v1alpha1
kind: LLMProvider
metadata:
  name: claude-e2b
spec:
  companyRef:
    name: forge
  agent: ClaudeCode
  model: sonnet
  runIn: E2B
  loginName: claude
  timeoutSeconds: 900
  maxConcurrent: 2
  auth:
    mode: Subscription
    tokenSecretRef:
      name: claude-subscription
      key: oauthToken
---
apiVersion: crewlet.ai/v1alpha1
kind: LLMProvider
metadata:
  name: codex
spec:
  companyRef:
    name: forge
  agent: Codex
  model: gpt-5-codex
  auth:
    credentialBundleSecretRef:
      name: codex-login
      key: bundle
---
apiVersion: crewlet.ai/v1alpha1
kind: LLMProvider
metadata:
  name: hermes
spec:
  companyRef:
    name: forge
  agent: Hermes
  model: anthropic/claude-sonnet-5
  auth:
    mode: Subscription
  env:
    - name: OPENROUTER_API_KEY
      valueFrom:
        secretKeyRef:
          name: openrouter
          key: apiKey
---
apiVersion: crewlet.ai/v1alpha1
kind: LLMProvider
metadata:
  name: pi
spec:
  companyRef:
    name: forge
  agent: Pi
  model: openrouter/anthropic/claude-sonnet-5
  auth:
    mode: Subscription
  env:
    - name: OPENROUTER_API_KEY
      valueFrom:
        secretKeyRef:
          name: openrouter
          key: apiKey
---
apiVersion: crewlet.ai/v1alpha1
kind: LLMProvider
metadata:
  name: cursor
spec:
  companyRef:
    name: forge
  agent: CursorAgent
  model: auto
  auth:
    mode: APIKey
    apiKeySecretRef:
      name: cursor
      key: apiKey
---
apiVersion: crewlet.ai/v1alpha1
kind: LLMProvider
metadata:
  name: opencode
spec:
  companyRef:
    name: forge
  agent: OpenCode
  model: anthropic/claude-sonnet-5
  auth:
    mode: Subscription
  env:
    - name: ANTHROPIC_API_KEY
      valueFrom:
        secretKeyRef:
          name: anthropic
          key: apiKey
---
apiVersion: crewlet.ai/v1alpha1
kind: Seat
metadata:
  name: builder
spec:
  companyRef:
    name: forge
  goal: Ship the changes the team files.
  llm:
    default:
      - name: claude-e2b
      - name: opencode
    review:
      - name: codex
    subagent:
      - name: hermes
