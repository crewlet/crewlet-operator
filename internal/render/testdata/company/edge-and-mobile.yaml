integrations:
  aws:
    enabled: true
    provisioning:
      certificate_authority: ${K8S_AWS_CERTIFICATE_AUTHORITY_K25II75446JK}
      connection: arn:aws:rolesanywhere:eu-west-1:123456789012:trust-anchor/0f1e2d3c-4b5a-6978-8796-a5b4c3d2e1f0,arn:aws:rolesanywhere:eu-west-1:123456789012:profile/1a2b3c4d-5e6f-7081-92a3-b4c5d6e7f809,arn:aws:iam::123456789012:role/crewlet/orbit/crewlet-orbit-provisioner,arn:aws:rolesanywhere:eu-west-1:123456789012:profile/2b3c4d5e-6f70-8192-a3b4-c5d6e7f8091a,arn:aws:iam::123456789012:role/crewlet/orbit/crewlet-orbit-broker
      home_region: eu-west-1
      iam_read: true
      regions:
      - eu-west-1
      - us-east-1
      slug: orbit
  cloudflare:
    enabled: true
    provisioning:
      account_id: 023e105f4ecef8ad9ca31a8372d0c353
      api_token: ${K8S_CLOUDFLARE_API_TOKEN_DV74SCZJR3GC}
      zones:
      - orbit.example
      - status.orbit.example
  digitalocean:
    enabled: true
    provisioning:
      team: Orbit Production
  expo:
    enabled: true
    provisioning:
      account_name: orbit
mcp_servers:
- name: aws
  shared: false
  transport: http
  url: https://aws-mcp.eu-west-1.api.aws/mcp
- name: cloudflare
  shared: false
  transport: http
  url: https://mcp.cloudflare.com/mcp
- name: digitalocean
  shared: false
  transport: http
  url: https://mcp.digitalocean.com/mcp
name: Orbit
providers:
  llm:
    claude:
      auth:
        api_key: ${K8S_ANTHROPIC_API_KEY_NP33B5LRRKLS}
        mode: api-key
      harness: claude-code
      model: claude-sonnet-5
      state_dir: /var/lib/crewlet/llm-harness/claude
  llm_order:
  - claude
  sandbox:
    default_run_in: direct
    local:
      state_dir: /var/lib/crewlet-sandboxes
roles:
- goal: Build and release the mobile app.
  handle: mobile
  integrations:
    cloudflare:
      enabled: false
    expo:
      enabled: true
      level: release_manager
  kind: agent
  name: mobile
  placement:
    labels:
      crewlet.ai/pool: data
  sandbox:
    env:
      EXPO_TOKEN: ${EXPO_TOKEN_MOBILE}
- goal: Review DNS and cache settings before they change.
  handle: reviewer
  integrations:
    aws:
      enabled: true
    cloudflare:
      enabled: true
    digitalocean:
      enabled: true
  kind: agent
  name: reviewer
  placement:
    labels:
      crewlet.ai/pool: data
- goal: Keep the edge fast and the cache fresh.
  handle: sre
  integrations:
    aws:
      enabled: true
      level: operate
    cloudflare:
      enabled: true
      level: configure
    digitalocean:
      enabled: true
      level: administer
  kind: agent
  name: sre
  placement:
    labels:
      crewlet.ai/pool: data
  sandbox:
    env:
      DIGITALOCEAN_ACCESS_TOKEN: ${DIGITALOCEAN_TOKEN_SRE}
seat_access_migrated:
- atlassian
- aws
- cloudflare
- datadog
- digitalocean
- expo
- github
- gitlab
- google_cloud
- mattermost
- scaleway
- slack
