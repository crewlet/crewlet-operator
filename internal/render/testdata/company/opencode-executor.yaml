name: Harbor
providers:
  llm:
    anthropic:
      auth:
        mode: subscription
      env:
        ANTHROPIC_API_KEY: ${K8S_ANTHROPIC_API_KEY_NP33B5LRRKLS}
      harness: opencode
      model: anthropic/claude-sonnet-5
      state_dir: /var/lib/crewlet/llm-harness/anthropic
    opencode:
      auth:
        mode: subscription
      env:
        OPENROUTER_API_KEY: ${K8S_OPENROUTER_API_KEY_A54OX7VM4MZL}
      harness: opencode
      model: openrouter/anthropic/claude-sonnet-5
      state_dir: /var/lib/crewlet/llm-harness/opencode
  llm_order:
  - anthropic
  - opencode
  sandbox:
    default_run_in: direct
    local:
      state_dir: /var/lib/crewlet-sandboxes
roles:
- goal: Fix what the port breaks.
  handle: fixer
  kind: agent
  llm:
    default:
    - anthropic
  name: fixer
  placement:
    labels:
      crewlet.ai/pool: data
- goal: Port the services to the new runtime.
  handle: porter
  kind: agent
  llm:
    default:
    - opencode
  name: porter
  placement:
    labels:
      crewlet.ai/pool: data
  sandbox:
    max_concurrent_runs: 2
    max_turns: 64
seat_access_migrated:
- admob
- adsense
- app_store_connect
- apple_ads
- atlassian
- aws
- cloudflare
- datadog
- digitalocean
- expo
- github
- gitlab
- google_ads
- google_analytics
- google_cloud
- google_play
- mattermost
- meta_ads
- scaleway
- search_console
- slack
- ssh
