name: Harbor
providers:
  llm:
    anthropic:
      agent: opencode
      auth:
        mode: subscription
      env:
        ANTHROPIC_API_KEY: ${K8S_ANTHROPIC_API_KEY_NP33B5LRRKLS}
      model: anthropic/claude-sonnet-5
      run_in: direct
      state_dir: /var/lib/crewlet/llm-cli/anthropic
    opencode:
      agent: opencode
      auth:
        mode: subscription
      env:
        OPENROUTER_API_KEY: ${K8S_OPENROUTER_API_KEY_A54OX7VM4MZL}
      model: openrouter/anthropic/claude-sonnet-5
      state_dir: /var/lib/crewlet/llm-cli/opencode
  llm_order:
  - anthropic
  - opencode
  sandbox:
    default_run_in: e2b
    e2b:
      api_key: ${K8S_E2B_API_KEY_GSEHAAV5THN5}
    local:
      state_dir: /var/lib/crewlet-sandboxes
roles:
- goal: Fix what the port breaks.
  handle: fixer
  kind: agent
  llm:
    default:
    - anthropic
  name: fixer
  placement:
    labels:
      crewlet.ai/pool: data
- goal: Port the services to the new runtime.
  handle: porter
  kind: agent
  llm:
    default:
    - opencode
  name: porter
  placement:
    labels:
      crewlet.ai/pool: data
  sandbox:
    max_turns: 64
seat_access_migrated:
- atlassian
- datadog
- github
- gitlab
- mattermost
- slack
