integrations:
  app_store_connect:
    approvers:
    - founder
    connections:
      agency:
        issuer_id: 6A1B2C3D-4E5F-4A6B-8C7D-9E0F1A2B3C4D
      main:
        issuer_id: 57246542-96fe-1a63-e053-0824d011072a
    enabled: true
name: Orbit
providers:
  llm:
    claude:
      auth:
        api_key: ${K8S_ANTHROPIC_API_KEY_NP33B5LRRKLS}
        mode: api-key
      harness: claude-code
      model: claude-sonnet-5
      state_dir: /var/lib/crewlet/llm-harness/claude
  llm_order:
  - claude
  sandbox:
    default_run_in: direct
    local:
      state_dir: /var/lib/crewlet-sandboxes
roles:
- goal: Read the weekly sales.
  handle: analyst
  integrations:
    app_store_connect:
      enabled: false
  kind: agent
  name: analyst
  placement:
    labels:
      crewlet.ai/pool: data
- handle: founder
  kind: human
  name: Founder
- goal: Grow both apps' listings and ratings.
  handle: growth-lead
  integrations:
    app_store_connect:
      apps:
      - "1234567890"
      - "1234567891"
      enabled: true
      level: operate
      team_resources: true
  kind: agent
  name: growth-lead
  placement:
    labels:
      crewlet.ai/pool: data
- goal: Read what customers say of the first app.
  handle: support
  integrations:
    app_store_connect:
      apps:
      - "1234567890"
      enabled: true
  kind: agent
  name: support
  placement:
    labels:
      crewlet.ai/pool: data
