name: Forge
providers:
  llm:
    claude-e2b:
      agent: claude-code
      auth:
        mode: subscription
        token: ${K8S_CLAUDE_SUBSCRIPTION_OAUTH_TOKEN_5F3I3N4HVTAV}
      max_concurrent: 2
      model: sonnet
      run_in: e2b
      state_dir: /var/lib/crewlet/llm-cli/claude
      timeout_seconds: 900
    codex:
      agent: codex
      auth:
        credential_bundle: ${K8S_CODEX_LOGIN_BUNDLE_C7GT3IPZJRP3}
      model: gpt-5-codex
      state_dir: /var/lib/crewlet/llm-cli/codex
    cursor:
      agent: cursor-agent
      auth:
        api_key: ${K8S_CURSOR_API_KEY_UAPO7C3S3GGL}
        mode: api-key
      model: auto
      state_dir: /var/lib/crewlet/llm-cli/cursor
    hermes:
      agent: hermes
      auth:
        mode: subscription
      env:
        OPENROUTER_API_KEY: ${K8S_OPENROUTER_API_KEY_A54OX7VM4MZL}
      model: anthropic/claude-sonnet-5
      state_dir: /var/lib/crewlet/llm-cli/hermes
    opencode:
      agent: opencode
      auth:
        mode: subscription
      env:
        ANTHROPIC_API_KEY: ${K8S_ANTHROPIC_API_KEY_NP33B5LRRKLS}
      model: anthropic/claude-sonnet-5
      state_dir: /var/lib/crewlet/llm-cli/opencode
    pi:
      agent: pi
      auth:
        mode: subscription
      env:
        OPENROUTER_API_KEY: ${K8S_OPENROUTER_API_KEY_A54OX7VM4MZL}
      model: openrouter/anthropic/claude-sonnet-5
      state_dir: /var/lib/crewlet/llm-cli/pi
  llm_order:
  - claude-e2b
  - codex
  - cursor
  - hermes
  - opencode
  - pi
  sandbox:
    default_run_in: direct
    e2b:
      api_key: ${K8S_E2B_API_KEY_GSEHAAV5THN5}
    local:
      state_dir: /var/lib/crewlet-sandboxes
roles:
- goal: Ship the changes the team files.
  handle: builder
  kind: agent
  llm:
    default:
    - claude-e2b
    - opencode
    review:
    - codex
    subagent:
    - hermes
  name: builder
  placement:
    labels:
      crewlet.ai/pool: data
