name: Forge
providers:
  llm:
    claude-agent:
      cli:
        agent: claude-code
        auth:
          mode: subscription
          token: ${K8S_CLAUDE_SUBSCRIPTION_OAUTH_TOKEN_5F3I3N4HVTAV}
        max_concurrent: 2
        mode: agent
        run_in: e2b
        state_dir: /var/lib/crewlet/llm-cli/claude
        timeout_seconds: 900
      model: sonnet
      type: cli-agent
    codex:
      cli:
        agent: codex
        auth:
          credential_bundle: ${K8S_CODEX_LOGIN_BUNDLE_C7GT3IPZJRP3}
        state_dir: /var/lib/crewlet/llm-cli/codex
      model: gpt-5-codex
      type: cli-agent
    cursor:
      api_keys:
      - ${K8S_CURSOR_API_KEY_UAPO7C3S3GGL}
      cli:
        agent: cursor-agent
        auth:
          mode: api-key
        state_dir: /var/lib/crewlet/llm-cli/cursor
      model: auto
      type: cli-agent
    hermes:
      cli:
        agent: hermes
        auth:
          mode: subscription
        env:
          OPENROUTER_API_KEY: ${K8S_OPENROUTER_API_KEY_A54OX7VM4MZL}
        state_dir: /var/lib/crewlet/llm-cli/hermes
      model: anthropic/claude-sonnet-5
      type: cli-agent
    opencode:
      cli:
        agent: opencode
        auth:
          mode: subscription
        env:
          ANTHROPIC_API_KEY: ${K8S_ANTHROPIC_API_KEY_NP33B5LRRKLS}
        state_dir: /var/lib/crewlet/llm-cli/opencode
      model: anthropic/claude-sonnet-5
      type: cli-agent
    pi:
      cli:
        agent: pi
        auth:
          mode: subscription
        env:
          OPENROUTER_API_KEY: ${K8S_OPENROUTER_API_KEY_A54OX7VM4MZL}
        state_dir: /var/lib/crewlet/llm-cli/pi
      model: openrouter/anthropic/claude-sonnet-5
      type: cli-agent
  llm_order:
  - claude-agent
  - codex
  - cursor
  - hermes
  - opencode
  - pi
  sandbox:
    default_run_in: e2b
    e2b:
      api_key: ${K8S_E2B_API_KEY_GSEHAAV5THN5}
roles:
- goal: Ship the changes the team files.
  handle: builder
  kind: agent
  llm:
    default:
    - claude-agent
    review:
    - codex
    subagent:
    - hermes
  name: builder
  placement:
    labels:
      crewlet.ai/pool: data
