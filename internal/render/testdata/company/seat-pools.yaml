      agent: claude-code
      auth:
        api_key: ${K8S_ANTHROPIC_API_KEY_NP33B5LRRKLS}
        mode: api-key
      model: claude-sonnet-5
      state_dir: /var/lib/crewlet/llm-cli/claude
