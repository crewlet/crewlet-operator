  handle: bo
  kind: agent
  name: bo
  placement:
    labels:
      crewlet.ai/pool: general
- goal: Write the weekly report.
  handle: cy
  kind: agent
  name: cy
  placement:
    labels:
      crewlet.ai/pool: data
- goal: Reindex the archive.
  handle: dee
  kind: agent
  name: dee
  placement:
    labels:
      crewlet.ai/pool: batch
- contact:
    slack_user_id: U0JANE
  handle: jane
  kind: human
  name: jane
