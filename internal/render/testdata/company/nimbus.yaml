integrations:
  github:
    enabled: true
    provisioning:
      org: nimbus-hq
      org_webhook: auto
    token: ${K8S_NIMBUS_GITHUB_ORG_TOKEN_O4ARELY4DZXZ}
    webhook_secret: ${K8S_NIMBUS_GITHUB_WEBHOOK_SECRET_H2I5AHRDL2VE}
  gitlab:
    enabled: true
    provisioning:
      access_level: developer
      admin_token: ${K8S_NIMBUS_GITLAB_ADMIN_TOKEN_XJYIJLJITPA4}
      group: nimbus-hq
      group_webhook: auto
    signing_secret: ${K8S_NIMBUS_GITLAB_SIGNING_SECRET_XPR7PPZHAEFF}
    url: https://gitlab.nimbus.example
  slack:
    typing_status: addressed
knowledge:
  backend: doclet
learning:
  enabled: true
mcp_servers:
- name: github
  request_timeout_seconds: 60
  shared: false
  tool_prefix: gh_
  transport: http
  url: https://api.githubcopilot.com/mcp/
- args:
  - mcp
  - serve
  command: glab
  env:
    GITLAB_HOST: gitlab.nimbus.example
    GLAB_CHECK_UPDATE: "false"
    GLAB_SEND_TELEMETRY: "false"
    GLAB_SHOW_WHATS_NEW: "false"
  name: gitlab
  shared: false
  transport: stdio
mission: Turn any hardware into cloud-native infrastructure.
name: Nimbus
policies:
- Communicate decisions in writing.
- Never push directly to the default branch.
providers:
  embeddings:
    api_key: ${K8S_NIMBUS_OPENAI_API_KEY_YACPCD23WGRQ}
    model: text-embedding-3-large
    type: openai
  llm:
    anthropic:
      agent: claude-code
      auth:
        api_key: ${K8S_NIMBUS_ANTHROPIC_API_KEY_A4IZBDSXZ6HX}
        mode: api-key
      model: claude-sonnet-5
      state_dir: /var/lib/crewlet/llm-cli/anthropic
      timeout_seconds: 600
    platform-claude:
      agent: claude-code
      auth:
        api_key: ${K8S_PLATFORM_ANTHROPIC_API_KEY_KBCSEOJXFCWQ}
        mode: api-key
      model: claude-sonnet-5
      state_dir: /var/lib/crewlet/llm-cli-platform/platform-claude
  llm_order:
  - anthropic
  - platform-claude
  sandbox:
    default_coding_agent: claude-code
    default_pause_ttl_seconds: 1800
    default_run_in: e2b
    e2b:
      api_key: ${K8S_NIMBUS_E2B_API_KEY_HH5CATIPGVOD}
    setup:
    - files:
        .npmrc: ${K8S_NIMBUS_NPM_NPMRC_XCZVL2EE43WN}
      name: npm-registry
      optional_keys:
      - .npmrc
roles:
- availability: CET business hours
  contact:
    github_login: jane-founder
    gitlab_username: jane-founder
    slack_user_id: U0FOUNDER
  goal: Own Nimbus's direction and make the final call on what ships.
  handle: jane
  kind: human
  manages:
  - cto
  name: Jane Founder
timezone: Europe/Berlin
token_budget:
  day: 3000000
  month: 40000000
tracker:
  backend: worklet
turn_engine:
  extension_enabled: true
units:
- children:
  - channel: '#platform'
    goals:
    - p99 API latency under 200ms
    id: platform
    lead: ana
    name: Platform Engineering
    project: PLAT
    purpose: Keep the platform boring.
    roles:
    - behavioral_guidelines:
      - Prefer small pull requests.
      email: ana@nimbus.example
      goal: Keep CI green and deploys boring.
      handle: ana
      integrations:
        github:
          app_id: 1234567
          app_slug: nimbus-ana
          installation_id: 89012345
          private_key: ${K8S_ANA_GITHUB_APP_PRIVATE_KEY_JSUSQ7FYDCSN}
          repos:
          - nimbus-hq/nimbuscore
          tier: review
          webhook_secret: ${K8S_ANA_GITHUB_APP_WEBHOOK_SECRET_DE4RFGLQA4OW}
        slack:
          bot_token: ${K8S_ANA_SLACK_BOT_TOKEN_HGFIPUYDX4KF}
          signing_secret: ${K8S_ANA_SLACK_SIGNING_SECRET_YMDA6WMUYTHW}
      kind: agent
      llm:
        auxiliary:
        - platform-claude
        default:
        - anthropic
      mcp_env:
        github:
          Authorization: ${K8S_ANA_GITHUB_AUTHORIZATION_TWHVOQBEQ7JM}
        gitlab:
          GITLAB_TOKEN: ${PROVISIONED_ANA_GITLAB_TOKEN_ZXUWOCASQLKO}
      name: Ana (Platform Engineer)
      placement:
        labels:
          crewlet.ai/pool: data
      responsibilities:
      - Own the deploy pipeline
      sandbox:
        enabled: true
        env:
          GITHUB_TOKEN: ${K8S_ANA_GITHUB_TOKEN_OI3SDKAPI3E5}
          GITLAB_TOKEN: ${PROVISIONED_ANA_GITLAB_TOKEN_ZXUWOCASQLKO}
        mcp:
          servers:
          - github
      schedules:
      - cron: 30 7 * * *
        name: ci-health
        task: Check last night's CI runs and file a work item for every new failure.
      token_budget:
        day: 300000
    schedules:
    - catchup: false
      cron: 0 9 * * 1-5
      name: platform-standup
      target: lead
      task: Post a standup summary of yesterday's merged work to the team channel.
      timeout_seconds: 900
      timezone: Europe/Berlin
    space: PLAT
    type: team
  id: engineering
  lead: cto
  name: Engineering
  purpose: Build and run the Nimbus platform.
  roles:
  - email: cto@nimbus.example
    goal: Own Nimbus's technical architecture and engineering execution.
    handle: cto
    integrations:
      slack:
        bot_token: ${K8S_CTO_SLACK_BOT_TOKEN_EOG5NAYJ7TBU}
        signing_secret: ${K8S_CTO_SLACK_SIGNING_SECRET_N3SILNAKL2CL}
    kind: agent
    llm:
      default:
      - anthropic
    manages:
    - platform
    name: Agent CTO
    placement:
      labels:
        crewlet.ai/pool: data
  type: department
vision: A control plane that turns bare metal, cloud and edge hardware into Kubernetes clusters ready to serve AI workloads, and an open framework that runs on them.
