  github:
    enabled: true
    token: ${K8S_GITHUB_ORG_TOKEN_JDLKCDUOTXME}
    webhook_secret: ${K8S_GITHUB_ORG_WEBHOOK_SECRET_727Q4QOA4XAJ}
  gitlab:
    enabled: true
    provisioning:
      admin_token: ${K8S_GITLAB_ADMIN_TOKEN_WAUJSZDNDJPW}
      group: vault
    signing_secret: ${K8S_GITLAB_SIGNING_SECRET_QJJZI5PYJOTZ}
    token: ${K8S_GITLAB_READ_TOKEN_WPTA4V76S6WY}
    url: https://gitlab.example.com
  google_cloud:
    enabled: true
    provisioning:
      federation_key: ${K8S_GOOGLE_CLOUD_FEDERATION_KEY_BF4HAIUZL7UB}
      provisioner: crewlet-provisioner@vault-crewlet-id.iam.gserviceaccount.com
  jira:
    token: ${K8S_JIRA_TOKEN_6DOCH3XDCP43}
    url: https://jira.example.com
