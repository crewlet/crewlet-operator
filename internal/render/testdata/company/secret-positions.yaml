integrations:
  atlassian:
    api_key: ${K8S_ATLASSIAN_API_KEY_GGLMO3V7Y2XD}
    org_id: 1a2b3c4d-5e6f-7a8b-9c0d-1e2f3a4b5c6d
  confluence:
    token: ${K8S_CONFLUENCE_TOKEN_QD3JIVZQYMLY}
    url: https://wiki.example.com
    webhook_secret: ${K8S_CONFLUENCE_WEBHOOK_SECRET_QLVF3G6ROWBZ}
    webhook_token: ${K8S_CONFLUENCE_WEBHOOK_TOKEN_ZDL3GQFNCNPT}
  datadog:
    enabled: true
    provisioning:
      api_key: ${K8S_DATADOG_API_KEY_R2XMCNZGWCGX}
      app_key: ${K8S_DATADOG_APP_KEY_IIXGXLWMGXWV}
      site: datadoghq.eu
    route_to: coder
    webhook_token: ${K8S_DATADOG_WEBHOOK_TOKEN_RVSQWVNFN224}
  github:
    enabled: true
    token: ${K8S_GITHUB_ORG_TOKEN_JDLKCDUOTXME}
    webhook_secret: ${K8S_GITHUB_ORG_WEBHOOK_SECRET_727Q4QOA4XAJ}
  gitlab:
    enabled: true
    provisioning:
      admin_token: ${K8S_GITLAB_ADMIN_TOKEN_WAUJSZDNDJPW}
      group: vault
    signing_secret: ${K8S_GITLAB_SIGNING_SECRET_QJJZI5PYJOTZ}
    token: ${K8S_GITLAB_READ_TOKEN_WPTA4V76S6WY}
    url: https://gitlab.example.com
  jira:
    token: ${K8S_JIRA_TOKEN_6DOCH3XDCP43}
    url: https://jira.example.com
    webhook_secret: ${K8S_JIRA_WEBHOOK_SECRET_WNZFCPCUMO4A}
  mattermost:
    enabled: true
    provisioning:
      admin_token: ${K8S_MATTERMOST_ADMIN_TOKEN_D6QDVRN2HNFP}
    team: vault
    url: https://chat.example.com
  public_base_url: https://secret-positions.hooks.example.com
  slack: {}
mcp_servers:
- headers:
    X-Org: ${K8S_GITHUB_MCP_ORG_6VDZMC6YEQNP}
  name: github
  shared: false
  transport: http
  url: https://api.githubcopilot.com/mcp/
- args:
  - mcp
  - serve
  command: glab
  name: gitlab
  shared: false
  transport: stdio
- command: linear-mcp
  env:
    LINEAR_API_KEY: ${K8S_LINEAR_API_KEY_F5KSYDQMLPD6}
  name: linear
  transport: stdio
name: Vault
providers:
  embeddings:
    api_key: ${K8S_EMBEDDINGS_API_KEY_HJQVRPVWE7HZ}
    model: text-embedding-3-small
    type: openai
  llm:
    anthropic:
      api_keys:
      - ${K8S_ANTHROPIC_FIRST_KZXQ2RHOGIYN}
      - ${K8S_ANTHROPIC_SECOND_HPHWDBSDBVC3}
      model: claude-sonnet-5
      type: anthropic
    claude-subscription:
      cli:
        agent: claude-code
        auth:
          token: ${K8S_CLAUDE_CLI_OAUTH_TOKEN_W55SCV7GF57C}
        env:
          CLAUDE_CODE_USE_PROXY: ${K8S_CLAUDE_CLI_PROXY_ZOAXD5SI7DS7}
        state_dir: /var/lib/crewlet/llm-cli/claude-subscription
      model: sonnet
      type: cli-agent
    codex-subscription:
      cli:
        agent: codex
        auth:
          credential_bundle: ${K8S_CODEX_CLI_BUNDLE_RN44OBFCJWPS}
        state_dir: /var/lib/crewlet/llm-cli/codex-subscription
      model: gpt-5-codex
      type: cli-agent
    platform-claude:
      api_keys:
      - ${K8S_PLATFORM_LLM_ANTHROPIC_6433BUVLHKH7}
      model: claude-sonnet-5
      type: anthropic
  llm_order:
  - anthropic
  - claude-subscription
  - codex-subscription
  - platform-claude
  sandbox:
    default_run_in: e2b
    e2b:
      api_key: ${K8S_E2B_API_KEY_GSEHAAV5THN5}
    setup:
    - commands:
      - git config --global credential.helper store
      env:
        NPM_TOKEN: ${K8S_COMPANY_SANDBOX_NPM_TOKEN_V6VFWEGOMBUK}
      files:
        /root/.git-credentials: ${K8S_COMPANY_SANDBOX_GIT_CREDENTIALS_C3KHHFZBPJ2K}
      name: git-auth
roles:
- handle: support
  integrations:
    mattermost:
      bot_token: ${PROVISIONED_SUPPORT_MATTERMOST_BOT_TOKEN_V5KS3XBZ5CQT}
      channel: support
  kind: agent
  llm:
    default:
    - anthropic
  name: support
  placement:
    labels:
      crewlet.ai/pool: data
units:
- children:
  - id: platform
    mcp_env:
      linear:
        LINEAR_TEAM_TOKEN: ${K8S_PLATFORM_LINEAR_TOKEN_SQ2R3DLJSLND}
    name: platform
  id: engineering
  mcp_env:
    linear:
      LINEAR_TEAM_TOKEN: ${K8S_ENGINEERING_LINEAR_TOKEN_GQ3JHNIKTWHB}
  name: engineering
  roles:
  - handle: coder
    integrations:
      github:
        app_id: 7
        app_slug: vault-coder
        installation_id: 77
        private_key: ${K8S_CODER_GITHUB_APP_PRIVATE_KEY_MBKQYEC7LV3R}
        tier: review
        webhook_secret: ${K8S_CODER_GITHUB_APP_WEBHOOK_SECRET_PS7VGCGUUI6G}
      mattermost:
        bot_token: ${K8S_CODER_MATTERMOST_BOT_TOKEN_TEAYYSXE5AJ7}
      slack:
        bot_token: ${K8S_CODER_SLACK_BOT_TOKEN_NVLQQDP236KS}
        signing_secret: ${K8S_CODER_SLACK_SIGNING_SECRET_AYZEBR65VQXK}
    kind: agent
    llm:
      auxiliary:
      - platform-claude
      default:
      - anthropic
    mcp_env:
      github:
        Authorization: ${K8S_CODER_GITHUB_AUTHORIZATION_O5XXIVYQLUVV}
      gitlab:
        GITLAB_TOKEN: ${PROVISIONED_CODER_GITLAB_TOKEN_LLCLWORNYN42}
    name: coder
    placement:
      labels:
        crewlet.ai/pool: data
    sandbox:
      enabled: true
      env:
        GITHUB_TOKEN: ${K8S_CODER_GITHUB_TOKEN_GBSENFRBCM2H}
        GITLAB_TOKEN: ${PROVISIONED_CODER_GITLAB_TOKEN_LLCLWORNYN42}
      mcp:
        servers:
        - github
      setup:
      - env:
          REGISTRY_TOKEN: ${K8S_CODER_SANDBOX_REGISTRY_TOKEN_QVYKICE7R2PX}
        files:
          /root/.npmrc: ${K8S_CODER_SANDBOX_NPMRC_MEHPCUDWZVHV}
        name: registry
