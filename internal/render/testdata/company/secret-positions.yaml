    org_id: 1a2b3c4d-5e6f-7a8b-9c0d-1e2f3a4b5c6d
  aws:
    enabled: true
    provisioning:
      certificate_authority: ${K8S_AWS_CERTIFICATE_AUTHORITY_K25II75446JK}
      home_region: us-east-1
      slug: vault
  cloudflare:
    enabled: true
    provisioning:
      account_id: 0123456789abcdef0123456789abcdef
      api_token: ${K8S_CLOUDFLARE_API_TOKEN_DV74SCZJR3GC}
  confluence:
    token: ${K8S_CONFLUENCE_TOKEN_QD3JIVZQYMLY}
    url: https://wiki.example.com
    webhook_secret: ${K8S_CONFLUENCE_WEBHOOK_SECRET_QLVF3G6ROWBZ}
    webhook_token: ${K8S_CONFLUENCE_WEBHOOK_TOKEN_ZDL3GQFNCNPT}
  datadog:
    enabled: true
    provisioning:
      api_key: ${K8S_DATADOG_API_KEY_R2XMCNZGWCGX}
      app_key: ${K8S_DATADOG_APP_KEY_IIXGXLWMGXWV}
      site: datadoghq.eu
    route_to: coder
    webhook_token: ${K8S_DATADOG_WEBHOOK_TOKEN_RVSQWVNFN224}
  digitalocean:
    enabled: true
    provisioning:
      team: Vault
  expo:
