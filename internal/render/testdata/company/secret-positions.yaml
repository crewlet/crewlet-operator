      organization_id: 11111111-2222-4333-8444-555555555555
      secret_key: ${K8S_SCALEWAY_SECRET_KEY_I2CJTP6F2I4M}
  slack: {}
mcp_servers:
- headers:
    X-Org: ${K8S_GITHUB_MCP_ORG_6VDZMC6YEQNP}
  name: github
  shared: false
  tools:
    default: allow
  transport: http
  url: https://api.githubcopilot.com/mcp/
- args:
  - mcp
  - serve
  command: glab
  name: gitlab
  shared: false
  transport: stdio
- command: linear-mcp
  env:
    LINEAR_API_KEY: ${K8S_LINEAR_API_KEY_F5KSYDQMLPD6}
  name: linear
  transport: stdio
- name: tickets
  oauth:
    client: own
    client_id: crewlet-vault
    client_secret: ${K8S_TICKETS_OAUTH_CLIENT_SECRET_HZECUL3QJAXU}
    scopes:
    - read
    - write
  transport: http
  url: https://mcp.tickets.example.com/mcp
- name: vendor
  oauth:
    client_id: crewlet-agents
    client_secret: ${K8S_VENDOR_OAUTH_CLIENT_SECRET_4F4Q4DCTIV6I}
    grant: client_credentials
  transport: http
  url: https://mcp.vendor.example.com/mcp
name: Vault
providers:
  embeddings:
    api_key: ${K8S_EMBEDDINGS_API_KEY_HJQVRPVWE7HZ}
    model: text-embedding-3-small
    type: openai
  llm:
    anthropic:
      auth:
        api_key: ${K8S_ANTHROPIC_API_KEY_NP33B5LRRKLS}
        mode: api-key
      harness: claude-code
      model: claude-sonnet-5
      state_dir: /var/lib/crewlet/llm-harness/anthropic
    claude-subscription:
      auth:
        token: ${K8S_CLAUDE_CLI_OAUTH_TOKEN_W55SCV7GF57C}
      env:
        CLAUDE_CODE_USE_PROXY: ${K8S_CLAUDE_CLI_PROXY_ZOAXD5SI7DS7}
      harness: claude-code
      model: sonnet
      state_dir: /var/lib/crewlet/llm-harness/claude-subscription
    codex-subscription:
      auth:
        credential_bundle: ${K8S_CODEX_CLI_BUNDLE_RN44OBFCJWPS}
      harness: codex
      model: gpt-5-codex
      state_dir: /var/lib/crewlet/llm-harness/codex-subscription
    platform-claude:
      auth:
        api_key: ${K8S_PLATFORM_LLM_ANTHROPIC_6433BUVLHKH7}
        mode: api-key
      env:
        ANTHROPIC_BASE_URL: ${K8S_PLATFORM_LLM_GATEWAY_A4WM6JVVPIJN}
      harness: claude-code
      model: claude-sonnet-5
      state_dir: /var/lib/crewlet/llm-harness-platform/platform-claude
  llm_order:
  - anthropic
  - claude-subscription
  - codex-subscription
  - platform-claude
  sandbox:
    default_run_in: e2b
    e2b:
      api_key: ${K8S_E2B_API_KEY_GSEHAAV5THN5}
    setup:
    - commands:
      - git config --global credential.helper store
      env:
        NPM_TOKEN: ${K8S_COMPANY_SANDBOX_NPM_TOKEN_V6VFWEGOMBUK}
      files:
        .git-credentials: ${K8S_COMPANY_SANDBOX_GIT_CREDENTIALS_C3KHHFZBPJ2K}
      name: git-auth
roles:
- handle: support
  integrations:
    mattermost:
      channels:
      - support
      enabled: true
      roles:
      - system_user
  kind: agent
  llm:
    default:
    - anthropic
  name: support
  placement:
    labels:
      crewlet.ai/pool: data
seat_access_migrated:
- atlassian
- aws
- cloudflare
- datadog
- digitalocean
- expo
- github
- gitlab
- google_cloud
- mattermost
- scaleway
- slack
- ssh
units:
- children:
  - id: platform
    mcp_env:
      linear:
        LINEAR_TEAM_TOKEN: ${K8S_PLATFORM_LINEAR_TOKEN_SQ2R3DLJSLND}
    name: platform
  id: engineering
  mcp_env:
    linear:
      LINEAR_TEAM_TOKEN: ${K8S_ENGINEERING_LINEAR_TOKEN_GQ3JHNIKTWHB}
  name: engineering
  roles:
  - handle: coder
    integrations:
      github:
        app_id: 7
        app_slug: vault-coder
        enabled: true
        installation_id: 77
        permissions:
          actions: read
          checks: read
          contents: read
          issues: write
          pull_requests: write
        private_key: ${K8S_CODER_GITHUB_APP_PRIVATE_KEY_MBKQYEC7LV3R}
        webhook_secret: ${K8S_CODER_GITHUB_APP_WEBHOOK_SECRET_PS7VGCGUUI6G}
      slack:
        bot_token: ${K8S_CODER_SLACK_BOT_TOKEN_NVLQQDP236KS}
        enabled: true
        signing_secret: ${K8S_CODER_SLACK_SIGNING_SECRET_AYZEBR65VQXK}
    kind: agent
    llm:
      auxiliary:
      - platform-claude
      default:
      - anthropic
    mcp_env:
      linear:
        LINEAR_TEAM_TOKEN: ${K8S_CODER_LINEAR_TOKEN_LZEVYNFKVIKH}
    name: coder
    placement:
      labels:
        crewlet.ai/pool: data
    sandbox:
      env:
        CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN_CODER}
        DIGITALOCEAN_ACCESS_TOKEN: ${DIGITALOCEAN_TOKEN_CODER}
        EXPO_TOKEN: ${EXPO_TOKEN_CODER}
        GITLAB_TOKEN: ${GITLAB_TOKEN_CODER}
        SCW_ACCESS_KEY: ${SCALEWAY_ACCESS_KEY_CODER}
        SCW_SECRET_KEY: ${SCALEWAY_SECRET_KEY_CODER}
        SENTRY_AUTH_TOKEN: ${K8S_CODER_SENTRY_TOKEN_MB2KD4S6HMXI}
      mcp:
        servers:
        - github
      setup:
      - env:
          REGISTRY_TOKEN: ${K8S_CODER_SANDBOX_REGISTRY_TOKEN_QVYKICE7R2PX}
        files:
          .npmrc: ${K8S_CODER_SANDBOX_NPMRC_MEHPCUDWZVHV}
        name: registry
