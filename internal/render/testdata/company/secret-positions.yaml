integrations:
  github:
    enabled: true
    token: ${K8S_TENANT_NIMBUS_GITHUB_ORG_TOKEN}
    webhook_secret: ${K8S_TENANT_NIMBUS_GITHUB_ORG_WEBHOOKSECRET}
  public_base_url: https://secret-positions.hooks.example.com
  slack: {}
mcp_servers:
- headers:
    X-Org: ${K8S_TENANT_NIMBUS_GITHUB_MCP_ORG}
  name: github
  shared: false
  transport: http
  url: https://api.githubcopilot.com/mcp/
- command: linear-mcp
  env:
    LINEAR_API_KEY: ${K8S_TENANT_NIMBUS_LINEAR_APIKEY}
  name: linear
  transport: stdio
name: Vault
providers:
  embeddings:
    api_key: ${K8S_TENANT_NIMBUS_EMBEDDINGS_APIKEY}
    model: text-embedding-3-small
    type: openai
  llm:
    anthropic:
      api_keys:
      - ${K8S_TENANT_NIMBUS_ANTHROPIC_FIRST}
      - ${K8S_TENANT_NIMBUS_ANTHROPIC_SECOND}
      model: claude-sonnet-5
      type: anthropic
    platform-claude:
      api_keys:
      - ${K8S_CREWLET_SYSTEM_PLATFORM_LLM_ANTHROPIC}
      model: claude-sonnet-5
      type: anthropic
  llm_order:
  - anthropic
  - platform-claude
  sandbox:
    default_run_in: e2b
    e2b:
      api_key: ${K8S_TENANT_NIMBUS_E2B_APIKEY}
    setup:
    - commands:
      - git config --global credential.helper store
      env:
        NPM_TOKEN: ${K8S_TENANT_NIMBUS_COMPANY_SANDBOX_NPMTOKEN}
      files:
        /root/.git-credentials: ${K8S_TENANT_NIMBUS_COMPANY_SANDBOX_GITCREDENTIALS}
      name: git-auth
units:
- id: engineering
  mcp_env:
    linear:
      LINEAR_TEAM_TOKEN: ${K8S_TENANT_NIMBUS_ENGINEERING_LINEAR_TOKEN}
  name: engineering
  roles:
  - handle: coder
    integrations:
      github:
        app_id: 7
        app_slug: vault-coder
        installation_id: 77
        private_key: ${K8S_TENANT_NIMBUS_CODER_GITHUB_APP_PRIVATEKEY}
        tier: review
        webhook_secret: ${K8S_TENANT_NIMBUS_CODER_GITHUB_APP_WEBHOOKSECRET}
      slack:
        bot_token: ${K8S_TENANT_NIMBUS_CODER_SLACK_BOTTOKEN}
        signing_secret: ${K8S_TENANT_NIMBUS_CODER_SLACK_SIGNINGSECRET}
    kind: agent
    llm:
      auxiliary:
      - platform-claude
      default:
      - anthropic
    mcp_env:
      github:
        Authorization: ${K8S_TENANT_NIMBUS_CODER_GITHUB_AUTHORIZATION}
    name: coder
    placement:
      labels:
        crewlet.ai/pool: data
    sandbox:
      enabled: true
      env:
        GITHUB_TOKEN: ${K8S_TENANT_NIMBUS_CODER_GITHUB_TOKEN}
      mcp:
        servers:
        - github
      setup:
      - env:
          REGISTRY_TOKEN: ${K8S_TENANT_NIMBUS_CODER_SANDBOX_REGISTRYTOKEN}
        files:
          /root/.npmrc: ${K8S_TENANT_NIMBUS_CODER_SANDBOX_NPMRC}
        name: registry
