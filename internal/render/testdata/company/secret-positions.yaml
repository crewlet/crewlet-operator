integrations:
  github:
    enabled: true
    token: ${K8S_GITHUB_ORG_TOKEN_JDLKCDUOTXME}
    webhook_secret: ${K8S_GITHUB_ORG_WEBHOOK_SECRET_727Q4QOA4XAJ}
  public_base_url: https://secret-positions.hooks.example.com
  slack: {}
mcp_servers:
- headers:
    X-Org: ${K8S_GITHUB_MCP_ORG_6VDZMC6YEQNP}
  name: github
  shared: false
  transport: http
  url: https://api.githubcopilot.com/mcp/
- command: linear-mcp
  env:
    LINEAR_API_KEY: ${K8S_LINEAR_API_KEY_F5KSYDQMLPD6}
  name: linear
  transport: stdio
name: Vault
providers:
  embeddings:
    api_key: ${K8S_EMBEDDINGS_API_KEY_HJQVRPVWE7HZ}
    model: text-embedding-3-small
    type: openai
  llm:
    anthropic:
      api_keys:
      - ${K8S_ANTHROPIC_FIRST_KZXQ2RHOGIYN}
      - ${K8S_ANTHROPIC_SECOND_HPHWDBSDBVC3}
      model: claude-sonnet-5
      type: anthropic
    platform-claude:
      api_keys:
      - ${K8S_PLATFORM_LLM_ANTHROPIC_6433BUVLHKH7}
      model: claude-sonnet-5
      type: anthropic
  llm_order:
  - anthropic
  - platform-claude
  sandbox:
    default_run_in: e2b
    e2b:
      api_key: ${K8S_E2B_API_KEY_GSEHAAV5THN5}
    setup:
    - commands:
      - git config --global credential.helper store
      env:
        NPM_TOKEN: ${K8S_COMPANY_SANDBOX_NPM_TOKEN_V6VFWEGOMBUK}
      files:
        /root/.git-credentials: ${K8S_COMPANY_SANDBOX_GIT_CREDENTIALS_C3KHHFZBPJ2K}
      name: git-auth
units:
- id: engineering
  mcp_env:
    linear:
      LINEAR_TEAM_TOKEN: ${K8S_ENGINEERING_LINEAR_TOKEN_GQ3JHNIKTWHB}
  name: engineering
  roles:
  - handle: coder
    integrations:
      github:
        app_id: 7
        app_slug: vault-coder
        installation_id: 77
        private_key: ${K8S_CODER_GITHUB_APP_PRIVATE_KEY_MBKQYEC7LV3R}
        tier: review
        webhook_secret: ${K8S_CODER_GITHUB_APP_WEBHOOK_SECRET_PS7VGCGUUI6G}
      slack:
        bot_token: ${K8S_CODER_SLACK_BOT_TOKEN_NVLQQDP236KS}
        signing_secret: ${K8S_CODER_SLACK_SIGNING_SECRET_AYZEBR65VQXK}
    kind: agent
    llm:
      auxiliary:
      - platform-claude
      default:
      - anthropic
    mcp_env:
      github:
        Authorization: ${K8S_CODER_GITHUB_AUTHORIZATION_O5XXIVYQLUVV}
    name: coder
    placement:
      labels:
        crewlet.ai/pool: data
    sandbox:
      enabled: true
      env:
        GITHUB_TOKEN: ${K8S_CODER_GITHUB_TOKEN_GBSENFRBCM2H}
      mcp:
        servers:
        - github
      setup:
      - env:
          REGISTRY_TOKEN: ${K8S_CODER_SANDBOX_REGISTRY_TOKEN_QVYKICE7R2PX}
        files:
          /root/.npmrc: ${K8S_CODER_SANDBOX_NPMRC_MEHPCUDWZVHV}
        name: registry
