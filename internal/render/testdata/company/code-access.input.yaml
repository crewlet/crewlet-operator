# An agent seat with a code access tier and nothing it applies to: the
# company hosts no code, and Crewlet's own code host is the only place a tier
# caps. Crewlet runs the seat, and warns that the tier grants nothing.
apiVersion: crewlet.ai/v1alpha1
kind: Company
metadata:
  name: shed
spec:
  engineClassName: basic
  companyName: Shed
  mission: Keep the build scripts tidy.
  sandbox:
    defaultRunIn: Direct
---
apiVersion: crewlet.ai/v1alpha1
kind: LLMProvider
metadata:
  name: claude
spec:
  companyRef:
    name: shed
  harness: ClaudeCode
  model: claude-sonnet-5
  auth:
    mode: APIKey
    apiKeySecretRef:
      name: anthropic
      key: apiKey
---
apiVersion: crewlet.ai/v1alpha1
kind: Seat
metadata:
  name: tidier
spec:
  companyRef:
    name: shed
  goal: Tidy the build scripts.
  code:
    access: Review
