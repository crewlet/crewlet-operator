# Harnesses as model providers. A seat's executor is its harness's own run in a
# box on the engine pod that holds the seat: Claude Code on a subscription's
# headless token runs it, and OpenCode, behind it in the seat's chain, runs it
# while Claude Code sits out its plan. Codex on an exported login is the
# reviewer, in the engine's pod, and Hermes, signed in with no login of its
# own (its model provider's key in env, a ${NAME} Crewlet passes to the
# Hermes process untouched), the delegated workers'. Pi signs in the same
# way, and Cursor on a Cursor account's metered key in CURSOR_API_KEY. Claude
# Code through a gateway, last in the seat's chain, signs in with its env
# alone (auth mode Env): the gateway's address and the token it issued.
apiVersion: crewlet.ai/v1alpha1
kind: Company
metadata:
  name: forge
spec:
  engineClassName: basic
  companyName: Forge
  sandbox:
    commitAttribution: false
---
apiVersion: crewlet.ai/v1alpha1
kind: LLMProvider
metadata:
  name: claude-cli
spec:
  companyRef:
    name: forge
  harness: ClaudeCode
  model: sonnet
  loginName: claude
  timeoutSeconds: 900
  maxConcurrent: 2
  auth:
    mode: Subscription
    tokenSecretRef:
      name: claude-subscription
      key: oauthToken
---
apiVersion: crewlet.ai/v1alpha1
kind: LLMProvider
metadata:
  name: codex
spec:
  companyRef:
    name: forge
  harness: Codex
  model: gpt-5-codex
  auth:
    credentialBundleSecretRef:
      name: codex-login
      key: bundle
---
apiVersion: crewlet.ai/v1alpha1
kind: LLMProvider
metadata:
  name: hermes
spec:
  companyRef:
    name: forge
  harness: Hermes
  model: anthropic/claude-sonnet-5
  auth:
    mode: Subscription
  env:
    - name: OPENROUTER_API_KEY
      valueFrom:
        secretKeyRef:
          name: openrouter
          key: apiKey
---
apiVersion: crewlet.ai/v1alpha1
kind: LLMProvider
metadata:
  name: pi
spec:
  companyRef:
    name: forge
  harness: Pi
  model: openrouter/anthropic/claude-sonnet-5
  auth:
    mode: Subscription
  env:
    - name: OPENROUTER_API_KEY
      valueFrom:
        secretKeyRef:
          name: openrouter
          key: apiKey
---
apiVersion: crewlet.ai/v1alpha1
kind: LLMProvider
metadata:
  name: cursor
spec:
  companyRef:
    name: forge
  harness: CursorAgent
  model: auto
  auth:
    mode: APIKey
    apiKeySecretRef:
      name: cursor
      key: apiKey
---
apiVersion: crewlet.ai/v1alpha1
kind: LLMProvider
metadata:
  name: opencode
spec:
  companyRef:
    name: forge
  harness: OpenCode
  model: anthropic/claude-sonnet-5
  auth:
    mode: Subscription
  env:
    - name: ANTHROPIC_API_KEY
      valueFrom:
        secretKeyRef:
          name: anthropic
          key: apiKey
---
apiVersion: crewlet.ai/v1alpha1
kind: LLMProvider
metadata:
  name: claude-gateway
spec:
  companyRef:
    name: forge
  harness: ClaudeCode
  model: sonnet
  auth:
    mode: Env
  env:
    - name: ANTHROPIC_BASE_URL
      valueFrom:
        secretKeyRef:
          name: llm-gateway
          key: baseURL
    - name: ANTHROPIC_AUTH_TOKEN
      valueFrom:
        secretKeyRef:
          name: llm-gateway
          key: token
---
apiVersion: crewlet.ai/v1alpha1
kind: Seat
metadata:
  name: builder
spec:
  companyRef:
    name: forge
  goal: Ship the changes the team files.
  llm:
    default:
      - name: claude-cli
      - name: opencode
      - name: claude-gateway
    review:
      - name: codex
    subagent:
      - name: hermes
