assistant:
  instructions:
    format: tldr
    length: brief
    text: Use British spelling, and name the seat an answer is about.
  model: assistant
  token_budget:
    day: 200000
atlas:
  agent_records: false
  owner_wakes: false
  refresh_interval_seconds: 1800
  retention_days: 400
name: Helm
providers:
  llm:
    assistant:
      auth:
        api_key: ${K8S_ANTHROPIC_API_KEY_NP33B5LRRKLS}
        mode: api-key
      harness: claude-code
      max_concurrent: 4
      model: sonnet
      state_dir: /var/lib/crewlet/llm-harness/assistant
      timeout_seconds: 90
    pi:
      auth:
        mode: subscription
      env:
        OPENROUTER_API_KEY: ${K8S_OPENROUTER_API_KEY_A54OX7VM4MZL}
      harness: pi
      model: openrouter/anthropic/claude-sonnet-5
      overrides:
        web_tools: denied
      state_dir: /var/lib/crewlet/llm-harness/pi
  llm_order:
  - assistant
  - pi
  sandbox:
    default_run_in: direct
    local:
      state_dir: /var/lib/crewlet-sandboxes
seat_access_migrated:
- admob
- adsense
- app_store_connect
- apple_ads
- atlassian
- aws
- cloudflare
- datadog
- digitalocean
- expo
- github
- gitlab
- google_ads
- google_analytics
- google_cloud
- google_play
- mattermost
- meta_ads
- scaleway
- search_console
- slack
- ssh
