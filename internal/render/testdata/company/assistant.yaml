assistant:
  model: assistant
  token_budget:
    day: 200000
atlas:
  agent_records: false
  owner_wakes: false
  refresh_interval_seconds: 1800
  retention_days: 400
name: Helm
providers:
  llm:
    assistant:
      auth:
        api_key: ${K8S_ANTHROPIC_API_KEY_NP33B5LRRKLS}
        mode: api-key
      harness: claude-code
      max_concurrent: 4
      model: sonnet
      state_dir: /var/lib/crewlet/llm-harness/assistant
      timeout_seconds: 90
    pi:
      auth:
        mode: subscription
      env:
        OPENROUTER_API_KEY: ${K8S_OPENROUTER_API_KEY_A54OX7VM4MZL}
      harness: pi
      model: openrouter/anthropic/claude-sonnet-5
      overrides:
        web_tools: denied
      state_dir: /var/lib/crewlet/llm-harness/pi
  llm_order:
  - assistant
  - pi
seat_access_migrated:
- atlassian
- aws
- cloudflare
- datadog
- digitalocean
- expo
- github
- gitlab
- google_cloud
- mattermost
- scaleway
- slack
- ssh
