assistant:
  enabled: true
  llm:
  - assistant
  - assistant-codex
  max_steps: 12
  proposal_ttl_seconds: 600
  retention_days: 90
  token_budget:
    day: 200000
  turn_timeout_seconds: 180
name: Helm
providers:
  llm:
    assistant:
      agent: claude-code
      auth:
        api_key: ${K8S_ANTHROPIC_API_KEY_NP33B5LRRKLS}
        mode: api-key
      max_concurrent: 4
      model: sonnet
      overrides:
        web_tools: denied
      state_dir: /var/lib/crewlet/llm-cli/assistant
      timeout_seconds: 90
    assistant-codex:
      agent: codex
      auth:
        credential_bundle: ${K8S_CODEX_LOGIN_BUNDLE_C7GT3IPZJRP3}
      model: gpt-5-codex
      overrides:
        web_tools: denied
      state_dir: /var/lib/crewlet/llm-cli/assistant-codex
  llm_order:
  - assistant
  - assistant-codex
