roles:
- goal: Write the weekly growth report.
  handle: analyst
  integrations:
    google_analytics:
      enabled: true
      properties:
      - "123456789"
  kind: agent
  name: analyst
  placement:
    labels:
      crewlet.ai/pool: data
- goal: Keep Harbor's mediation groups earning.
  handle: monetization
  integrations:
    admob:
      accounts:
      - pub-1234567890123456
      enabled: true
      level: operate
  kind: agent
  name: monetization
  placement:
    labels:
      crewlet.ai/pool: data
- goal: Own Harbor's ad revenue and approve what cannot be undone in AdMob.
  handle: rosa
  kind: human
  name: Rosa Lind
- goal: Report what Harbor's sites earn.
  handle: sites
  integrations:
    adsense:
      accounts:
      - pub-6543210987654321
      enabled: true
  kind: agent
  name: sites
  placement:
    labels:
      crewlet.ai/pool: data
