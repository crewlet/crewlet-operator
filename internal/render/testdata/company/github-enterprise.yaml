integrations:
  github:
    enabled: true
    provisioning:
      org: forge
      org_webhook: "true"
      repos:
      - forge/api
      - forge/web
    token: ${K8S_FORGE_GITHUB_ORG_TOKEN_BQMOGEO5YFB4}
    url: https://github.forge.example
    webhook_secret: ${K8S_FORGE_GITHUB_WEBHOOK_SECRET_TBDDG2MGKIUZ}
name: Forge
roles:
- handle: builder
  integrations:
    github:
      app_id: 42
      app_slug: forge-builder
      enabled: true
      installation_id: 4242
      permissions:
        actions: read
        checks: write
        contents: write
        issues: write
        pull_requests: write
        workflows: write
      private_key: ${K8S_BUILDER_GITHUB_APP_PRIVATE_KEY_XJ3ZLBDFZG45}
      webhook_secret: ${K8S_BUILDER_GITHUB_APP_WEBHOOK_SECRET_2FHJJ6YLPUEG}
  kind: agent
  name: builder
  placement:
    labels:
      crewlet.ai/pool: data
- handle: reviewer
  integrations:
    github:
      enabled: true
      permissions:
        actions: read
        checks: read
        contents: read
        issues: read
        pull_requests: read
      repos:
      - forge/api
  kind: agent
  name: reviewer
  placement:
    labels:
      crewlet.ai/pool: data
seat_access_migrated:
- atlassian
- datadog
- github
- gitlab
- mattermost
- slack
