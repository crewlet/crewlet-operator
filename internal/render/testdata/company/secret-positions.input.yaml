# Every credential position the API covers, each filled from a Secret key of
# its own, so the golden shows each ${...} pointer where Crewlet reads a
# credential (docs/concepts/credentials.md lists them). The class's platform
# provider fills the one position a tenant cannot.
apiVersion: crewlet.ai/v1alpha1
kind: EngineClass
metadata:
  name: vault
spec:
  engine:
    image: ghcr.io/crewlet/crewlet:v0.1.0
  data:
    storage:
      size: 10Gi
  platformLLMProviders:
    - name: platform-claude
      type: Anthropic
      model: claude-sonnet-5
      apiKeySecretRefs:
        - namespace: crewlet-system
          name: platform-llm
          key: anthropic
---
apiVersion: crewlet.ai/v1alpha1
kind: Company
metadata:
  name: vault
spec:
  engineClassName: vault
  companyName: Vault
  llm:
    usePlatformProviders: true
  embeddings:
    type: OpenAI
    model: text-embedding-3-small
    apiKeySecretRef:
      name: embeddings
      key: apiKey
  sandbox:
    e2b:
      apiKeySecretRef:
        name: e2b
        key: apiKey
    setup:
      - name: git-auth
        files:
          - path: /root/.git-credentials
            valueFrom:
              secretKeyRef:
                name: company-sandbox
                key: gitCredentials
        env:
          - name: NPM_TOKEN
            valueFrom:
              secretKeyRef:
                name: company-sandbox
                key: npmToken
        commands:
          - git config --global credential.helper store
---
apiVersion: crewlet.ai/v1alpha1
kind: LLMProvider
metadata:
  name: anthropic
spec:
  companyRef:
    name: vault
  type: Anthropic
  model: claude-sonnet-5
  apiKeySecretRefs:
    - name: anthropic
      key: first
    - name: anthropic
      key: second
---
apiVersion: crewlet.ai/v1alpha1
kind: MCPServer
metadata:
  name: linear
spec:
  companyRef:
    name: vault
  transport: Stdio
  command: linear-mcp
  env:
    - name: LINEAR_API_KEY
      valueFrom:
        secretKeyRef:
          name: linear
          key: apiKey
---
apiVersion: crewlet.ai/v1alpha1
kind: MCPServer
metadata:
  name: github
spec:
  companyRef:
    name: vault
  transport: HTTP
  shared: false
  url: https://api.githubcopilot.com/mcp/
  headers:
    - name: X-Org
      valueFrom:
        secretKeyRef:
          name: github-mcp
          key: org
---
apiVersion: crewlet.ai/v1alpha1
kind: Integration
metadata:
  name: github
spec:
  companyRef:
    name: vault
  github:
    webhookSecretRef:
      name: github-org
      key: webhookSecret
    tokenSecretRef:
      name: github-org
      key: token
---
apiVersion: crewlet.ai/v1alpha1
kind: Integration
metadata:
  name: slack
spec:
  companyRef:
    name: vault
  slack: {}
---
apiVersion: crewlet.ai/v1alpha1
kind: Unit
metadata:
  name: engineering
spec:
  companyRef:
    name: vault
  mcp:
    - name: linear
      env:
        - name: LINEAR_TEAM_TOKEN
          valueFrom:
            secretKeyRef:
              name: engineering-linear
              key: token
---
apiVersion: crewlet.ai/v1alpha1
kind: Seat
metadata:
  name: coder
spec:
  companyRef:
    name: vault
  unitRef:
    name: engineering
  llm:
    default:
      - name: anthropic
    auxiliary:
      - kind: PlatformLLMProvider
        name: platform-claude
  mcp:
    - name: github
      env:
        - name: Authorization
          valueFrom:
            secretKeyRef:
              name: coder-github
              key: authorization
  sandbox:
    mcpServerRefs:
      - name: github
    env:
      - name: GITHUB_TOKEN
        valueFrom:
          secretKeyRef:
            name: coder-github
            key: token
    setup:
      - name: registry
        files:
          - path: /root/.npmrc
            valueFrom:
              secretKeyRef:
                name: coder-sandbox
                key: npmrc
        env:
          - name: REGISTRY_TOKEN
            valueFrom:
              secretKeyRef:
                name: coder-sandbox
                key: registryToken
  integrations:
    slack:
      credentialsSecretRef:
        name: coder-slack
    github:
      tier: Review
      app:
        id: 7
        slug: vault-coder
        installationID: 77
        credentialsSecretRef:
          name: coder-github-app
