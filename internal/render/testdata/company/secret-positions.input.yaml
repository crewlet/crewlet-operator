# Every credential position the API covers, each filled from a Secret key of
# its own, so the golden shows each ${...} pointer where Crewlet reads a
# credential (docs/concepts/credentials.md lists them). The class's platform
# provider fills a model's positions from Secrets in a namespace of the
# platform's, and a seat's provisioned credentials the ones the engine mints
# under provisioning Engine.
apiVersion: crewlet.ai/v1alpha1
kind: EngineClass
metadata:
  name: vault
spec:
  engine:
    image: ghcr.io/crewlet/crewlet:v0.1.0
  data:
    storage:
      size: 16Gi
  platformLLMProviders:
    - name: platform-claude
      agent: ClaudeCode
      model: claude-sonnet-5
      auth:
        mode: APIKey
        apiKeySecretRef:
          namespace: crewlet-system
          name: platform-llm
          key: anthropic
      env:
        - name: ANTHROPIC_BASE_URL
          valueFrom:
            secretKeyRef:
              namespace: crewlet-system
              name: platform-llm
              key: gateway
---
apiVersion: crewlet.ai/v1alpha1
kind: Company
metadata:
  name: vault
spec:
  engineClassName: vault
  companyName: Vault
  llm:
    usePlatformProviders: true
  embeddings:
    type: OpenAI
    model: text-embedding-3-small
    apiKeySecretRef:
      name: embeddings
      key: apiKey
  sandbox:
    defaultRunIn: E2B
    e2b:
      apiKeySecretRef:
        name: e2b
        key: apiKey
    setup:
      - name: git-auth
        files:
          - path: .git-credentials
            valueFrom:
              secretKeyRef:
                name: company-sandbox
                key: gitCredentials
        env:
          - name: NPM_TOKEN
            valueFrom:
              secretKeyRef:
                name: company-sandbox
                key: npmToken
        commands:
          - git config --global credential.helper store
---
apiVersion: crewlet.ai/v1alpha1
kind: LLMProvider
metadata:
  name: anthropic
spec:
  companyRef:
    name: vault
  agent: ClaudeCode
  model: claude-sonnet-5
  auth:
    mode: APIKey
    apiKeySecretRef:
      name: anthropic
      key: apiKey
---
apiVersion: crewlet.ai/v1alpha1
kind: LLMProvider
metadata:
  name: claude-subscription
spec:
  companyRef:
    name: vault
  agent: ClaudeCode
  model: sonnet
  auth:
    tokenSecretRef:
      name: claude-cli
      key: oauthToken
  env:
    - name: CLAUDE_CODE_USE_PROXY
      valueFrom:
        secretKeyRef:
          name: claude-cli
          key: proxy
---
# A provider signs in with one login: the bundle is a CLI's of its own.
apiVersion: crewlet.ai/v1alpha1
kind: LLMProvider
metadata:
  name: codex-subscription
spec:
  companyRef:
    name: vault
  agent: Codex
  model: gpt-5-codex
  auth:
    credentialBundleSecretRef:
      name: codex-cli
      key: bundle
---
apiVersion: crewlet.ai/v1alpha1
kind: MCPServer
metadata:
  name: gitlab
spec:
  companyRef:
    name: vault
  transport: Stdio
  shared: false
  command: glab
  args: ["mcp", "serve"]
---
apiVersion: crewlet.ai/v1alpha1
kind: MCPServer
metadata:
  name: linear
spec:
  companyRef:
    name: vault
  transport: Stdio
  command: linear-mcp
  env:
    - name: LINEAR_API_KEY
      valueFrom:
        secretKeyRef:
          name: linear
          key: apiKey
---
apiVersion: crewlet.ai/v1alpha1
kind: MCPServer
metadata:
  name: github
spec:
  companyRef:
    name: vault
  transport: HTTP
  shared: false
  url: https://api.githubcopilot.com/mcp/
  headers:
    - name: X-Org
      valueFrom:
        secretKeyRef:
          name: github-mcp
          key: org
---
apiVersion: crewlet.ai/v1alpha1
kind: Integration
metadata:
  name: github
spec:
  companyRef:
    name: vault
  github:
    webhookSecretRef:
      name: github-org
      key: webhookSecret
    tokenSecretRef:
      name: github-org
      key: token
---
apiVersion: crewlet.ai/v1alpha1
kind: Integration
metadata:
  name: slack
spec:
  companyRef:
    name: vault
  slack: {}
---
apiVersion: crewlet.ai/v1alpha1
kind: Integration
metadata:
  name: gitlab
spec:
  companyRef:
    name: vault
  provisioning: Engine
  gitlab:
    url: https://gitlab.example.com
    signingSecretRef:
      name: gitlab
      key: signingSecret
    tokenSecretRef:
      name: gitlab
      key: readToken
    engineProvisioning:
      group: vault
      adminTokenSecretRef:
        name: gitlab-admin
        key: token
---
apiVersion: crewlet.ai/v1alpha1
kind: Integration
metadata:
  name: mattermost
spec:
  companyRef:
    name: vault
  provisioning: Engine
  mattermost:
    url: https://chat.example.com
    team: vault
    engineProvisioning:
      adminTokenSecretRef:
        name: mattermost-admin
        key: token
---
apiVersion: crewlet.ai/v1alpha1
kind: Integration
metadata:
  name: jira
spec:
  companyRef:
    name: vault
  jira:
    url: https://jira.example.com
    tokenSecretRef:
      name: jira
      key: token
    webhookSecretRef:
      name: jira
      key: webhookSecret
---
apiVersion: crewlet.ai/v1alpha1
kind: Integration
metadata:
  name: confluence
spec:
  companyRef:
    name: vault
  confluence:
    url: https://wiki.example.com
    tokenSecretRef:
      name: confluence
      key: token
    webhookSecretRef:
      name: confluence
      key: webhookSecret
    webhookTokenSecretRef:
      name: confluence
      key: webhookToken
---
apiVersion: crewlet.ai/v1alpha1
kind: Integration
metadata:
  name: datadog
spec:
  companyRef:
    name: vault
  provisioning: Engine
  datadog:
    webhookTokenSecretRef:
      name: datadog
      key: webhookToken
    routeTo:
      seatRef:
        name: coder
    site: EU1
    apiKeySecretRef:
      name: datadog
      key: apiKey
    appKeySecretRef:
      name: datadog
      key: appKey
---
apiVersion: crewlet.ai/v1alpha1
kind: Integration
metadata:
  name: atlassian
spec:
  companyRef:
    name: vault
  provisioning: Engine
  atlassian:
    orgID: 1a2b3c4d-5e6f-7a8b-9c0d-1e2f3a4b5c6d
    apiKeySecretRef:
      name: atlassian
      key: apiKey
---
apiVersion: crewlet.ai/v1alpha1
kind: Unit
metadata:
  name: engineering
spec:
  companyRef:
    name: vault
  mcp:
    - name: linear
      env:
        - name: LINEAR_TEAM_TOKEN
          valueFrom:
            secretKeyRef:
              name: engineering-linear
              key: token
---
# A child unit fills the same positions as a top-level one, nested under its
# parent's children.
apiVersion: crewlet.ai/v1alpha1
kind: Unit
metadata:
  name: platform
spec:
  companyRef:
    name: vault
  parentRef:
    name: engineering
  mcp:
    - name: linear
      env:
        - name: LINEAR_TEAM_TOKEN
          valueFrom:
            secretKeyRef:
              name: platform-linear
              key: token
---
apiVersion: crewlet.ai/v1alpha1
kind: Seat
metadata:
  name: coder
spec:
  companyRef:
    name: vault
  unitRef:
    name: engineering
  llm:
    default:
      - name: anthropic
    auxiliary:
      - kind: PlatformLLMProvider
        name: platform-claude
  mcp:
    - name: github
      env:
        - name: Authorization
          valueFrom:
            secretKeyRef:
              name: coder-github
              key: authorization
    - name: gitlab
      env:
        - name: GITLAB_TOKEN
          valueFrom:
            provisioned:
              name: gitlab-token
  sandbox:
    mcpServerRefs:
      - name: github
    env:
      - name: GITHUB_TOKEN
        valueFrom:
          secretKeyRef:
            name: coder-github
            key: token
      - name: GITLAB_TOKEN
        valueFrom:
          provisioned:
            name: gitlab-token
    setup:
      - name: registry
        files:
          - path: .npmrc
            valueFrom:
              secretKeyRef:
                name: coder-sandbox
                key: npmrc
        env:
          - name: REGISTRY_TOKEN
            valueFrom:
              secretKeyRef:
                name: coder-sandbox
                key: registryToken
  integrations:
    slack:
      credentialsSecretRef:
        name: coder-slack
    mattermost:
      botToken:
        secretKeyRef:
          name: coder-mattermost
          key: botToken
    github:
      tier: Review
      app:
        id: 7
        slug: vault-coder
        installationID: 77
        credentialsSecretRef:
          name: coder-github-app
---
# A second agent seat whose Mattermost bot the engine provisions.
apiVersion: crewlet.ai/v1alpha1
kind: Seat
metadata:
  name: support
spec:
  companyRef:
    name: vault
  llm:
    default:
      - name: anthropic
  integrations:
    mattermost:
      botToken:
        provisioned:
          name: mattermost-bot-token
      channel: support
