# OpenCode as two seats' executor, each its own agentic run in a box, signed
# in by its model provider's key in env, which a run carries into its box,
# and its model written <provider>/<model>, as OpenCode reads it, each box on
# the engine pod that holds the seat. porter holds up to two runs at once,
# each for its own conversation.
apiVersion: crewlet.ai/v1alpha1
kind: Company
metadata:
  name: harbor
spec:
  engineClassName: basic
  companyName: Harbor
---
apiVersion: crewlet.ai/v1alpha1
kind: LLMProvider
metadata:
  name: opencode
spec:
  companyRef:
    name: harbor
  harness: OpenCode
  model: openrouter/anthropic/claude-sonnet-5
  auth:
    mode: Subscription
  env:
    - name: OPENROUTER_API_KEY
      valueFrom:
        secretKeyRef:
          name: openrouter
          key: apiKey
---
apiVersion: crewlet.ai/v1alpha1
kind: LLMProvider
metadata:
  name: anthropic
spec:
  companyRef:
    name: harbor
  harness: OpenCode
  model: anthropic/claude-sonnet-5
  auth:
    mode: Subscription
  env:
    - name: ANTHROPIC_API_KEY
      valueFrom:
        secretKeyRef:
          name: anthropic
          key: apiKey
---
apiVersion: crewlet.ai/v1alpha1
kind: Seat
metadata:
  name: porter
spec:
  companyRef:
    name: harbor
  goal: Port the services to the new runtime.
  llm:
    default:
      - name: opencode
  sandbox:
    maxTurns: 64
    maxConcurrentRuns: 2
---
apiVersion: crewlet.ai/v1alpha1
kind: Seat
metadata:
  name: fixer
spec:
  companyRef:
    name: harbor
  goal: Fix what the port breaks.
  llm:
    default:
      - name: anthropic
