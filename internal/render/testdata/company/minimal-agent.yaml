mission: Answer every support email within a day.
name: Solo
providers:
  llm:
    claude:
      auth:
        api_key: ${K8S_ANTHROPIC_API_KEY_NP33B5LRRKLS}
        mode: api-key
      harness: claude-code
      model: claude-sonnet-5
      state_dir: /var/lib/crewlet/llm-harness/claude
  llm_order:
  - claude
  sandbox:
    default_run_in: direct
    local:
      state_dir: /var/lib/crewlet-sandboxes
roles:
- goal: Answer support email.
  handle: support
  kind: agent
  name: support
  placement:
    labels:
      crewlet.ai/pool: data
seat_access_migrated:
- atlassian
- aws
- cloudflare
- datadog
- digitalocean
- expo
- github
- gitlab
- mattermost
- scaleway
- slack
