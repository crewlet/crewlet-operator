# An org chart three units deep, with seats at every level and outside every
# unit, a person, management by seat and by unit, inherited and explicit
# leads, and every company-wide field and engine setting that is not a
# credential.
apiVersion: crewlet.ai/v1alpha1
kind: Company
metadata:
  name: acme
spec:
  engineClassName: basic
  companyName: Acme Corp
  mission: Make anvils.
  vision: Every coyote owns an anvil.
  policies:
    - Ship small.
  timeZone: America/Phoenix
  tracker:
    backend: Native
    native:
      inboxRetentionDays: 90
  knowledge:
    backend: Native
    scope: [ENG, OPS]
    skillsContainer: ""
    rootSpace: ACME
    vectors: false
  tokenBudget:
    day: 1000000
    week: 5000000
    month: 20000000
  integrations:
    checkIntervalSeconds: 300
  engineConfig:
    - name: turn_engine
      value:
        max_iterations: 4
        extension_enabled: false
    - name: notification_rate_limit
      value: 5
    - name: skill_variables
      value:
        support_url: https://support.acme.example
    - name: workers
      value:
        researcher:
          description: Finds prior art.
          system_prompt: You search patents and summarise what you find.
---
apiVersion: crewlet.ai/v1alpha1
kind: Unit
metadata:
  name: rnd
spec:
  companyRef:
    name: acme
  displayName: Research and Development
  type: Division
  leadRef:
    name: vp
  purpose: Invent the next anvil.
  goals: [One patent a quarter]
  channel: "#rnd"
  knowledge: [The anvil handbook]
  project: RND
  space: RND
---
apiVersion: crewlet.ai/v1alpha1
kind: Unit
metadata:
  name: metals
spec:
  companyRef:
    name: acme
  type: Team
  parentRef:
    name: rnd
---
apiVersion: crewlet.ai/v1alpha1
kind: Unit
metadata:
  name: alloys
spec:
  companyRef:
    name: acme
  displayName: Alloys Squad
  type: Squad
  parentRef:
    name: metals
  leadRef:
    name: smith
---
apiVersion: crewlet.ai/v1alpha1
kind: Unit
metadata:
  name: anvils
spec:
  companyRef:
    name: acme
  type: Team
  parentRef:
    name: rnd
---
apiVersion: crewlet.ai/v1alpha1
kind: Seat
metadata:
  name: wile
spec:
  companyRef:
    name: acme
  kind: Human
  displayName: Wile E.
  email: wile@acme.example
  manages:
    - kind: Unit
      name: rnd
  contact:
    slackUserID: U0WILE
    githubLogin: wile-e
  availability: Mornings only
---
apiVersion: crewlet.ai/v1alpha1
kind: Seat
metadata:
  name: assistant
spec:
  companyRef:
    name: acme
  handle: chief-of-staff
  displayName: Chief of Staff
  project: COS
  space: COS
  workers: [researcher]
  learningEnabled: false
---
apiVersion: crewlet.ai/v1alpha1
kind: Seat
metadata:
  name: vp
spec:
  companyRef:
    name: acme
  displayName: VP of R&D
  unitRef:
    name: rnd
  goal: Keep R&D pointed at what sells.
  backstory: Twenty years of anvils.
  responsibilities: [Roadmap]
  behavioralGuidelines: [Decide in writing.]
  tokenBudget:
    week: 400000
---
apiVersion: crewlet.ai/v1alpha1
kind: Seat
metadata:
  name: smith
spec:
  companyRef:
    name: acme
  unitRef:
    name: alloys
  manages:
    - name: welder
---
apiVersion: crewlet.ai/v1alpha1
kind: Seat
metadata:
  name: welder
spec:
  companyRef:
    name: acme
  unitRef:
    name: alloys
  placement:
    pool: data
---
apiVersion: crewlet.ai/v1alpha1
kind: Seat
metadata:
  name: caster
spec:
  companyRef:
    name: acme
  unitRef:
    name: metals
---
apiVersion: crewlet.ai/v1alpha1
kind: MCPServer
metadata:
  name: catalog
spec:
  companyRef:
    name: acme
  transport: Stdio
  shared: true
  command: catalog-mcp
  args: [--read-only, --region, us]
  toolPrefix: cat_
  toolAnnotations:
    - tool: delete_item
      destructive: true
      readOnly: false
    - tool: search
      readOnly: true
      idempotent: true
      openWorld: false
  startupTimeoutSeconds: 30
  requestTimeoutSeconds: 120
---
# A unit's standup each of its agent seats runs, in another zone than the
# company's, with every setting a schedule has.
apiVersion: crewlet.ai/v1alpha1
kind: Schedule
metadata:
  name: alloys-standup
spec:
  companyRef:
    name: acme
  target:
    unitRef:
      name: alloys
    fanOut: Each
  schedule: "30 9 * * 1-5"
  timeZone: Asia/Tokyo
  prompt: "Post your standup: shipped yesterday, on today, blockers."
  suspend: false
  timeoutSeconds: 600
  catchUp: false
---
# A unit's report its inherited lead gathers.
apiVersion: crewlet.ai/v1alpha1
kind: Schedule
metadata:
  name: weekly-report
spec:
  companyRef:
    name: acme
  target:
    unitRef:
      name: metals
    fanOut: Lead
  schedule: "0 16 * * 5"
  prompt: Collect the week's progress from your reports and post a summary.
---
# A unit's schedule with no fanOut: each agent seat directly in it.
apiVersion: crewlet.ai/v1alpha1
kind: Schedule
metadata:
  name: inventory
spec:
  companyRef:
    name: acme
  target:
    unitRef:
      name: metals
  schedule: "0 2 1 * *"
  prompt: Count the alloys in stock.
---
# A seat's own schedule, held without firing.
apiVersion: crewlet.ai/v1alpha1
kind: Schedule
metadata:
  name: smoke
spec:
  companyRef:
    name: acme
  target:
    seatRef:
      name: caster
  schedule: "*/15 * * * *"
  prompt: Run the smoke tests and triage failures.
  suspend: true
  catchUp: true
---
# A schedule of a seat outside every unit.
apiVersion: crewlet.ai/v1alpha1
kind: Schedule
metadata:
  name: audit
spec:
  companyRef:
    name: acme
  target:
    seatRef:
      name: assistant
  schedule: "0 8 * * MON"
  prompt: Audit last week's decisions.
