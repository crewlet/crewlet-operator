# A company on models the platform provides, beside one of its own: the
# order puts a platform model first, and seats name both kinds.
apiVersion: crewlet.ai/v1alpha1
kind: EngineClass
metadata:
  name: managed
spec:
  engine:
    image: ghcr.io/crewlet/crewlet:v0.1.0
  data:
    storage:
      size: 10Gi
  platformLLMProviders:
    - name: platform-claude
      type: Anthropic
      model: claude-sonnet-5
      reasoningEffort: Medium
      apiKeySecretRefs:
        - namespace: crewlet-system
          name: platform-anthropic
          key: primary
        - namespace: crewlet-system
          name: platform-anthropic
          key: secondary
    - name: platform-gateway
      type: OpenAICompatible
      model: llama-4
      baseURL: https://llm.platform.example/v1
      timeoutSeconds: 120
---
apiVersion: crewlet.ai/v1alpha1
kind: Company
metadata:
  name: managed
spec:
  engineClassName: managed
  companyName: Managed
  llm:
    order:
      - kind: PlatformLLMProvider
        name: platform-claude
    usePlatformProviders: true
---
apiVersion: crewlet.ai/v1alpha1
kind: LLMProvider
metadata:
  name: own-openai
spec:
  companyRef:
    name: managed
  type: OpenAI
  model: gpt-5
  reasoning: true
  reasoningEffort: High
  cooldowns:
    rateLimitSeconds: 600
    authSeconds: 120
  apiKeySecretRefs:
    - name: openai
      key: apiKey
---
apiVersion: crewlet.ai/v1alpha1
kind: Seat
metadata:
  name: analyst
spec:
  companyRef:
    name: managed
  llm:
    default:
      - name: own-openai
      - kind: PlatformLLMProvider
        name: platform-claude
    judge:
      - kind: PlatformLLMProvider
        name: platform-gateway
