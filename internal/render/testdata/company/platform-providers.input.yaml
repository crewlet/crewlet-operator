# A company on models the platform provides, beside one of its own: the
# order puts a platform model first, and seats name both kinds.
apiVersion: crewlet.ai/v1alpha1
kind: EngineClass
metadata:
  name: managed
spec:
  engine:
    image: ghcr.io/crewlet/crewlet:v0.1.0
  data:
    storage:
      size: 16Gi
  platformLLMProviders:
    - name: platform-claude
      agent: ClaudeCode
      model: claude-sonnet-5
      auth:
        mode: APIKey
        apiKeySecretRef:
          namespace: crewlet-system
          name: platform-anthropic
          key: primary
    # Claude Code through the platform's gateway, which it reads from its
    # environment, on the tenant's virtual key.
    - name: platform-gateway
      agent: ClaudeCode
      model: sonnet
      timeoutSeconds: 120
      auth:
        mode: APIKey
        apiKeySecretRef:
          namespace: crewlet-system
          name: llm-gateway
          key: managed
      env:
        - name: ANTHROPIC_BASE_URL
          valueFrom:
            secretKeyRef:
              namespace: crewlet-system
              name: llm-gateway
              key: baseURL
    # OpenCode on an open model, signed in by its model provider's key.
    - name: platform-open
      agent: OpenCode
      model: openrouter/meta-llama/llama-4-maverick
      maxConcurrent: 2
      auth:
        mode: Subscription
      env:
        - name: OPENROUTER_API_KEY
          valueFrom:
            secretKeyRef:
              namespace: crewlet-system
              name: platform-openrouter
              key: apiKey
---
apiVersion: crewlet.ai/v1alpha1
kind: Company
metadata:
  name: managed
spec:
  engineClassName: managed
  companyName: Managed
  llm:
    order:
      - kind: PlatformLLMProvider
        name: platform-claude
    usePlatformProviders: true
---
apiVersion: crewlet.ai/v1alpha1
kind: LLMProvider
metadata:
  name: own-openai
spec:
  companyRef:
    name: managed
  agent: Codex
  model: gpt-5
  timeoutSeconds: 900
  auth:
    mode: APIKey
    apiKeySecretRef:
      name: openai
      key: apiKey
---
apiVersion: crewlet.ai/v1alpha1
kind: Seat
metadata:
  name: analyst
spec:
  companyRef:
    name: managed
  llm:
    default:
      - name: own-openai
      - kind: PlatformLLMProvider
        name: platform-claude
    judge:
      - kind: PlatformLLMProvider
        name: platform-gateway
    auxiliary:
      - kind: PlatformLLMProvider
        name: platform-open
