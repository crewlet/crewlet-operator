knowledge:
  backend: confluence
mcp_servers:
- args:
  - mcp-atlassian
  command: uvx
  name: atlassian
  seat_credentials:
  - field: TOKEN
    key: JIRA_API_TOKEN
    kind: atlassian
  - field: EMAIL
    key: JIRA_USERNAME
    kind: atlassian
  - field: TOKEN
    key: CONFLUENCE_API_TOKEN
    kind: atlassian
  - field: EMAIL
    key: CONFLUENCE_USERNAME
    kind: atlassian
  shared: false
  transport: stdio
name: Helix
providers:
  llm:
    claude:
      agent: claude-code
      auth:
        api_key: ${K8S_ANTHROPIC_API_KEY_NP33B5LRRKLS}
        mode: api-key
      model: claude-sonnet-5
      state_dir: /var/lib/crewlet/llm-cli/claude
  llm_order:
  - claude
  sandbox:
    default_run_in: direct
    local:
      state_dir: /var/lib/crewlet-sandboxes
roles:
- contact:
    atlassian_account_id: 557058:0d3b7c6e-2a41-4c8f-9e1d-5b6a7c8d9e0f
    mattermost_user_id: lena.ortiz
  handle: lena
  kind: human
  name: Lena Ortiz
