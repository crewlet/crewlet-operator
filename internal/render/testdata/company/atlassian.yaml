      - OPS
    datadog:
      enabled: true
      role: 4f0e2b3c-1a2b-11ef-9c2b-da7ad0900002
    jira:
      enabled: true
      project_role: "10101"
      projects:
      - OPS
    mattermost:
      bot_token: ${K8S_TRIAGE_MATTERMOST_BOT_TOKEN_GXVBDKKLZ7W7}
      channels:
      - ops
      - incidents
      enabled: true
      roles:
      - system_user
      - system_post_all_public
