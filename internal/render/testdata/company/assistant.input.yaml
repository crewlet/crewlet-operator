# Ask Crewlet on Claude Code on a metered key, a provider that keeps its web
# tools for any seat on it: Crewlet turns them off for Ask Crewlet's own run,
# so the provider needs no webTools. Each person's Ask Crewlet has a daily
# budget of its own. A Pi provider beside it, on its model provider's key,
# turns its harness's web tools off for every run, which renders as its
# entry's overrides. Deep work hands a large task to Claude Code, signed in
# by a headless token that follows the run into the company's E2B sandbox,
# where Crewlet places it as the company configures one; its runs reach the
# person's assistant tools through the company's public address, so the case
# is exposed.
apiVersion: crewlet.ai/v1alpha1
kind: Company
metadata:
  name: helm
spec:
  engineClassName: basic
  companyName: Helm
  atlas:
    retentionSeconds: 34560000
    refreshIntervalSeconds: 1800
    agentRecords: false
    ownerWakes: false
  assistant:
    model:
      name: assistant
    tokenBudget:
      day: 200000
    deepWork:
      llm:
        name: assistant-deep
      timeoutSeconds: 900
      maxSteps: 120
      maxTokens: 2000000
  sandbox:
    defaultRunIn: E2B
    e2b:
      apiKeySecretRef:
        name: e2b
        key: apiKey
---
apiVersion: crewlet.ai/v1alpha1
kind: LLMProvider
metadata:
  name: assistant
spec:
  companyRef:
    name: helm
  harness: ClaudeCode
  model: sonnet
  timeoutSeconds: 90
  maxConcurrent: 4
  auth:
    mode: APIKey
    apiKeySecretRef:
      name: anthropic
      key: apiKey
---
apiVersion: crewlet.ai/v1alpha1
kind: LLMProvider
metadata:
  name: pi
spec:
  companyRef:
    name: helm
  harness: Pi
  model: openrouter/anthropic/claude-sonnet-5
  webTools: Denied
  auth:
    mode: Subscription
  env:
    - name: OPENROUTER_API_KEY
      valueFrom:
        secretKeyRef:
          name: openrouter
          key: apiKey
---
apiVersion: crewlet.ai/v1alpha1
kind: LLMProvider
metadata:
  name: assistant-deep
spec:
  companyRef:
    name: helm
  harness: ClaudeCode
  model: sonnet
  auth:
    mode: Subscription
    tokenSecretRef:
      name: claude
      key: token
