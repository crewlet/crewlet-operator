# The Dashboard Assistant on two providers that turn their CLI's web tools
# off, which Crewlet requires of every model in spec.assistant.llm: Claude
# Code on a metered key first, then Pi on its model provider's key. Every
# bound is set, and each person's assistant has a daily budget of its own.
# Deep work hands a large task to Claude Code in mode Box, signed in by a
# headless token that follows the run into the company's E2B sandbox, which
# the API requires of deep work; its runs reach the person's assistant tools
# through the company's public address, so the case is exposed.
apiVersion: crewlet.ai/v1alpha1
kind: Company
metadata:
  name: helm
spec:
  engineClassName: basic
  companyName: Helm
  assistant:
    enabled: true
    llm:
      - name: assistant
      - name: assistant-pi
    maxSteps: 12
    turnTimeoutSeconds: 180
    proposalTTLSeconds: 600
    retentionDays: 90
    tokenBudget:
      day: 200000
    deepWork:
      llm:
        name: assistant-deep
      timeoutSeconds: 900
      maxSteps: 120
      maxTokens: 2000000
  sandbox:
    e2b:
      apiKeySecretRef:
        name: e2b
        key: apiKey
---
apiVersion: crewlet.ai/v1alpha1
kind: LLMProvider
metadata:
  name: assistant
spec:
  companyRef:
    name: helm
  agent: ClaudeCode
  model: sonnet
  timeoutSeconds: 90
  maxConcurrent: 4
  webTools: Denied
  auth:
    mode: APIKey
    apiKeySecretRef:
      name: anthropic
      key: apiKey
---
apiVersion: crewlet.ai/v1alpha1
kind: LLMProvider
metadata:
  name: assistant-pi
spec:
  companyRef:
    name: helm
  agent: Pi
  model: openrouter/anthropic/claude-sonnet-5
  webTools: Denied
  auth:
    mode: Subscription
  env:
    - name: OPENROUTER_API_KEY
      valueFrom:
        secretKeyRef:
          name: openrouter
          key: apiKey
---
apiVersion: crewlet.ai/v1alpha1
kind: LLMProvider
metadata:
  name: assistant-deep
spec:
  companyRef:
    name: helm
  agent: ClaudeCode
  model: sonnet
  mode: Box
  auth:
    mode: Subscription
    tokenSecretRef:
      name: claude
      key: token
