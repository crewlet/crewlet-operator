# KimiCode as a seat's executor, its harness's own agentic run in a box on the
# engine pod that holds the seat, signed in by a Moonshot key under auth mode
# APIKey, which a run carries into its box as KIMI_MODEL_API_KEY.
apiVersion: crewlet.ai/v1alpha1
kind: Company
metadata:
  name: wharf
spec:
  engineClassName: basic
  companyName: Wharf
---
apiVersion: crewlet.ai/v1alpha1
kind: LLMProvider
metadata:
  name: kimi
spec:
  companyRef:
    name: wharf
  harness: KimiCode
  model: kimi-k2-turbo-preview
  auth:
    mode: APIKey
    apiKeySecretRef:
      name: kimi
      key: apiKey
---
apiVersion: crewlet.ai/v1alpha1
kind: Seat
metadata:
  name: builder
spec:
  companyRef:
    name: wharf
  goal: Build what the backlog asks for.
  llm:
    default:
      - name: kimi
