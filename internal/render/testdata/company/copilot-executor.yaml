name: Wharf
providers:
  llm:
    copilot:
      auth:
        api_key: ${K8S_COPILOT_API_KEY_YZ5MBUNQOVSH}
        mode: api-key
      harness: copilot
      model: claude-sonnet-4.5
      state_dir: /var/lib/crewlet/llm-harness/copilot
  llm_order:
  - copilot
  sandbox:
    default_run_in: e2b
    e2b:
      api_key: ${K8S_E2B_API_KEY_GSEHAAV5THN5}
roles:
- goal: Build what the backlog asks for.
  handle: builder
  kind: agent
  llm:
    default:
    - copilot
  name: builder
  placement:
    labels:
      crewlet.ai/pool: data
seat_access_migrated:
- app_store_connect
- atlassian
- aws
- cloudflare
- datadog
- digitalocean
- expo
- github
- gitlab
- google_cloud
- mattermost
- scaleway
- slack
- ssh
