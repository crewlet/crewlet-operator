name: Wharf
providers:
  llm:
    copilot:
      auth:
        api_key: ${K8S_COPILOT_API_KEY_YZ5MBUNQOVSH}
        mode: api-key
      harness: copilot
      model: claude-sonnet-4.5
      state_dir: /var/lib/crewlet/llm-harness/copilot
  llm_order:
  - copilot
  sandbox:
    default_run_in: direct
    local:
      state_dir: /var/lib/crewlet-sandboxes
roles:
- goal: Build what the backlog asks for.
  handle: builder
  kind: agent
  llm:
    default:
    - copilot
  name: builder
  placement:
    labels:
      crewlet.ai/pool: data
seat_access_migrated:
- admob
- adsense
- app_store_connect
- apple_ads
- atlassian
- aws
- cloudflare
- datadog
- digitalocean
- expo
- github
- gitlab
- google_ads
- google_analytics
- google_cloud
- google_play
- mattermost
- meta_ads
- scaleway
- search_console
- slack
- ssh
