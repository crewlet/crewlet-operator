# OpenCode as a seat's executor in box mode, signed in by its model
# provider's key in env, which a box-mode run carries into the
# company's E2B sandbox, and its model written <provider>/<model>, as
# OpenCode reads it. The seat codes in that run, so Crewlet offers it no
# run_sandbox; a second seat's code work runs OpenCode, the company's
# default coding agent, on an OpenCode provider in mode Host on Anthropic's
# key. Box mode calls the seat's tools back through the company's public
# address, so the case is exposed.
apiVersion: crewlet.ai/v1alpha1
kind: Company
metadata:
  name: harbor
spec:
  engineClassName: basic
  companyName: Harbor
  sandbox:
    e2b:
      apiKeySecretRef:
        name: e2b
        key: apiKey
    defaultCodingAgent: OpenCode
---
apiVersion: crewlet.ai/v1alpha1
kind: LLMProvider
metadata:
  name: opencode
spec:
  companyRef:
    name: harbor
  agent: OpenCode
  model: openrouter/anthropic/claude-sonnet-5
  mode: Box
  runIn: E2B
  auth:
    mode: Subscription
  env:
    - name: OPENROUTER_API_KEY
      valueFrom:
        secretKeyRef:
          name: openrouter
          key: apiKey
---
apiVersion: crewlet.ai/v1alpha1
kind: LLMProvider
metadata:
  name: anthropic
spec:
  companyRef:
    name: harbor
  agent: OpenCode
  model: anthropic/claude-sonnet-5
  auth:
    mode: Subscription
  env:
    - name: ANTHROPIC_API_KEY
      valueFrom:
        secretKeyRef:
          name: anthropic
          key: apiKey
---
apiVersion: crewlet.ai/v1alpha1
kind: Seat
metadata:
  name: porter
spec:
  companyRef:
    name: harbor
  goal: Port the services to the new runtime.
  llm:
    default:
      - name: opencode
  sandbox: {}
---
apiVersion: crewlet.ai/v1alpha1
kind: Seat
metadata:
  name: fixer
spec:
  companyRef:
    name: harbor
  goal: Fix what the port breaks.
  llm:
    default:
      - name: anthropic
  sandbox: {}
