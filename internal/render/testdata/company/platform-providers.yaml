name: Managed
providers:
  llm:
    own-openai:
      auth:
        api_key: ${K8S_OPENAI_API_KEY_LEK6X7NDATC5}
        mode: api-key
      harness: codex
      model: gpt-5
      state_dir: /var/lib/crewlet/llm-harness/own-openai
      timeout_seconds: 900
    platform-claude:
      auth:
        api_key: ${K8S_PLATFORM_ANTHROPIC_PRIMARY_HCBRZ7ARUTYC}
        mode: api-key
      harness: claude-code
      model: claude-sonnet-5
      state_dir: /var/lib/crewlet/llm-harness-platform/platform-claude
    platform-gateway:
      auth:
        api_key: ${K8S_LLM_GATEWAY_MANAGED_45Y2DKZI6CGV}
        mode: api-key
      env:
        ANTHROPIC_BASE_URL: ${K8S_LLM_GATEWAY_BASE_URL_PXXCUBURYS7S}
      harness: claude-code
      model: sonnet
      state_dir: /var/lib/crewlet/llm-harness-platform/platform-gateway
      timeout_seconds: 120
    platform-open:
      auth:
        mode: subscription
      env:
        OPENROUTER_API_KEY: ${K8S_PLATFORM_OPENROUTER_API_KEY_J33ZA5F6K5WB}
      harness: opencode
      max_concurrent: 2
      model: openrouter/meta-llama/llama-4-maverick
      state_dir: /var/lib/crewlet/llm-harness-platform/platform-open
  llm_order:
  - platform-claude
  - own-openai
  - platform-gateway
  - platform-open
  sandbox:
    default_run_in: direct
    local:
      state_dir: /var/lib/crewlet-sandboxes
roles:
- handle: analyst
  kind: agent
  llm:
    auxiliary:
    - platform-open
    default:
    - own-openai
    - platform-claude
    judge:
    - platform-gateway
  name: analyst
  placement:
    labels:
      crewlet.ai/pool: data
seat_access_migrated:
- atlassian
- aws
- cloudflare
- datadog
- digitalocean
- expo
- github
- gitlab
- mattermost
- slack
